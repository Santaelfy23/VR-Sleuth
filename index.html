let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,dur,type='sine',vol=.18){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);
  g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+dur);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05);}
function pop(t0,vol=.12){const a=ac();if(!a)return;const n=a.sampleRate*.25,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start(a.currentTime+t0);}
function sfx(kind){if(P.sound===false)return;try{
  if(kind==='right'){[523,659,784].forEach((f,i)=>tone(f,i*.08,.25,'triangle'));tone(1047,.24,.35,'sine',.12);}
  else if(kind==='wrong'){tone(330,0,.18,'sine',.1);tone(262,.12,.28,'sine',.1);}
  else if(kind==='streak'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.22,'square',.07));}
  else if(kind==='tap'){tone(880,0,.06,'sine',.06);}
  else if(kind==='fanfare'){[[523,0],[523,.15],[523,.3],[659,.45],[784,.75],[659,.95],[784,1.1]].forEach(([f,t],i)=>tone(f,t,i===6?.6:.18,'triangle',.14));}
  else if(kind==='boom'){pop(0,.15);}
}catch(e){}}

function fireworks(bursts=5){
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:61';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext('2d'),cols=['#ffc94d','#b18cff','#6ea8ff','#3ddc97','#ff6b81','#ffffff','#ff9f43'];
  const rockets=[],sparks=[];let made=0,t=0;
  function launch(){rockets.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight,vy:-(innerHeight*.018+Math.random()*4),ty:innerHeight*(.15+Math.random()*.3),c:cols[Math.random()*cols.length|0]});made++;}
  (function f(){t++;if(made<bursts&&t%14===1)launch();
    g.fillStyle='rgba(0,0,0,0)';g.clearRect(0,0,c.width,c.height);
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy;g.fillStyle=r.c;g.fillRect(r.x-1.5,r.y,3,8);
      if(r.y<=r.ty){rockets.splice(i,1);sfx('boom');for(let k=0;k<60;k++){const a=Math.random()*Math.PI*2,sp=Math.random()*5+1.5;sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:60+Math.random()*25,c:Math.random()<.3?'#fff':r.c});}}}
    for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.vx*=.97;p.vy=p.vy*.97+.07;p.x+=p.vx;p.y+=p.vy;p.l--;g.globalAlpha=Math.max(0,p.l/80);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.2,0,7);g.fill();g.globalAlpha=1;if(p.l<=0)sparks.splice(i,1);}
    if(made<bursts||rockets.length||sparks.length)requestAnimationFrame(f);else c.remove();})();
}

const FOCUS_N=12, FOCUS_GOOD=.85, FOCUS_DROP=.70, FOCUS_WIN=20;
const qType=(k,it)=>k==='odd'?it.check:(it.type||k);
const TYPE_NAME={mc:'questions',count:'how many?',wtype:'what type?',so:'subject / object',sent:'determiner or pronoun in a sentence',notp:'NOT a pronoun / determiner',choose:'choose the word',meaning:'meaning',sound:'sound (silent letters & sound-alikes)',letters:'letters (anagrams)',dbl:'double meanings',move:'move a letter',add:'add-on words',join:'join the words',extra:'extra word',lets:'letter strings',cloze:'word in a sentence',opp:'opposites',ana:'analogies'};
function caseTypes(k){return [...new Set(DATA[k].map(x=>qType(k,x)))];}
function seedRecent(){if(P.recent)return;P.recent={};const idx={};
  for(const k in CASES){DATA[k].forEach(x=>idx[x.id]=[k,x]);(DATA.real[k]||[]).forEach(x=>idx[x.id]=[k,x]);}
  for(const k in P.seen)for(const id in P.seen[k]){const e=idx[id];if(!e)continue;(P.recent[e[0]]=P.recent[e[0]]||[]).push({t:qType(e[0],e[1]),ok:P.seen[k][id]});}
  for(const k in P.recent)P.recent[k]=P.recent[k].slice(-FOCUS_WIN);}
function mastery(k){const rec=(P.recent||{})[k]||[];const n=rec.length,r=rec.filter(x=>x.ok).length,acc=n?r/n:0;
  const cnt={};rec.forEach(x=>cnt[x.t]=(cnt[x.t]||0)+1);const missing=caseTypes(k).filter(t=>(cnt[t]||0)<2);
  const was=(P.safe||{})[k];const safe=missing.length===0&&n>=FOCUS_N&&(acc>=FOCUS_GOOD||(was&&acc>=FOCUS_DROP));
  return {n,r,acc,missing,safe};}
function focusOn(){return P.focusLock!==false;}
function focusCases(){return Object.keys(CASES).filter(k=>!mastery(k).safe);}

function recordFocus(k,it,ok){if(!(k in CASES))return;seedRecent();const before=focusCases();
  (P.recent[k]=P.recent[k]||[]).push({t:qType(k,it),ok:ok?1:0});P.recent[k]=P.recent[k].slice(-FOCUS_WIN);

/* ---------- TRICKS & LESSONS ---------- */
const TRICKS={
 cemtime:{short:`<ol class="steps"><li>CEM isn't adaptive, but it's <b>fast</b>. Every question is worth the same, so don't get stuck on a hard one.</li><li>Use the trick, but if a question takes more than about <b>30 seconds</b>, make your best guess (or skip) and move on.</li><li><b>Never leave a blank.</b> A guess might score; a blank never does.</li><li>Keep half an eye on the clock. With 2 minutes left, answer everything that's left, even quickly.</li><li>Speed comes from the tricks, not from rushing: "check the other half" takes only 2 seconds!</li></ol>`},
 wf:{short:`<ol class="steps"><li><b>"the ___"</b> works → <b>noun</b> (the honesty ✓).</li><li><b>"a very ___ one"</b> works → <b>adjective</b> (a very fragile one ✓, and a very lovely one ✓: -ly can be an adjective!).</li><li><b>"I ___" / "I have ___" / "I am ___"</b> works → <b>verb</b> (I wept ✓, I have written ✓).</li><li><b>"She did it ___"</b> works → <b>adverb</b> (genuinely ✓, often ✓).</li><li>In lists, <b>test every word</b> before you count.</li></ol>`},
 nwc:{short:`<ol class="steps"><li>Look at what comes <b>straight after</b> the word.</li><li>A <b>thing</b> → <b>preposition</b> (before <i>bed</i>, since <i>Tuesday</i>, despite <i>the rain</i>).</li><li><b>Someone doing something</b> → <b>conjunction</b> (before <i>you eat</i>, since <i>it rained</i>).</li><li><b>Nothing</b> → <b>adverb</b> (I've seen it <i>before</i>.)</li></ol>`},
 so:{short:`<ol class="steps"><li>Find the <b>verb</b> first and tap it.</li><li>Ask <b>"Who or what did it?"</b> → the <b>subject</b>. Skip opening phrases like "Shocked by the news,".</li><li>Ask <b>"Verb + what?"</b> → the <b>object</b>. People after <i>to / for</i> aren't the object; keep <i>of</i> phrases together.</li><li><b>"was / were … by"</b>: the subject is the word before <i>was</i>, and the object is <b>none</b>.</li></ol>`},
 cl:{short:`<ol class="steps"><li><b>Clause</b> = someone doing something (the race started). No doer + verb → <b>phrase</b>.</li><li>The <b>main clause</b> makes sense on its own.</li><li>One clause → simple. Joined by FANBOYS (for, and, nor, but, or, yet, so) → compound. Joined by because/when/although/if → complex.</li><li><b>whose</b> + owner noun · <b>whom</b> after with/to/for · <b>who</b> = the doer.</li></ol>`},
 wb:{short:`<ol class="steps"><li><b>Simple</b> = one root (jump). <b>Compound</b> = two real words that build the meaning (football, pencil case, state-of-the-art). <b>Complex</b> = root + prefix/suffix (unhappiness, careful).</li><li>Fake compounds: car+pet, is+land, care+ful. Do both parts really make the meaning?</li><li>Homophones: read the sentence with each spelling and ask what it <b>means</b>.</li></ol>`},
 own:{short:`<p style="margin:4px 0"><b>👂 Test 1: "That's ___!"</b></p><ol class="steps"><li>Put the word at the end of <b>"That's ___!"</b> and say it out loud.</li><li>Sounds finished (<i>That's mine!</i> ✓) → it can stand alone, so it's a <b>pronoun</b>.</li><li>Sounds unfinished (<i>That's their…</i> what?) → it needs a noun after it (<i>their book</i>), so it's a <b>determiner</b>.</li></ol>
  <p style="margin:4px 0"><b>🔁 Test 2 for <i>her</i>: swap in <i>him</i> or <i>his</i></b></p><ol class="steps"><li><i>I helped her</i> → <i>I helped <b>him</b></i> ✓ → pronoun.</li><li><i>Her kite</i> → <i><b>his</b> kite</i> ✓ → determiner.</li><li><i>His</i> can do both too: noun straight after it → determiner; standing alone → pronoun.</li></ol>
  <p style="margin:4px 0">⭐ Owner words <b>never</b> take an apostrophe: <i>ours, yours, its</i>. <i>It's</i> = it is, <i>they're</i> = they are.</p>`},
 adaptive:{short:`<ol class="steps"><li>You <b>can't go back</b>, so each answer has to be right before you click.</li><li>Right answers make the next question harder, and harder questions are worth more. A rushed mistake costs more than the seconds it saves.</li><li>If questions suddenly feel hard, that's a <b>good sign</b>. It means you're doing well. Stay calm and run your trick.</li><li>Never click in under 8 seconds. Run the check, then click.</li></ol>`},
 odd:{short:`<ol class="steps"><li><b>Meaning</b>: are three of them the same kind of thing, or do they mean the same?</li><li><b>Sound</b>: say each word slowly in your head. Listen for <b>silent letters</b> and <b>sound-alikes</b> (homophones like peek/peak).</li><li><b>Letters</b>: are three of them made of the same letters (anagrams)?</li></ol><p style="margin:4px 0 0">If meaning doesn't split them, <b>don't guess</b>. Move on to sound, then letters.</p>`},
 link:{short:`<ol class="steps"><li>Try each letter on the <b>right-hand word first</b>. Fewer letters can start a word, so this rules out the most options fast.</li><li>Put the survivors on the <b>left-hand word</b>.</li><li>Only click when <b>both</b> are real words. One out of two is still wrong!</li></ol>`},
 stolen:{short:`<ol class="steps"><li>Read the whole sentence and <b>say what word should be there</b> (e.g. "They <b>CONTRI__ED</b> articles" → contributed).</li><li>Line it up with the capitals to see which 3 letters are missing.</li><li>Check the answer is in the options and makes a real word.</li></ol>`},
 quest:{short:`<p style="margin:4px 0"><b>🔗 Join the words</b>: every combination.</p><ol class="steps"><li>Take the <b>first</b> word in bracket 1 and try it with <b>each</b> word in bracket 2. Then the second word, then the third (9 tries at most).</li><li>One word must come from <b>each</b> bracket. "within" doesn't count if both words are in bracket 1!</li></ol>
  <p style="margin:4px 0"><b>🧩 Extra word</b>: build it, then spot the leftover.</p><ol class="steps"><li>Find the <b>action word</b> (verb) and <b>who</b> is doing it: "the birds were chirping".</li><li>Add the rest. The word with no job is the extra one.</li><li>Quick check: match every <b>a / an / the</b> to a noun (the sun, the birds, an hour), and spot the spare.</li></ol>
  <p style="margin:4px 0"><b>🔤 Letter strings</b>: both words, by spelling.</p><ol class="steps"><li>Read <b>both</b> finished words before you click.</li><li>Use endings: <b>-us</b> words usually end <b>-ous / -ious / -xious</b>.</li><li>Don't trust sound: ksh, csh and xio can all sound alike, but only one is spelt right.</li></ol>
  <p style="margin:4px 0"><b>📝 Word in a sentence</b>: clue words, then swap.</p><ol class="steps"><li>Find the <b>clue words</b> in the sentence ("quiet retirement", "not good for you").</li><li>Positive or negative? Then <b>swap each option in</b> and read it aloud.</li><li>Don't pick a word just because it sounds clever. If you don't know it, rule out the ones you <b>do</b> know.</li></ol>
  <p style="margin:4px 0"><b>↔️ Opposites</b>: same type, opposite meaning.</p><ol class="steps"><li>Words that mean the <b>same</b> (risk/hazard) are traps, and so are words that just go together (key/unlock).</li><li>Test it: "If it isn't <i>safe</i>, it's <i>risky</i>" ✓</li></ol>
  <p style="margin:4px 0"><b>🔁 Analogies</b>: find the rule, then copy it.</p><ol class="steps"><li>Say the link: "a puppy grows into a dog".</li><li>No meaning link? Check the <b>letters</b>: first letter off (s|mile), backwards (rat/tar), add a letter (ear/year).</li><li>The same rule must work for <b>both</b> pairs.</li></ol>`},
 cem:{short:`<p style="margin:4px 0"><b>🔁 Double meanings</b>: one pair at a time.</p><ol class="steps"><li>Find the options that fit the <b>first pair</b>.</li><li>Test only those on the <b>second pair</b>. The answer must fit <b>both</b>, and options that fit one pair are traps.</li></ol>
  <p style="margin:4px 0"><b>✂️ Move a letter</b>: take out, then put in.</p><ol class="steps"><li>Take each letter out of the first word. Keep only the ones that <b>leave a real word</b>.</li><li>Try fitting each of those letters <b>anywhere</b> in the second word.</li></ol>
  <p style="margin:4px 0"><b>➕ Add-on words</b>: glue it and say it.</p><ol class="steps"><li>Stick each option onto the end of <b>every</b> word and say it out loud.</li><li>Only one combination makes a real word (pant + her = panther).</li></ol>`},
 syn:{short:`<ol class="steps"><li><b>Put the word in a sentence</b>: "The <i>costly</i> bike…"</li><li>Use the two letters: list every word you know that starts that way (<b>ex</b>… expensive, extra, exciting).</li><li><b>Swap test</b>: put each one in your sentence. Same meaning <b>and</b> same type of word (describing word for describing word)? That's it.</li></ol><p style="margin:4px 0 0">Stuck? Tap 💡 for how many letters it has.</p>`},
 sel:{short:`<ol class="steps"><li><b>Clue first, then count the boxes.</b> "Anger" + 5 boxes → 5-letter words for anger.</li><li>Think of <b>2-3 words</b> before you look hard at the big word.</li><li><b>Tick the letters off</b> in the big word. They can come from anywhere, in any order, but each letter only once.</li><li><b>Never leave it blank.</b> A guess might score; a blank never does.</li></ol>`},
 codes:{short:`<ol class="steps"><li><b>Number</b> the letters in the first two words: 1 2 3 4.</li><li>For each letter of the middle word, write <b>where it came from</b> (e.g. "word 1, letter 3").</li><li><b>Check</b> your rule rebuilds the middle word exactly.</li><li>Apply the <b>same rule</b> to the second group. Never pick from one word only!</li></ol>`},
};

  const fun=`<div class="card" style="text-align:center"><div class="muted" style="font-weight:800;font-size:.8rem">NEW STICKER!</div><div class="bigstk">${stk}</div>
   ${rankUp?`<h2>🎉 Rank up: ${rankUp}!</h2>`:''}${buddy('Joke break! '+joke)}</div>`;
  if(R.exam){const tt=Math.min(R.limit||1e9,Math.round((Date.now()-R.t0)/1000));
    P.cases[m].lastTime=tt;save();

    if(R.timed){const left=R.queue.slice(R.i<R.n?0:R.queue.length);
      left.forEach(([k,it])=>R.review.push({k,ok:false,blank:true,secs:0,html:'<p style="margin:0">⏳ Not answered: time ran out. A quick guess could have scored here!</p>',ts:trickSteps(k,it)}));

    app.innerHTML=`<div class="card hero" style="text-align:center"><div style="font-size:2.6rem">${R.timed?'⏱️':'🎓'}</div><h1>${R.timed?'Time\'s up! Paper complete':'Exam complete!'}</h1>
    <p class="big">${R.correct}/${R.n} correct · ⭐ ${R.score}</p>
    ${R.timed?timedInfo:`<p>Time: <b>${fmtT(tt)}</b> · Average <b>${Math.round(tt/R.n)}s</b> per question · Highest level: <b>${['','Trainee','Detective','Exam level'][R.maxLevel]}</b></p>`}
    ${R.timed?'':R.rushed?`<div class="fb tip" style="text-align:left">⏱️ ${R.rushed} wrong answer${R.rushed>1?'s':''} came in under 8 seconds. Slowing down there is your quickest win.</div>`:`<div class="fb good" style="text-align:left">🧘 No rushed mistakes. That's exactly how to beat an adaptive test.</div>`}</div>
    ${fun}
    <div class="card"><h2>📋 Your review</h2>${R.review.map((r,i)=>`<details class="rev" ${r.ok||r.blank?'':'open'}><summary>${r.ok?'✅':r.blank?'⏳':'❌'} Q${i+1} · ${CASES[r.k].em} ${CASES[r.k].name} · ${r.secs}s</summary><div class="fb ${r.ok?'good':'bad'}">${r.html}</div>${r.ts?`<div class="fb tip"><b>🔎 ${r.ts.name}</b>${r.ts.html}</div>`:''}</details>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn" onclick="startRound('${m}'${R.timed?','+R.pace:''})">Another one</button><button class="btn ghost" onclick="go('home')">Home</button></div>`;
    return;}
  app.innerHTML=`<div class="card hero" style="text-align:center"><div style="font-size:3rem">${R.correct/R.n>=.7?'🏆':'🔎'}</div><h1>${msg}</h1>
  <p class="big">${R.correct}/${R.n} correct · ⭐ ${R.score}</p>
  ${m!=='mistakes'?`<p>Highest level reached: <b>${['','Trainee','Detective','Exam level'][R.maxLevel]}</b></p>`:''}
  ${R.rushed?buddy(`${R.rushed} of those were super speedy (under 8 seconds). Slow paws catch more clues! 🐾`):buddy('No rushing at all. That\'s a calm, clever detective! 🧘')}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="startRound('${m}'${m==='quick'?'':R.n===5?',5':''})">Play again</button><button class="btn ghost" onclick="go('home')">Home</button></div></div>${fun}`;
}

/* ---------- QUESTION RENDERERS ---------- */
function renderQ(k,item,opt){CUR={k,item};clearTimeout(window.paceT);if(!opt.exam&&CASES[k]&&CASES[k].sec==='gram'){const me=CUR;window.paceT=setTimeout(()=>{if(CUR!==me)return;const b=$('#qbox');if(b&&!b.querySelector('#nextBtn')&&!b.querySelector('.pacenudge')){const n=document.createElement('div');n.className='pacenudge';n.innerHTML=buddy('⏳ That\'s over a minute! Best guess and move on: easy marks count the same.');b.appendChild(n);}},60000);}({odd:qOdd,link:qLink,stolen:qStolen,codes:qCodes,cem:qCem,quest:qQuest,syn:qSyn,sel:qSel,own:qOwn,wf:qGram,nwc:qGram,so:qGram,cl:qGram,wb:qGram})[k](item,opt,$('#qbox'));}
function secsSince(){return R&&R.cur?Math.round((Date.now()-R.cur.t0)/1000):99;}
function finish(opt,ok,box,html,hdr){
  const secs=secsSince();
  if(opt.onAnswer)opt.onAnswer(ok,secs);
  if(opt.exam){sfx('tap');const ts=CUR?trickSteps(CUR.k,CUR.item):null;R.review.push({k:CUR.k,ok,secs,html,ts});box.querySelectorAll('button').forEach(b=>b.disabled=true);if(opt.onDone)opt.onDone(ok);return;}
  if(ok){const st=R&&R.streak||0;if(st>0&&st%3===0){sfx('streak');fireworks(3);toast('🔥 '+st+' in a row! Fireworks for you!');}else{sfx('right');confetti(40);}}else if(hdr)sfx('right');else sfx('wrong');
  let extra='';
  if(!ok&&!hdr&&secs<8&&!opt.guided)extra=buddy(`Psst… that was ${secs} second${secs===1?'':'s'}! Take a breath and run the trick next time. There's no rush. 🐾`);
  let lv='';
  if(R&&R.levelMsg){lv=R.levelMsg==='up'?`<div class="hint">⬆️ Level up! Questions get harder and worth more.</div>`:'';R.levelMsg=null;}
  const ts=CUR?trickSteps(CUR.k,CUR.item):null;
  const tw=ts?`<details class="fb tip" open style="margin-top:10px"><summary style="cursor:pointer;font-weight:800">🔎 How the trick cracks it: ${ts.name}</summary>${ts.html}</details>`:'';
  const d=document.createElement('div');d.innerHTML=`<div class="fb ${ok||hdr?'good':'bad'}"><h3>${hdr||(ok?BUDDY+' '+CHEERS[Math.random()*CHEERS.length|0]:SOOTHE[Math.random()*SOOTHE.length|0])}</h3>${html}</div>${tw}${extra}${lv}`;
  box.appendChild(d);
  if(opt.onDone)opt.onDone(ok);
}

/* Odd one out */
function qOdd(it,opt,box){
  const words=shuffle(it.w);
  box.innerHTML=`<p class="q">Three of these words are connected in some way. Which one does <b>not</b> fit?</p>
  <div class="opts">${words.map(w=>`<button class="opt" data-w="${w}">${w}</button>`).join('')}</div>
  <div class="checkbar"><span class="muted" style="font-size:.85rem;align-self:center">Run the checks:</span><button data-c="meaning">1 Meaning</button><button data-c="sound">2 Sound</button><button data-c="letters">3 Letters</button></div>
  <div class="hint" id="chk">${opt.guided?'Tap each check in order. Say the words out loud in your head!':''}</div>`;
  const tips={meaning:'Are three of them the same kind of thing, or do they mean the same? If not, try Sound.',sound:'Say each word slowly. Is there a letter you can\'t hear? Does any word sound like a different word (like peek/peak)?',letters:'Look at the letters. Are three of them made of exactly the same letters, just rearranged?'};
  box.querySelectorAll('.checkbar button').forEach(b=>b.onclick=()=>{$('#chk').textContent=tips[b.dataset.c];});
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.w===it.ans;
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.w===it.ans)x.classList.add('good');});
    if(!ok)b.classList.add('bad');
    box.querySelector('.checkbar').remove();$('#chk').remove();
    const secs=secsSince();
    if(opt.exam){finish(opt,ok,box,`<p style="margin:0">${esc(it.why)}</p>`);return;}
    // bonus: which check?
    const q=document.createElement('div');
    q.innerHTML=`<p class="q" style="text-align:center;margin-top:10px"><b>Bonus:</b> which check cracks this one?</p><div class="checkbar" id="bon"><button data-c="meaning">Meaning</button><button data-c="sound">Sound</button><button data-c="letters">Letters</button></div>`;
    box.appendChild(q);
    q.querySelectorAll('button').forEach(cb=>cb.onclick=()=>{
      q.querySelectorAll('button').forEach(z=>z.disabled=true);
      const right=cb.dataset.c===it.check;
      if(right){P.checks=(P.checks||0)+1;if(P.checks>=10)award('checker');if(R&&R.cur){R.score+=1;}P.points+=1;save();}
      q.innerHTML=`<div class="hint">${right?'✅ Yes! +1 bonus star':'The check that cracks it is'} <span class="chip ${it.check}">${it.check[0].toUpperCase()+it.check.slice(1)}</span></div>`;
      if(R&&R.cur)R.cur.t0=Date.now()-secs*1000;
      finish(opt,ok,box,`<p style="margin:0">${esc(it.why)}</p>`);
    });
  });
}

/* Missing link */
function qLink2(it,opt,box){
  let sel=null;const W=o=>[it.a+o,o+it.b,it.a2+o,o+it.b2];
  box.innerHTML=`<p class="q">The <b>same letter</b> must fit into <b>both</b> brackets: it ends the word before and starts the word after. Which letter?</p>
  <div class="big" style="font-size:1.35rem">${it.a} <span class="qm q1">?</span> ${it.b} &nbsp;&nbsp; ${it.a2} <span class="qm q1">?</span> ${it.b2}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div><div id="prev"></div>
  <div class="hint">${opt.guided?'Four words this time! Test the <b>right-hand</b> words first, then the left.':'Pick a letter and read <b>all four</b> words.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  const lock=$('#lock');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.o;
    box.querySelectorAll('.q1').forEach(q=>q.textContent=sel);
    const Lx=x=>'<span class="l">'+x+'</span>';$('#prev').innerHTML=`<div class="preview">${[it.a+Lx(sel),Lx(sel)+it.b,it.a2+Lx(sel),Lx(sel)+it.b2].map(w=>`<div class="pw" style="min-width:90px">${w}</div>`).join('')}</div>`;lock.disabled=false;});
  lock.onclick=()=>{const ok=sel===it.ans;
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.remove('sel');if(x.dataset.o===it.ans)x.classList.add('good');if(x.dataset.o===sel&&!ok)x.classList.add('bad');});lock.remove();
    let h=`<p style="margin:0"><b>${it.ans}</b> makes all four: ${W(it.ans).map(w=>'<b>'+w+'</b> ✓').join(' · ')}</p>`;
    if(!ok){const f=(it.traps2||{})[sel]||[0,0,0,0];h+=`<p style="margin:6px 0 0">Your <b>${sel}</b>: ${W(sel).map((w,i)=>w+' '+(f[i]?'✓':'✗')).join(' · ')}${f.some(x=>x)?'. A trap: it works for <b>some</b> words but not all four!':'.'}</p>`;}
    finish(opt,ok,box,h);};
}
function qLink(it,opt,box){
  if(it.a2)return qLink2(it,opt,box);
  let sel=null,marks={l:null,r:null};
  box.innerHTML=`<p class="q">One letter will <b>end the first word</b> and <b>start the second</b>. Which letter?</p>
  <div class="big">${it.a} <span class="qm" id="q1">?</span> &nbsp; <span class="qm" id="q2">?</span> ${it.b}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div id="prev"></div>
  <div class="hint">${opt.guided?'Tip: test the <b>right-hand</b> word first. Then mark each word real ✓ or not ✗.':'Pick a letter, read <b>both</b> words, then lock in.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  const lock=$('#lock');
  function upd(){
    $('#q1').textContent=sel||'?';$('#q2').textContent=sel||'?';
    if(!sel){$('#prev').innerHTML='';return;}
    const mk=s=>opt.guided?`<div class="mark"><button class="y ${marks[s]==='y'?'on':''}" data-s="${s}" data-v="y">✓ real</button><button class="n ${marks[s]==='n'?'on':''}" data-s="${s}" data-v="n">✗ not</button></div>`:'';
    $('#prev').innerHTML=`<div class="preview"><div class="pw">${it.a}<span class="l">${sel}</span>${mk('l')}</div><div class="pw"><span class="l">${sel}</span>${it.b}${mk('r')}</div></div>`;
    $('#prev').querySelectorAll('.mark button').forEach(b=>b.onclick=()=>{marks[b.dataset.s]=b.dataset.v;upd();});
    lock.disabled=opt.guided?!(marks.l&&marks.r):false;
    if(opt.guided&&marks.l&&marks.r&&(marks.l==='n'||marks.r==='n')){lock.textContent='Not both: pick another letter';lock.disabled=true;}
    else lock.textContent='Lock in';
  }
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.o;marks={l:null,r:null};upd();});
  lock.onclick=()=>{
    const ok=sel===it.ans;
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.remove('sel');if(x.dataset.o===it.ans)x.classList.add('good');if(x.dataset.o===sel&&!ok)x.classList.add('bad');});
    lock.remove();
    const A=it.a,B=it.b,w1=A+it.ans,w2=it.ans+B;
    let h=`<p style="margin:0"><b>${it.ans}</b> makes <b>${w1}</b> ✓ and <b>${w2}</b> ✓</p>`;
    if(!ok){const t=(it.traps||{})[sel]||'';
      if(t.includes('L')&&!t.includes('R'))h+=`<p style="margin:6px 0 0">Trap! <b>${sel}</b> makes ${A+sel} ✓ but <b>${sel+B}</b> isn't a word ✗. Always check <b>both sides</b>.</p>`;
      else if(t.includes('R')&&!t.includes('L'))h+=`<p style="margin:6px 0 0">Trap! <b>${sel}</b> makes ${sel+B} ✓ but <b>${A+sel}</b> isn't a word ✗. Always check <b>both sides</b>.</p>`;
      else h+=`<p style="margin:6px 0 0"><b>${A+sel}</b> and <b>${sel+B}</b> aren't real words. Read both words before locking in.</p>`;}
    finish(opt,ok,box,h);
  };
}

/* Stolen letters */
function qStolen(it,opt,box){
  const sent=esc(it.s).replace('{}',`<b>${it.shown}</b>`);
  box.innerHTML=`<p class="q">Three letters have been <b>stolen</b> from the word in capitals. Which 3-letter word completes it?</p>
  <div class="sent">${sent}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="sayit">🗣️ Say the word first (hint)</button></div><div class="hint" id="h"></div>`;
  let hint=0;
  $('#sayit').onclick=()=>{hint++;const f=it.full;
    if(hint===1)$('#h').innerHTML=`Read the sentence. What word would make sense? It's <b>${f.length}</b> letters long and starts <b>${f.slice(0,Math.min(3,it.at||1)||1)}…</b>`;
    else{$('#h').innerHTML=`The stolen letters go here: <b>${it.shown.slice(0,it.at)}<span class="qm">???</span>${it.shown.slice(it.at)}</b>`;$('#sayit').remove();}};
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===it.ans;
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===it.ans)x.classList.add('good');});
    if(!ok)b.classList.add('bad');

  });
}

/* Word codes */
function qCodes(it,opt,box){
  const [a,b]=it.g1,[c,d]=it.g2,mid=it.mid;
  const T=(w,g,cls='',btn=false)=>`<div><div class="tiles">${[...w].map((ch,i)=>btn?`<button class="tile ${cls}" data-g="${g}" data-p="${i}">${ch}<small>${i+1}</small></button>`:`<div class="tile ${cls}">${ch}<small>${i+1}</small></div>`).join('')}</div><div class="lab">word ${g%2===0?1:2}</div></div>`;
  box.innerHTML=`<p class="q">The middle word in the first group is made from letters of the words either side. Make the second middle word the <b>same way</b>.</p>
  <div class="codewrap">
   <div class="cgroup">${T(a,0,'',true)}<div><div class="tiles" id="midt">${[...mid].map((ch,i)=>`<div class="tile mid" data-i="${i}">${ch}</div>`).join('')}</div><div class="tiles" style="margin-top:3px">${[...mid].map((_,i)=>`<div class="srclab" style="width:38px" id="ml${i}"></div>`).join('')}</div></div>${T(b,1,'',true)}</div>
   <div class="cgroup">${T(c,2,'',true)}<div><div class="tiles">${[0,1,2,3].map(i=>`<div class="tile slot" id="as${i}">?</div>`).join('')}</div><div class="tiles" style="margin-top:3px">${[0,1,2,3].map(i=>`<div class="srclab" style="width:38px" id="al${i}"></div>`).join('')}</div></div>${T(d,3,'',true)}</div>
  </div>
  <div class="hint" id="ch"></div>
  <div class="opts" id="copts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="crack">🔢 Crack it with numbers</button></div>`;
  let step=-1,ci=0,rule=[],fill=0,crackOn=false;
  const lab=(g,p)=>`W${g%2+1}·${p+1}`;
  function startCrack(){crackOn=true;step=0;ci=0;rule=[];$('#crack')&&$('#crack').remove();box.querySelector('#copts').style.display=opt.guided?'none':'';
    hl();$('#ch').innerHTML=`Step 1: tap where the <b>${mid[0].toUpperCase()}</b> (letter 1 of the middle word) comes from.`;}
  function hl(){box.querySelectorAll('#midt .tile').forEach((t,i)=>t.classList.toggle('hl',step===0&&i===ci));}
  box.querySelectorAll('button.tile').forEach(tb=>tb.onclick=()=>{
    if(!crackOn)return;
    const g=+tb.dataset.g,p=+tb.dataset.p;
    if(step===0){
      if(g>1||[a,b][g][p]!==mid[ci]){tb.classList.add('shake');setTimeout(()=>tb.classList.remove('shake'),400);$('#ch').innerHTML=`Not that one. Find a <b>${mid[ci].toUpperCase()}</b> in the <b>first group</b>.`;return;}
      rule.push([g,p]);tb.classList.add('used');$('#ml'+ci).textContent=lab(g,p);ci++;hl();
      if(ci<4){$('#ch').innerHTML=`Now letter ${ci+1}: where does <b>${mid[ci].toUpperCase()}</b> come from?`;return;}
      // verify rule against consistent
      step=1;fill=0;
      rule.forEach((r,i)=>$('#al'+i).textContent=lab(r[0]+2,r[1]));
      $('#ch').innerHTML=`✅ Rule cracked! Step 2: use the same rule. Fill slot 1 with <b>${lab(rule[0][0]+2,rule[0][1])}</b>: tap that letter.`;
      highlightTarget();return;
    }
    if(step===1){
      const [rg,rp]=rule[fill];
      if(g!==rg+2||p!==rp){tb.classList.add('shake');setTimeout(()=>tb.classList.remove('shake'),400);$('#ch').innerHTML=`Look for <b>word ${rg+1}, letter ${rp+1}</b> in the second group.`;return;}
      $('#as'+fill).textContent=[c,d][rg][rp];$('#as'+fill).classList.add('used');fill++;highlightTarget();
      if(fill<4){$('#ch').innerHTML=`Slot ${fill+1}: tap <b>${lab(rule[fill][0]+2,rule[fill][1])}</b>.`;return;}
      step=2;const built=rule.map(([g2,p2])=>[c,d][g2][p2]).join('');
      $('#ch').innerHTML=`You built <b>${built.toUpperCase()}</b>. Now tap it in the options.`;box.querySelector('#copts').style.display='';
    }
  });
  function highlightTarget(){box.querySelectorAll('button.tile').forEach(t=>t.classList.remove('hl'));if(step===1&&fill<4){const [g,p]=rule[fill];const t=box.querySelector(`button.tile[data-g="${g+2}"][data-p="${p}"]`);if(opt.guided&&t)t.classList.add('hl');}}
  if($('#crack'))$('#crack').onclick=startCrack;
  if(opt.guided)startCrack();
  box.querySelectorAll('#copts .opt').forEach(o=>o.onclick=()=>{
    const ok=o.dataset.o===it.ans;
    box.querySelectorAll('#copts .opt').forEach(x=>{x.disabled=true;if(x.dataset.o===it.ans)x.classList.add('good');});
    if(!ok)o.classList.add('bad');
    crackOn=false;const cr=$('#crack');if(cr)cr.remove();
    const m=it.map;
    const expl=m.map(([g,p],i)=>`${mid[i]} = word ${g+1} letter ${p+1}`).join(' · ');
    const expl2=m.map(([g,p])=>`${[c,d][g][p]}`).join('');
    finish(opt,ok,box,`<p style="margin:0">Rule: ${expl}.</p><p style="margin:6px 0 0">Same rule on <b>${c}</b> and <b>${d}</b> → <b>${expl2}</b>.${ok?'':' Number the letters and write where each one comes from before picking.'}</p>`);
  });
}

/* CEM word workshop */
function qCem(it,opt,box){({dbl:qDbl,move:qMove,add:qAdd})[it.type](it,opt,box);}
function lockable(box,opt,onSel,onLock){
  let sel=null;const lock=box.querySelector('#lock');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.o;lock.disabled=false;onSel(sel);});
  lock.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.disabled=true);lock.remove();onLock(sel);};
}
function markOpts(box,ans,sel){box.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');if(x.dataset.o===ans)x.classList.add('good');if(x.dataset.o===sel&&sel!==ans)x.classList.add('bad');});}
function qDbl(it,opt,box){
  const opts=shuffle(it.opts);
  box.innerHTML=`<p class="q">Each pair of words is related. Which word goes equally well with <b>both pairs</b>?</p>
  <div class="big" style="font-size:1.2rem">(${it.p1.join(' &nbsp; ')}) &nbsp; (${it.p2.join(' &nbsp; ')})</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="hint" id="h">${opt.guided?'Step 1: which options fit the <b>first pair</b>? Then test those on the second pair.':'Does your word fit <b>both</b> pairs? Say each pair with it.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  lockable(box,opt,s=>{$('#h').innerHTML=`Test it: does <b>${s}</b> fit (${it.p1.join(', ')})? &nbsp;And (${it.p2.join(', ')})?`;},s=>{
    markOpts(box,it.ans,s);const ok=s===it.ans;$('#h').remove();
    finish(opt,ok,box,`<p style="margin:0">${esc(it.why)}</p>${ok?'':'<p style="margin:6px 0 0">Your word probably fitted only one pair. One pair at a time, then test on the other!</p>'}`);});
}
function qMove(it,opt,box){
  box.innerHTML=`<p class="q">${it.n2?'Move <b>two letters</b> (staying together) from the first word to the second word to make <b>two new words</b>. Which letters?':'Move <b>one letter</b> from the first word to the second word to make <b>two new words</b>. Which letter?'}</p>
  <div class="big">${it.w1} &nbsp; ${it.w2}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div id="prev"></div><div class="hint">${opt.guided?(it.n2?'Step 1: take each pair of letters out. Does it leave a real word? Step 2: can the pair fit anywhere in the second word, staying together?':'Step 1: take each letter out. Does it leave a real word? Step 2: can it fit anywhere in the second word?'):'Take out, then put in. Check both new words.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  lockable(box,opt,s=>{const i=it.w1.indexOf(s);const left=it.w1.slice(0,i)+it.w1.slice(i+s.length);
    $('#prev').innerHTML=`<div class="preview"><div class="pw">${it.w1} − <span class="l">${s}</span> = ${left}<div class="hint" style="margin:2px 0 0">Real word?</div></div><div class="pw">${it.w2} + <span class="l">${s}</span> = ?<div class="hint" style="margin:2px 0 0">Can it fit anywhere?</div></div></div>`;},s=>{
    markOpts(box,it.ans,s);const ok=s===it.ans;
    let h=`<p style="margin:0">Move <b>${it.ans}</b>: ${it.w1} → <b>${it.r1}</b> ✓ and ${it.w2} → <b>${it.r2}</b> ✓</p>`;
    if(!ok){const t=(it.traps||{})[s];h+=t?`<p style="margin:6px 0 0">Trap! Taking out <b>${s}</b> leaves ${t} ✓, but <b>${s}</b> can't go anywhere in ${it.w2} to make a word ✗.</p>`:`<p style="margin:6px 0 0">Taking <b>${s}</b> out of ${it.w1} doesn't leave a real word. Do step 1 first!</p>`;}
    finish(opt,ok,box,h);});
}
function qAdd(it,opt,box){
  box.innerHTML=`<p class="q">Which word can be placed <b>after one</b> of these words to make a new, correctly spelt word?</p>
  <div class="big" style="font-size:1.4rem">${it.words.join(' &nbsp; · &nbsp; ')}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div id="prev"></div><div class="hint">${opt.guided?'Glue the option onto <b>every</b> word and say each one out loud.':'Glue it and say it, onto every word!'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  lockable(box,opt,s=>{$('#prev').innerHTML=`<div class="preview">${it.words.map(w=>`<div class="pw" style="min-width:90px">${w}<span class="l">${s}</span></div>`).join('')}</div>`;},s=>{
    markOpts(box,it.ans,s);const ok=s===it.ans;
    finish(opt,ok,box,`<p style="margin:0">${it.base} + <b>${it.ans}</b> = <b>${it.full}</b>.</p>${ok?'':`<p style="margin:6px 0 0">${it.words.map(w=>w+s).join(', ')}: none of these is a word. Say each one aloud before locking in.</p>`}`);});
}

/* Synonym Safe */
const normW=x=>String(x).toLowerCase().replace(/[^a-z]/g,'');
function qSyn(it,opt,box){
  box.innerHTML=`<p class="q">Finish the word that means the <b>same</b> as:</p>
  <div class="big" style="font-size:2rem">${esc(it.w)}</div>
  <form class="syngiven" id="synf" autocomplete="off">${[...it.g].map(c=>`<span class="tile">${c}</span>`).join('')}<input id="syni" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="rest of the word"></form>
  <div class="hint" id="h">${opt.guided?'Say it in a sentence: "The <b>'+esc(it.w)+'</b>…" Now list words starting <b>'+it.g+'</b> and swap each one in.':'Sentence swap: same meaning, same type of word?'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="len" type="button">💡 How many letters?</button><button class="btn" id="lock" type="button">Lock in</button></div>`;
  const inp=$('#syni');setTimeout(()=>inp.focus({preventScroll:true}),50);
  $('#len').onclick=()=>{const a=it.ans[0];$('#h').innerHTML=`<b style="letter-spacing:3px">${it.g}${'_'.repeat(Math.max(0,normW(a).length-2)).split('').join(' ')}</b> (${normW(a).length} letters)`;$('#len').disabled=true;inp.focus();};
  const go=()=>{
    const typed=inp.value.trim();if(!typed&&!opt.exam){inp.focus();box.querySelector('.syngiven').classList.add('shake');setTimeout(()=>box.querySelector('.syngiven').classList.remove('shake'),400);return;}
    const full=normW(it.g+typed),rest=normW(typed);
    const hit=it.ans.find(a=>normW(a)===full||(rest.length>2&&normW(a)===rest));
    const ok=!!hit;inp.readOnly=true;inp.classList.add(ok?'good':'bad');$('#lock').remove();$('#len').remove();const hh=$('#h');if(hh)hh.remove();
    const others=it.ans.filter(a=>a!==(hit||it.ans[0]));
    finish(opt,ok,box,`<p style="margin:0"><b>${esc(it.w)}</b> → <b>${esc(hit||it.ans[0])}</b>${others.length?` <span class="muted">(also: ${others.map(esc).join(', ')})</span>`:''}</p><p style="margin:6px 0 0"><b>${esc(it.w)}</b> means ${esc(it.mean)}.</p>`);
  };
  $('#lock').onclick=go;$('#synf').onsubmit=e=>{e.preventDefault();if(!inp.readOnly)go();else{const n=$('#nextBtn');if(n)n.click();}};
}

/* Letter Thief (selected letters) */
let SELKEY=null;
document.addEventListener('keydown',e=>{if(SELKEY&&document.body.contains(SELKEY.box))SELKEY.fn(e);});
function qSel(it,opt,box){
  const picks=[];let done=false;
  box.innerHTML=`<p class="q">Use letters from the big word to make a word that matches the clue.</p>
  <div class="big" style="font-size:1.3rem">Clue: <span style="color:var(--gold)">${esc(it.clue)}</span></div>
  <div class="selrow" id="src">${[...it.src].map((c,i)=>`<button class="tile" type="button" data-i="${i}">${c}</button>`).join('')}</div>
  <div class="selrow" id="boxes">${[...it.ans].map((_,i)=>`<button class="tile box" type="button" data-b="${i}" aria-label="box ${i+1}"></button>`).join('')}</div>
  <div class="hint" id="h">${opt.guided?'Clue first: <b>'+esc(it.clue)+'</b>, '+it.ans.length+' letters. Think of the word, then find its letters.':'Clue, count, then check. Tap a box to take a letter back.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="clr" type="button">Clear</button><button class="btn" id="lock" type="button" disabled>Lock in</button></div>`;
  const paint=()=>{box.querySelectorAll('#src .tile').forEach(t=>{const u=picks.includes(+t.dataset.i);t.classList.toggle('gone',u);t.disabled=u||done;});
    box.querySelectorAll('#boxes .tile').forEach((t,i)=>{const p=picks[i];t.textContent=p===undefined?'':it.src[p];t.classList.toggle('f',p!==undefined);t.disabled=done;});
    const l=$('#lock');if(l)l.disabled=picks.length<it.ans.length&&!opt.exam;};
  const pick=i=>{if(done||picks.length>=it.ans.length||picks.includes(i))return;picks.push(i);sfx('tap');paint();};
  box.querySelectorAll('#src .tile').forEach(t=>t.onclick=()=>pick(+t.dataset.i));
  box.querySelectorAll('#boxes .tile').forEach(t=>t.onclick=()=>{const b=+t.dataset.b;if(!done&&b<picks.length){picks.splice(b,1);paint();}});
  $('#clr').onclick=()=>{if(!done){picks.length=0;paint();}};
  const lock=()=>{if(done)return;done=true;SELKEY=null;
    const typed=picks.map(p=>it.src[p]).join(''),ok=typed===it.ans;
    box.querySelector('#boxes').classList.add(ok?'good':'bad');paint();$('#lock').remove();$('#clr').remove();const hh=$('#h');if(hh)hh.remove();
    const used=new Set();[...it.ans].forEach(c=>{for(let j=0;j<it.src.length;j++)if(it.src[j]===c&&!used.has(j)){used.add(j);break;}});
    const shown=[...it.src].map((c,j)=>used.has(j)?`<b>${c}</b>`:c).join('');
    finish(opt,ok,box,`<p style="margin:0">Clue: <b>${esc(it.clue)}</b> → <b>${it.ans}</b>${!ok&&typed?` <span class="muted">(you made ${typed})</span>`:''}${!typed?' <span class="muted">(left blank: always get a guess in!)</span>':''}</p><p class="selsrc" style="margin:6px 0 0;letter-spacing:2px">${shown}</p>`);};
  $('#lock').onclick=lock;
  SELKEY={box,fn:e=>{if(done||e.metaKey||e.ctrlKey||e.altKey)return;if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
    if(e.key==='Backspace'){e.preventDefault();picks.pop();paint();return;}
    if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){if(picks.length===it.ans.length){e.preventDefault();lock();}return;}
    if(/^[a-z]$/i.test(e.key)){const c=e.key.toUpperCase();const i=[...it.src].findIndex((x,j)=>x===c&&!picks.includes(j));if(i>=0)pick(i);}}};
  paint();
}

/* Quest trail */
function qQuest(it,opt,box){({join:qJoin,extra:qExtra,lets:qLets,cloze:qCloze,opp:qPair,ana:qPair})[it.type](it,opt,box);}
function qCloze(it,opt,box){
  const sent=it.s.includes('___')?esc(it.s).replace('___','<span class="qm">_____</span>'):esc(it.s);
  const opts=shuffle(it.opts);
  box.innerHTML=`<p class="q">${it.q}</p><div class="sent" style="font-weight:700">${sent}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
  <div class="hint">${opt.guided?'Find the <b>clue words</b> in the sentence, then swap each option in.':'Clue words, then swap test.'}</div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===it.ans;
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===it.ans)x.classList.add('good');});if(!ok)b.classList.add('bad');
    finish(opt,ok,box,`<p style="margin:0"><b>${esc(it.ans)}</b>. ${esc(it.why)}</p>`);});
}
function qPair(it,opt,box){
  let a=null,b=null;
  const grp=(arr,g)=>`<div class="opts" style="margin:8px 0">${arr.map(w=>`<button class="opt" data-g="${g}" data-o="${w}">${w}</button>`).join('')}</div>`;
  const head=it.type==='opp'?`<p class="q">Choose the two words, <b>one from each group</b>, that are most <b>opposite</b> in meaning.</p>`
    :`<p class="q">Choose one word from each group to complete the sentence in the best way.</p><div class="sent" style="font-weight:700">${it.w1} is to (${it.A.join(' ')}) as ${it.w2} is to (${it.B.join(' ')})</div>`;
  box.innerHTML=`${head}<div class="hint" style="margin:0">Group 1</div>${grp(it.A,'A')}<div class="hint" style="margin:0">Group 2</div>${grp(it.B,'B')}
  <div id="prev"></div><div class="hint">${it.type==='opp'?'Same meaning or just linked words are traps! Test it: "If it isn\'t ___, it\'s ___".':'Say the rule out loud. If meaning doesn\'t work for both, check the letters.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  const lock=$('#lock');
  box.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const g=btn.dataset.g;
    box.querySelectorAll(`.opt[data-g="${g}"]`).forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');
    if(g==='A')a=btn.dataset.o;else b=btn.dataset.o;
    $('#prev').innerHTML=it.type==='opp'?`<div class="preview"><div class="pw">${a||'?'} ↔ ${b||'?'}</div></div>`:`<div class="preview"><div class="pw">${it.w1} → ${a||'?'} &nbsp;as&nbsp; ${it.w2} → ${b||'?'}</div></div>`;
    lock.disabled=!(a&&b);});
  lock.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.remove('sel');
      if((x.dataset.g==='A'&&x.dataset.o===it.a)||(x.dataset.g==='B'&&x.dataset.o===it.b))x.classList.add('good');
      else if((x.dataset.g==='A'&&x.dataset.o===a)||(x.dataset.g==='B'&&x.dataset.o===b))x.classList.add('bad');});
    lock.remove();const ok=a===it.a&&b===it.b;
    finish(opt,ok,box,`<p style="margin:0"><b>${it.a}</b> and <b>${it.b}</b>. ${esc(it.why)}</p>`);};
}
function qJoin(it,opt,box){
  let a=null,b=null;
  const grp=(arr,g)=>`<div class="opts" style="margin:8px 0">${arr.map(w=>`<button class="opt" data-g="${g}" data-o="${w}">${w}</button>`).join('')}</div>`;
  box.innerHTML=`<p class="q">Choose <b>one word from each bracket</b> that join together to make a new word. The word from the first bracket comes first.</p>
  <div class="hint" style="margin:0">Bracket 1</div>${grp(it.A,'A')}<div class="hint" style="margin:0">Bracket 2</div>${grp(it.B,'B')}
  <div id="prev"></div><div class="hint">${opt.guided?'Try the 1st word on the left with <b>each</b> word on the right, then the 2nd, then the 3rd.':'Every combination: left word + right word.'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  const lock=$('#lock');
  box.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const g=btn.dataset.g;
    box.querySelectorAll(`.opt[data-g="${g}"]`).forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');
    if(g==='A')a=btn.dataset.o;else b=btn.dataset.o;
    $('#prev').innerHTML=`<div class="preview"><div class="pw" style="font-size:1.2rem">${a||'?'}<span class="l">${b||'?'}</span></div></div>`;
    lock.disabled=!(a&&b);});
  lock.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.remove('sel');
      if((x.dataset.g==='A'&&x.dataset.o===it.a)||(x.dataset.g==='B'&&x.dataset.o===it.b))x.classList.add('good');
      else if((x.dataset.g==='A'&&x.dataset.o===a)||(x.dataset.g==='B'&&x.dataset.o===b))x.classList.add('bad');});
    lock.remove();const ok=a===it.a&&b===it.b;
    let h=`<p style="margin:0"><b>${it.a}</b> + <b>${it.b}</b> = <b>${it.full}</b>.</p>`;
    if(!ok)h+=`<p style="margin:6px 0 0"><b>${a}${b}</b> isn't a word. Work through every combination: 3 × 3 = 9 tries at most.</p>`;
    if(it.trap&&it.trap.length)h+=`<p style="margin:6px 0 0">⚠️ Trap: <b>${it.trap.join(', ')}</b> use two words from the <b>same</b> bracket, which isn't allowed!</p>`;
    finish(opt,ok,box,h);};
}
function qExtra(it,opt,box){
  box.innerHTML=`<p class="q">This scrambled sentence has <b>one extra word</b>. Unscramble it and find the word that doesn't fit.</p>
  <div class="sent" style="font-weight:700">${esc(it.jumble)}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="hb">🧩 Help me start</button></div><div class="hint" id="h">${opt.guided?'Find the action word (verb) and who is doing it. Build the sentence, and the word left over is the extra one.':''}</div>`;
  const words=it.sentence.replace(/[.,]/g,'').split(' ');
  let hn=0;$('#hb').onclick=()=>{hn++;
    if(hn===1)$('#h').innerHTML=`The sentence starts: <b>${words.slice(0,3).join(' ')}…</b>`;
    else{$('#h').innerHTML=`Check the little words: does every <b>a / an / the</b> have a noun to go with? Are there too many?`;$('#hb').remove();}};
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===it.ans;markOpts(box,it.ans,b.dataset.o);box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    const hb=$('#hb');if(hb)hb.remove();
    finish(opt,ok,box,`<p style="margin:0">The sentence is: <b>${esc(it.sentence)}</b></p><p style="margin:6px 0 0">The extra word is <b>${it.ans}</b>.${ok?'':' Build the sentence first, then see which word is left over.'}</p>`);});
}
function qLets(it,opt,box){
  const [[L1,R1],[L2,R2]]=it.w;
  const show=(p1,p2)=>`${L1}<span class="qm">${p1}</span>${R1} &nbsp;|&nbsp; ${L2}<span class="qm">${p2}</span>${R2}`;
  box.innerHTML=`<p class="q">Which pair of letter strings completes <b>both</b> words?</p>
  <div class="big" id="lw">${show('___','___')}</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
  <div class="hint">${opt.guided?'Pick a pair and read <b>both</b> words. Use the spelling, not the sound!':'Both words must be real. Spelling, not sound!'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="lock" disabled>Lock in</button></div>`;
  lockable(box,opt,s=>{const [p1,p2]=s.split(' & ');$('#lw').innerHTML=show(p1,p2);},s=>{
    markOpts(box,it.ans,s);const ok=s===it.ans;const [p1,p2]=s.split(' & ');
    finish(opt,ok,box,`<p style="margin:0"><b>${it.ans}</b> makes <b>${it.full[0].toUpperCase()}</b> and <b>${it.full[1].toUpperCase()}</b>.</p>${ok?'':`<p style="margin:6px 0 0">${(L1+p1+R1).toUpperCase()} and ${(L2+p2+R2).toUpperCase()}: check <b>both</b> words are real before locking in.</p>`}`);});
}

/* ---------- per-question trick walkthrough ---------- */
let CUR=null;
const T_OK='<b style="color:var(--good)">✓</b>',T_NO='<b style="color:var(--bad)">✗</b>';
function trickSteps(k,it){
  const li=a=>`<ol class="steps">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  const U=s=>String(s).toUpperCase();
  if(k==='odd'){
    const order=['meaning','sound','letters'],name={meaning:'Meaning',sound:'Sound',letters:'Letters'};
    const q={meaning:'Are three the same kind of thing, or do they mean the same?',sound:'Say each word slowly. Any silent letters or sound-alikes?',letters:'Are three made of exactly the same letters?'};
    const steps=[];
    for(const c of order){ if(c===it.check){steps.push(`<b>${name[c]}</b>: ${q[c]} ${T_OK} Cracked it! ${esc(it.why)}`);break;}
      steps.push(`<b>${name[c]}</b>: ${q[c]} ${T_NO} That doesn't split them, so move on.`);}
    return {name:'Meaning → Sound → Letters',html:li(steps)};
  }
  if(k==='link'&&it.a2){const W=o=>[it.a+o,o+it.b,it.a2+o,o+it.b2];
    const rows=it.opts.map(o=>{const f=o===it.ans?[1,1,1,1]:((it.traps2||{})[o]||[0,0,0,0]);return `<b>${o}</b>: ${W(o).map((w,i)=>w+' '+(f[i]?T_OK:T_NO)).join(' ')}${o===it.ans?' ← all four!':''}`;});
    return {name:'Both sides or nothing',html:li([`Try every letter on <b>all four</b> words:<br>${rows.join('<br>')}`,`Only <b>${it.ans}</b> works everywhere.`])};}
  if(k==='link'){
    const rows=it.opts.map(o=>{const t=o===it.ans?'LR':((it.traps||{})[o]||'');
      return `<b>${o}</b>: ${it.a}${o} ${t.includes('L')?T_OK:T_NO} &nbsp; ${o}${it.b} ${t.includes('R')?T_OK:T_NO}${o===it.ans?' ← both!':''}`;});
    return {name:'Both sides or nothing',html:li([`Try every letter on <b>both</b> words:<br>${rows.join('<br>')}`,`Only <b>${it.ans}</b> works on both sides: ${U(it.w1)} and ${U(it.w2)}.`])};
  }
  if(k==='stolen'){const f=it.full,a=it.at;
    return {name:'Say the word first',html:li([`Read the sentence: "${esc(it.s.replace('{}','___'))}" What word makes sense? → <b>${f}</b>`,`Line it up: ${it.shown.slice(0,a)}<b style="color:var(--gold)">${f.slice(a,a+3)}</b>${it.shown.slice(a)}`,`The stolen letters are <b>${it.ans}</b>, and that's in the options ${T_OK}`])};
  }
  if(k==='codes'){const [a,b]=it.g1,[c,d]=it.g2,m=it.map;
    return {name:'Number the letters',html:li([`Number them: ${[...a].map((x,i)=>x+'<sub>'+(i+1)+'</sub>').join('')} &nbsp; ${[...b].map((x,i)=>x+'<sub>'+(i+1)+'</sub>').join('')}`,
      `Where does each letter of <b>${it.mid}</b> come from? ${m.map(([g,p],i)=>`${it.mid[i]} = word ${g+1} letter ${p+1}`).join(', ')}`,
      `Same rule on <b>${c}</b> and <b>${d}</b>: ${m.map(([g,p])=>[c,d][g][p]).join(' ')} → <b>${it.ans}</b>`])};
  }
  if(k==='syn'){const a=it.ans[0];
    return {name:'Sentence swap',html:li([`Put <b>${esc(it.w)}</b> in a sentence. It means ${esc(it.mean)}.`,`List words starting <b>${it.g}</b>… <b>${esc(a)}</b> is one.`,`Swap test: swap <b>${esc(a)}</b> in for <b>${esc(it.w)}</b>. Same meaning, same type of word ${T_OK}`])};
  }
  if(k==='sel'){const used=new Set();[...it.ans].forEach(c=>{for(let j=0;j<it.src.length;j++)if(it.src[j]===c&&!used.has(j)){used.add(j);break;}});
    return {name:'Clue, count, then check',html:li([`Clue: <b>${esc(it.clue)}</b>. Count the boxes: <b>${it.ans.length}</b> letters.`,`Think of ${it.ans.length}-letter words for "${esc(it.clue)}" → <b>${it.ans}</b>`,`Tick its letters off in the big word: <span class="selsrc" style="letter-spacing:2px">${[...it.src].map((c,j)=>used.has(j)?`<b>${c}</b>`:c).join('')}</span> ${T_OK} All there!`])};
  }
  if(k==='cem'){
    if(it.type==='dbl')return {name:'One pair at a time',html:li([`Pair 1 is (${it.p1.join(', ')}). Which options could fit it?`,`Test those on pair 2 (${it.p2.join(', ')}). Any word that fits only one pair is a trap.`,`Only <b>${it.ans}</b> fits both. ${esc(it.why)}`])};
    if(it.type==='move'){const rows=it.opts.map(o=>{if(o===it.ans)return `<b>${o}</b> → ${it.r1} ${T_OK}`;const t=(it.traps||{})[o];
        const i=it.w1.indexOf(o);return `<b>${o}</b> → ${t||it.w1.slice(0,i)+it.w1.slice(i+o.length)} ${t?T_OK+' (but can it fit into '+it.w2+'? '+T_NO+')':T_NO}`;});
      return {name:'Take out, then put in',html:li([`Take ${it.n2?'each pair of letters':'each letter'} out of <b>${it.w1}</b>:<br>${rows.join('<br>')}`,`Put <b>${it.ans}</b> into ${it.w2} → <b>${it.r2}</b> ${T_OK}`])};}
    if(it.type==='add')return {name:'Glue it and say it',html:li([`Glue <b>${it.ans}</b> onto every word: ${it.words.map(w=>`${w}${it.ans} ${w===it.base?T_OK:T_NO}`).join(' · ')}`,`<b>${it.full}</b> is the only real word. Do the same with every option before you click!`])};
  }
  if(['wf','nwc','so','cl','wb'].includes(k))return gramSteps(k,it);
  if(k==='own'){
    if(it.type==='sent')return {name:it.h.startsWith('Swap')?'Swap in him / his':it.h.startsWith('His')?'Noun after it, or standing alone?':"The \"That's ___!\" test",html:li([it.h,esc(it.why)])};
    if(it.type==='notp')return {name:it.kind==='pronoun'?"The \"That's ___!\" test":'Can it go before a noun?',html:li([it.kind==='pronoun'?`Say each one: ${it.opts.map(x=>`That's ${x}! ${x===it.ans?T_NO:T_OK}`).join(' · ')}`:`Try each before a noun: ${it.opts.map(x=>`${x} book ${x===it.ans?T_NO:T_OK}`).join(' · ')}`,esc(it.why)])};
    return {name:'Noun next, or standing alone?',html:li([`Look straight after the gap. A noun next → determiner (<i>their house</i>). Nothing after it → stand-alone pronoun (<i>are ours</i>).`,`Read it aloud with each option: ${it.opts.map(o=>`${esc(o)} ${o===it.ans?T_OK:T_NO}`).join(' · ')}`,esc(it.why)])};
  }
  if(k==='quest'){
    if(it.type==='join'){const rows=it.A.map(x=>`<b>${x}</b> + ${it.B.map(y=>`${x}${y} ${x===it.a&&y===it.b?T_OK:T_NO}`).join(' · ')}`);
      return {name:'Every combination',html:li([`Try each word in bracket 1 with every word in bracket 2:<br>${rows.join('<br>')}`,`Only <b>${it.full}</b> works.${it.trap&&it.trap.length?` (${it.trap.join(', ')} use two words from the same bracket, which isn't allowed.)`:''}`])};}
    if(it.type==='extra'){const w=it.sentence.replace(/[.,]/g,'').split(' ');
      return {name:'Build it, spot the leftover',html:li([`Find the action and who does it, then start building: <b>${w.slice(0,3).join(' ')}…</b>`,`Add the rest: <b>${esc(it.sentence)}</b>`,`Every word has a job except <b>${it.ans}</b>, which is the extra word ${T_OK}`])};}
    if(it.type==='cloze'){const ctxQ=!it.s.includes('___');
      return {name:'Clue words, then swap',html:li([ctxQ?`Read the whole sentence. What is it about? <i>${esc(it.s)}</i>`:`Find the clue words: <i>${esc(it.s)}</i>`,`Swap each option in: ${it.opts.map(o=>`${esc(o)} ${o===it.ans?T_OK:T_NO}`).join(' · ')}`,esc(it.why)])};}
    if(it.type==='opp')return {name:'Opposite test',html:li([`Cross out the traps: words that mean the <b>same</b> or are just linked.`,`Test: "If it isn't <b>${it.a}</b>, it's <b>${it.b}</b>" ${T_OK}`,esc(it.why)])};
    if(it.type==='ana')return {name:'Find the rule, then copy it',html:li([it.rule==='letters'?`Try a meaning link first. Nothing fits both pairs? Check the <b>letters</b>.`:`Say the link between <b>${it.w1}</b> and each word in group 1.`,`Rule: ${esc(it.why)}`,`Same rule on both: ${it.w1} → <b>${it.a}</b> as ${it.w2} → <b>${it.b}</b> ${T_OK}`])};
    if(it.type==='lets'){const [[L1,R1],[L2,R2]]=it.w,[p1,p2]=it.ans.split(' & ');
      return {name:'Both words, by spelling',html:li([`Look at the endings and think of words that fit: ${L1}___${R1} and ${L2}___${R2}`,`Fill <b>both</b>: ${L1}<b style="color:var(--gold)">${p1}</b>${R1} ${T_OK} and ${L2}<b style="color:var(--gold)">${p2}</b>${R2} ${T_OK}`,`Any option that makes only one real word is a trap.`])};}
  }
  return null;
}

/* ---------- The Owner's Mark (determiners vs pronouns) ---------- */
const OWN_WORDS=[['mine',1],['my',0],['yours',1],['your',0],['ours',1],['our',0],['theirs',1],['their',0],['hers',1],['his',1],['her',1]];
const OWN_HINT={my:'my',your:'your',our:'our',their:'their'};
function boldW(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b style="color:var(--gold);text-decoration:underline">$1</b>');}
function ownListen(box,done){
  let i=0,att=0;const piles={r:[],w:[]};window.ownPiles=piles;
  function pilesHtml(){return `<div class="row" style="margin-top:12px;align-items:flex-start"><div style="flex:1" class="fb good"><b>👍 Sounds right</b><br>${piles.r.join(', ')||'…'}</div><div style="flex:1" class="fb bad"><b>👎 Sounds wrong</b><br>${piles.w.join(', ')||'…'}</div></div>`;}
  function show(msg=''){
    if(i>=OWN_WORDS.length){box.innerHTML=buddy('You sorted them all with your ear! Look at the two piles.')+pilesHtml();done();return;}
    const [w]=OWN_WORDS[i];
    box.innerHTML=`<p class="q">Say it out loud. Does it sound like a <b>finished</b> sentence?</p>
     <div class="big">That's <span style="color:var(--gold)">${w}</span>!</div>
     <div class="opts"><button class="opt" data-v="1">👍 Sounds right</button><button class="opt" data-v="0">👎 Sounds wrong</button></div>
     <div id="lh">${msg}</div>${pilesHtml()}<div class="hint">Word ${i+1} of ${OWN_WORDS.length}</div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const [w,r]=OWN_WORDS[i];const v=+b.dataset.v;
      if(v===r){sfx('right');(r?piles.r:piles.w).push(w);i++;att=0;show(`<div class="fb good">✓ ${r?`<i>That's ${w}!</i> works on its own.`:`<i>That's ${w}…</i> what? It needs a word after it (${w} bag).`}</div>`);return;}
      att++;sfx('wrong');
      if(att===1){const h=w==='her'?`Imagine pointing at a girl in a photo: <i>"That's her!"</i> Does that work?`:w==='his'?`Imagine pointing at a boy's coat: <i>"That's his!"</i> Does that work?`:r?`Say it slowly: <i>"That's ${w}!"</i>. Are you waiting for more words, or is it finished?`:`Say it slowly: <i>"That's ${w}…"</i>. ${cap(w)} what? Does it sound finished?`;
        $('#lh').innerHTML=`<div class="fb tip">🤔 ${h} Have another go!</div>`;b.disabled=true;return;}
      (r?piles.r:piles.w).push(w);i++;att=0;
      show(`<div class="fb tip">The answer: ${r?`<i>That's ${w}!</i> is finished, so it sounds right.`:`<i>That's ${w}!</i> sounds unfinished: ${w} needs a noun after it (${w} bag).`}</div>`);});
  }
  show();
}
function cap(w){return w[0].toUpperCase()+w.slice(1);}
function ownPiles(box,done){
  const p=window.ownPiles&&window.ownPiles.r.length?window.ownPiles:{r:['mine','yours','ours','theirs','hers','his','her'],w:['my','your','our','their']};
  const opts=[['a','they can stand alone at the end of a sentence',1],['b','they are longer',0],['c','they start with a capital letter',0]];let att=0;
  box.innerHTML=`<div class="row" style="align-items:flex-start"><div style="flex:1" class="fb good"><b>👍 Sounds right</b><br>${p.r.join(', ')}</div><div style="flex:1" class="fb bad"><b>👎 Sounds wrong</b><br>${p.w.join(', ')}</div></div>
   <p class="q" style="margin-top:12px">What can the <b>"sounds right"</b> words do that the others can't?</p>
   <div class="opts" style="flex-direction:column">${opts.map(o=>`<button class="opt" data-o="${o[0]}">${o[1]}</button>`).join('')}</div><div id="ph"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=opts.find(x=>x[0]===b.dataset.o);
    if(o[2]){sfx('right');confetti(40);box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('good');reveal(att===0);return;}
    att++;sfx('wrong');b.disabled=true;b.classList.add('bad');
    if(att===1){$('#ph').innerHTML=`<div class="fb tip">🤔 Hmm: <i>his</i> is short but it's in the "right" pile, and none of them have capitals. Look at <i>That's mine!</i>: where does <i>mine</i> sit, and is anything after it? Have another go!</div>`;return;}
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o==='a')x.classList.add('good');});reveal(false);});
  function reveal(first){$('#ph').innerHTML=`<div class="fb good"><h3>${first?BUDDY+' You cracked it!':'Here\'s the secret:'}</h3>
    The "sounds right" words can <b>stand alone</b>. They don't need a noun after them. Stand-alone owner words are <b>pronouns</b>: <i>That's <b>mine</b>.</i><br><br>
    The "sounds wrong" words need a noun straight after them: <i><b>their</b> book, <b>my</b> bag</i>. Those are <b>determiners</b>.<br><br>
    ⭐ <b>her</b> and <b>his</b> can do <b>both</b> jobs, so you have to look at the sentence.</div>`;done();}
}
function qOwn(it,opt,box){
  let att=0;const t=it.type;
  let head,opts;
  if(t==='sent'){head=`<p class="q">Is the <b>underlined</b> word a <b>determiner</b> or a <b>pronoun</b>?</p><div class="sent">${boldW(it.s)}</div>`;opts=['determiner','pronoun'];}
  else if(t==='notp'){head=`<p class="q">Which word is <b>NOT</b> a ${it.kind}?</p>`;opts=it.opts;}
  else{head=`<p class="q">Choose the word that completes the sentence correctly.</p><div class="sent">${esc(it.s).replace('___','<span class="qm">_____</span>')}</div>`;opts=it.opts;}
  box.innerHTML=`${head}<div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="oh"></div>`;
  const hint=o=>{
    if(t==='sent')return it.h;
    if(t==='notp')return it.kind==='pronoun'?`Say each one out loud: ${it.opts.map(x=>`<i>"That's ${x}!"</i>`).join(' · ')}. Which one sounds <b>unfinished</b>?`
      :`A determiner goes straight before a noun. Say each one: ${it.opts.map(x=>`<i>"${cap(x)} book"</i>`).join(' · ')}. Which one <b>can't</b> go before a noun?`;
    const s=esc(it.s).replace('___',`<b>${esc(o)}</b>`);
    const ap={"it's":"it's = it is","you're":"you're = you are","they're":"they're = they are"}[o.toLowerCase()];
    return `Read it aloud with your word: <i>"${s}"</i>. Does it sound right?`+(ap?` Remember: ${ap}.`:/'/.test(o)?` Remember: owner words <b>never</b> take an apostrophe.`:o.toLowerCase()==='there'?` Remember: <i>there</i> is a place (over there).`:'');};
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=b.dataset.o;const ok=o===it.ans;
    if(ok){box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('good');$('#oh').innerHTML='';
      finish(opt,att===0,box,`<p style="margin:0">${esc(it.why)}</p>`,att?'✅ You got it on your second go!':null);return;}
    att++;b.disabled=true;b.classList.add('bad');
    if(att===1&&!opt.exam){sfx('wrong');$('#oh').innerHTML=`<div class="fb tip">🤔 ${hint(o)} <b>Have another go!</b></div>`;return;}
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===it.ans)x.classList.add('good');});$('#oh').innerHTML='';
    finish(opt,false,box,`<p style="margin:0">The answer is <b>${esc(it.ans)}</b>. ${esc(it.why)}</p>`);});
}

/* ---------- Grammar Squad engine ---------- */
const GTEST={noun:'the ___',verb:'I ___ / I have ___ / I am ___',adjective:'a very ___ one',adverb:'She did it ___'};
const GPL={noun:'nouns',verb:'verbs',adjective:'adjectives',adverb:'adverbs'};
function gFill(cls,w){if(cls==='verb')return `I ${w} · I have ${w} · I am ${w}`;return GTEST[cls].replace('___',w);}
function gBold(s){return boldW(s);}
/* generic two-try multiple choice. head = html shown above options */
function gTwoTry(it,opt,box,head,opts,hintFn){
  let att=0;
  box.innerHTML=`${head}<div class="opts"${opts.some(o=>o.length>18)?' style="flex-direction:column"':''}>${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="oh"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=b.dataset.o;
    if(o===it.ans){box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('good');$('#oh').innerHTML='';
      finish(opt,att===0,box,`<p style="margin:0">${it.why}</p>`,att?'✅ You got it on your second go!':null);return;}
    att++;b.disabled=true;b.classList.add('bad');
    if(att===1&&!opt.exam){sfx('wrong');$('#oh').innerHTML=`<div class="fb tip">🤔 ${hintFn(o)} <b>Have another go!</b></div>`;return;}
    box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===it.ans)x.classList.add('good');});$('#oh').innerHTML='';
    finish(opt,false,box,`<p style="margin:0">The answer is <b>${esc(it.ans)}</b>. ${it.why}</p>`);});
}
function gHint(it,o){if(it.notes&&it.notes[o])return (it.s?`Read it with your word: <i>"${esc(it.s).replace('___','<b>'+esc(o)+'</b>')}"</i>. `:'')+it.notes[o];
  if(typeof it.h==='string')return it.h;return 'Use the ear test on each option.';}
function gHead(it){let h=`<p class="q">${it.q}</p>`;if(it.s)h+=`<div class="sent">${it.s.includes('___')?esc(it.s).replace('___','<span class="qm">_____</span>'):gBold(it.s)}</div>`;return h;}
/* stepper: test every word before answering */
function gStepper(box,words,mode,cls,done){
  let i=0;const tally={};
  const st=document.createElement('div');box.appendChild(st);
  function show(msg=''){
    if(i>=words.length){st.innerHTML=(msg?`<div class="fb tip" style="margin-top:6px">${msg}</div>`:'')+`<div class="fb good" style="margin-top:6px">✅ You tested every word${mode==='count'?`: you found <b>${tally.yes||0}</b> ${GPL[cls]}`:''}. Now answer!</div>`;done();return;}
    const [w,c]=words[i];
    if(mode==='count'){
      st.innerHTML=`<div class="fb tip" style="margin-top:8px"><div class="muted" style="font-size:.8rem">Test every word: ${i+1} of ${words.length}</div>Say it: <b>"${gFill(cls,w)}"</b>. Does it work?
       <div class="row" style="margin-top:6px"><button class="btn ghost" data-v="1">👍 Works</button><button class="btn ghost" data-v="0">👎 Doesn't</button></div>${msg}</div>`;
      st.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=+b.dataset.v,r=c===cls?1:0;if(r)tally.yes=(tally.yes||0)+1;
        const m=v===r?`<div style="color:var(--good);font-weight:700;margin-top:4px">✓ ${w}: ${r?`a ${cls}`:`not a ${cls}`}</div>`:`<div style="font-weight:700;margin-top:4px">👂 Listen again: "${gFill(cls,w)}" ${r?'does work, so <b>'+w+'</b> is a '+cls:"doesn't work, so <b>"+w+'</b> is not a '+cls}${r?'':` (it's ${/^[aeiou]/.test(c)?'an':'a'} ${c})`}.</div>`;
        sfx(v===r?'tap':'wrong');i++;show(m);});
    } else {
      st.innerHTML=`<div class="fb tip" style="margin-top:8px"><div class="muted" style="font-size:.8rem">Test every word: ${i+1} of ${words.length}</div>Which test does <b>${w}</b> fit?
       <div class="row" style="margin-top:6px;flex-wrap:wrap">${['noun','adjective','verb','adverb'].map(k=>`<button class="btn ghost" style="padding:6px 10px;font-size:.9rem" data-c="${k}">${GTEST[k].replace('___','…')}</button>`).join('')}</div>${msg}</div>`;
      st.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.c;
        const m=k===c?`<div style="color:var(--good);font-weight:700;margin-top:4px">✓ "${gFill(c,w)}" works: <b>${w}</b> is ${/^[aeiou]/.test(c)?'an':'a'} ${c}.</div>`:`<div style="font-weight:700;margin-top:4px">👂 "${gFill(k,w)}" doesn't work. Try "${gFill(c,w)}" ✓: <b>${w}</b> is ${/^[aeiou]/.test(c)?'an':'a'} ${c}.</div>`;
        sfx(k===c?'tap':'wrong');i++;show(m);});
    }
  }
  show();
}
function qGram(it,opt,box){
  const t=it.type;
  if(t==='count'||t==='wtype'){
    const head=gHead(it)+`<div class="big" style="font-size:1.25rem">${it.list?it.words.map(w=>w[0]).join(', '):''}</div>`;
    const go=()=>{const keep=box.innerHTML.includes('id="stp"')?box.querySelector('#stp').outerHTML:'';gTwoTry(it,opt,box,head+keep,it.opts,o=>t==='count'?`Count again using the test "${GTEST[it.cls]}". Which words passed? ${it.words.map(w=>w[0]).join(', ')}.`:`Look back at your tests: which test did <b>every</b> word pass?`);};
    if(opt.exam){go();return;}
    box.innerHTML=head+`<div id="stp"></div>`;
    gStepper(box.querySelector('#stp'),it.words,t==='count'?'count':'type',it.cls,()=>setTimeout(go,700));
    return;
  }
  if(t==='so'){
    const toks=it.s.split(' ');
    const head=`<p class="q">${it.q}</p>`;
    const askOpts=()=>gTwoTry(it,opt,box,head+`<div class="sent">${esc(it.s)}</div><div class="hint" style="margin-top:0">Verb: <b>${it.verbs[0]}</b>. Ask: <b>${it.ask}</b></div>`,it.opts,o=>it.notes&&it.notes[o]?it.notes[o]:`Find the verb (<b>${it.verbs[0]}</b>), then ask <b>"${it.ask}"</b>.`);
    if(opt.exam){gTwoTry(it,opt,box,head+`<div class="sent">${esc(it.s)}</div>`,it.opts,()=>'');return;}
    let att=0;
    box.innerHTML=`${head}<p class="hint" style="margin:0">Step 1: tap the <b>verb</b> (the doing or being word).</p><div class="opts">${toks.map((w,i)=>`<button class="opt" data-i="${i}">${esc(w)}</button>`).join('')}</div><div id="vh"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const w=b.textContent.replace(/[^A-Za-z]/g,'').toLowerCase();
      if(it.verbs.includes(w)){sfx('tap');b.classList.add('good');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(askOpts,600);return;}
      att++;b.classList.add('bad');b.disabled=true;sfx('wrong');
      $('#vh').innerHTML=`<div class="fb tip">🤔 Try "I ${w}" or "it ${w}". Does it sound like something being done? ${att>1?`The verb is <b>${it.verbs[0]}</b>.`:'Have another go!'}</div>`;
      if(att>1){box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;});setTimeout(askOpts,1400);}});
    return;
  }
  // mc
  gTwoTry(it,opt,box,gHead(it),shuffleIf(it),o=>gHint(it,o));
}
function shuffleIf(it){return it.keep?it.opts:shuffle(it.opts);}
function gramSteps(k,it){const li=a=>`<ol class="steps">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(it.type==='count'||it.type==='wtype'){const rows=it.words.map(([w,c])=>it.type==='count'?`${gFill(it.cls,w)} ${c===it.cls?T_OK:T_NO}`:`${w} → ${gFill(c,w)} ${T_OK}`);
    return {name:'Test every word',html:li([rows.join('<br>'),it.why])};}
  if(it.type==='so')return {name:'Verb → who did it? → verb what?',html:li([`Find the verb: <b>${it.verbs[0]}</b>.`,`Ask: <b>${it.ask}</b>`,it.why])};
  return {name:CASES[k].trick,html:li([gHint(it,'')||'',it.why].filter(Boolean))};}

/* ---------- RECORD & BACKUP ---------- */
function record(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},P,{parentPin:undefined,focusLock:undefined})))));
  app.innerHTML=`<div class="card"><h1>📒 My record</h1>
  <p>Total stars: <b>${P.points}</b> · Best streak: <b>${P.bestStreak}</b> in a row · Trophies: <b>${Object.keys(P.trophies).length}/${TROPHIES.length}</b></p>
  ${P.hist.length?`<table class="hist">${P.hist.slice(0,20).map(h=>`<tr><td>${h.d}</td><td>${h.m==='cemt'?'CEM Timed':h.m==='mock'?'ISEB/Quest Mode':h.m==='quick'?'Quick 5':h.m==='mistakes'?'Real mistakes':CASES[h.m].name}</td><td>${h.c}/${h.n}</td><td>⭐ ${h.score}</td></tr>`).join('')}</table>`:'<p class="muted">No rounds yet.</p>'}</div>
  <div class="card"><h2>👪 Parent settings</h2><p class="muted">Focus Lock is <b>${focusOn()?'ON':'OFF'}</b>. CEM focus is <b>${cemFocus()?'ON until '+(P.cemUntil||'2026-11-17'):'OFF'}</b>. When it's on, cases she's already safe in stay locked until every focus case is safe.</p>
  ${P.parentPin?'':'<p class="muted" style="font-size:.85rem">First time: choose a 4-digit parent PIN.</p>'}
  <div class="row"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="${P.parentPin?'Parent PIN':'New PIN'}" style="width:9em"><button class="btn ghost" id="cf">${cemFocus()?'Turn CEM focus OFF':'Turn CEM focus ON (2 days)'}</button><button class="btn ghost" id="fl">${P.parentPin?(focusOn()?'Turn Focus Lock OFF':'Turn Focus Lock ON'):'Set PIN'}</button></div>
  ${P.traps&&Object.keys(P.traps).length?`<h3 style="margin-top:14px">🪤 Traps (fixed when it's high)</h3><table class="hist">${Object.entries(P.traps).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([t,v])=>`<tr><td>${esc(t)}</td><td style="white-space:nowrap;font-weight:800;color:${v.r/v.n>=.8?'var(--good)':v.r/v.n>=.5?'var(--gold)':'var(--bad)'}">${v.r}/${v.n}</td></tr>`).join('')}</table>`:''}
  <div style="margin-top:10px">${Object.keys(CASES).map(k=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>${CASES[k].em} ${CASES[k].name}</b>${focusLabel(k)}</div>`).join('')}</div></div>
  <div class="card"><h2>💾 Backup code</h2><p class="muted">Progress is saved in this browser. Copy this code somewhere safe so it can be restored on another device.</p>
  <textarea id="bk" rows="3" readonly>${code}</textarea><div class="row" style="margin-top:8px"><button class="btn ghost" id="cp">Copy code</button></div>
  <h3 style="margin-top:14px">Restore</h3><textarea id="rs" rows="2" placeholder="Paste a backup code"></textarea><div class="row" style="margin-top:8px"><button class="btn ghost" id="rb">Restore</button></div></div>
  <button class="btn ghost" onclick="go('home')">← Back</button>`;
  $('#cf').onclick=()=>{const v=$('#pin').value.trim();if(!P.parentPin){toast('Set a PIN first');return;}if(v!==P.parentPin){sfx('wrong');toast('Enter your PIN first');return;}
    if(cemFocus())P.cemUntil='2000-01-01';else{const d=new Date();d.setDate(d.getDate()+1);P.cemUntil=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    save();toast('CEM focus '+(cemFocus()?'ON':'OFF'));record();};
  $('#fl').onclick=()=>{const v=$('#pin').value.trim();if(!/^\d{4}$/.test(v)){toast('Enter 4 digits');return;}
    if(!P.parentPin){P.parentPin=v;save();toast('PIN set!');return record();}
    if(v!==P.parentPin){sfx('wrong');toast('Wrong PIN');return;}
    P.focusLock=!focusOn();save();toast('Focus Lock '+(focusOn()?'ON':'OFF'));record();};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('Copied!');}catch(e){$('#bk').select();toast('Select and copy the code');}};
  $('#rb').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#rs').value.trim()))));if(typeof o.points!=='number')throw 0;const pp=P.parentPin,fl=P.focusLock;delete o.parentPin;delete o.focusLock;P=Object.assign(P,o);P.parentPin=pp;P.focusLock=fl;P.recent=o.recent;if(!o.recent)delete P.recent;save();applyTheme();toast('Progress restored!');go('home');}catch(e){toast('That code didn\'t work');}};
}

/* ---------- router ---------- */
function go(v){R=null;window.scrollTo(0,0);({home,tricks,record})[v]();}
go('home');
</script>
</body>
</html>
