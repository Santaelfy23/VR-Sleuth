<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Sleuth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1226;--bg2:#171b36;--card:#1e2346;--card2:#262c57;--line:#343b70;
  --ink:#eef0ff;--muted:#a3a9d6;--gold:#ffc94d;--gold2:#ffdf8a;--good:#3ddc97;--bad:#ff6b81;
  --blue:#6ea8ff;--violet:#b18cff;--tile:#2d3466;--shadow:0 6px 24px rgba(0,0,0,.35);
}
body.light{
  --bg:#f3f1ea;--bg2:#e9e5d8;--card:#fffdf7;--card2:#f4efe1;--line:#ddd5bf;
  --ink:#24213a;--muted:#6d6886;--gold:#c98a00;--gold2:#a86f00;--good:#14935d;--bad:#d1334f;
  --blue:#2f6fe0;--violet:#7a4fe0;--tile:#efe8d6;--shadow:0 6px 20px rgba(60,50,20,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:.3px;flex:1;cursor:pointer}
.logo span{color:var(--gold)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem}
h1,h2,h3{font-family:Fredoka,sans-serif;margin:.2em 0 .4em;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.hero{background:linear-gradient(135deg,var(--card2),var(--card));}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.case{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.case:hover{transform:translateY(-2px);border-color:var(--gold)}
.case .em{font-size:1.8rem}
.case .t{font-family:Fredoka;font-weight:600;font-size:1.12rem}
.case .trick{font-size:.88rem;color:var(--gold2);font-weight:800}
.meter{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:99px}
.btn{background:var(--gold);color:#1b1630;border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:1rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
body.light .btn{color:#fff}
body.light .btn.ghost{color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.opt{min-width:64px;padding:12px 16px;border-radius:14px;background:var(--tile);border:2px solid var(--line);font-weight:800;font-size:1.08rem;letter-spacing:.5px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--gold);background:var(--card2)}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--tile))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--tile))}
.opt:disabled{cursor:default}
.q{font-size:1.05rem}
.big{font-family:Fredoka;font-size:1.7rem;font-weight:600;letter-spacing:1.5px;text-align:center;margin:10px 0}
.qm{display:inline-block;min-width:1.6em;padding:0 .2em;border-bottom:3px solid var(--gold);color:var(--gold)}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;border:1.5px solid}
.fb.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.fb.tip{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.fb h3{margin:0 0 4px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:800;font-size:.82rem;border:1.5px solid var(--line);margin-right:4px}
.chip.meaning{border-color:var(--blue);color:var(--blue)} .chip.sound{border-color:var(--violet);color:var(--violet)} .chip.letters{border-color:var(--gold);color:var(--gold)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lvl{display:flex;gap:4px;align-items:center}
.lvl b{width:22px;height:10px;border-radius:4px;background:var(--bg2);border:1px solid var(--line)}
.lvl b.on{background:var(--gold);border-color:var(--gold)}
.preview{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pw{background:var(--bg2);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-weight:800;letter-spacing:1px;text-align:center;min-width:120px}
.pw .l{color:var(--gold)}
.pw .mark{display:flex;gap:6px;justify-content:center;margin-top:6px}
.pw .mark button{border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:3px 10px;font-weight:800;font-size:.9rem}
.pw .mark button.on.y{border-color:var(--good);color:var(--good)}
.pw .mark button.on.n{border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;gap:4px;justify-content:center}
.tile{width:38px;height:46px;border-radius:9px;background:var(--tile);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;text-transform:uppercase;position:relative}
.tile small{position:absolute;bottom:1px;font-size:.6rem;color:var(--muted);font-weight:700}
button.tile:hover{border-color:var(--blue)}
.tile.hl{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--tile))}
.tile.used{border-color:var(--good)}
.tile.slot{border-style:dashed;border-color:var(--gold)}
.tile.mid{background:var(--card2);border-color:var(--violet)}
.codewrap{display:flex;flex-direction:column;gap:14px;align-items:center;margin:10px 0}
.cgroup{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:center;background:var(--bg2);padding:10px;border-radius:14px}
.cgroup .lab{font-size:.75rem;color:var(--muted);text-align:center;font-weight:700;margin-top:3px}
.srclab{font-size:.68rem;color:var(--gold);font-weight:800;text-align:center;min-height:1em}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sent{font-size:1.15rem;text-align:center;margin:14px 0}
.sent b{color:var(--gold);letter-spacing:1px}
.full{font-family:Fredoka;font-size:1.4rem;letter-spacing:2px}
.full em{font-style:normal;color:var(--good);text-decoration:underline}
.trickcard{border:2px solid var(--gold);border-radius:18px;padding:16px;background:color-mix(in srgb,var(--gold) 7%,var(--card))}
.trickcard .name{font-family:Fredoka;font-size:1.25rem;color:var(--gold)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;padding:6px 0 6px 40px;position:relative;overflow-wrap:anywhere}
.steps li:before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1b1630;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.ex{background:var(--bg2);border-radius:12px;padding:10px 12px;margin:8px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--gold)}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.88rem;font-weight:700;display:flex;gap:6px;align-items:center}
.trophy.locked{opacity:.38;filter:grayscale(1)}
.checkbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.checkbar button{border-radius:99px;padding:5px 12px;font-weight:800;font-size:.85rem;background:var(--card2);border:1.5px solid var(--line)}
.hint{font-size:.92rem;margin-top:8px;text-align:center;color:var(--muted)}
.buddy{display:flex;gap:10px;align-items:flex-end;margin:10px 0}
.bface{font-size:2.2rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.bubble{background:var(--card2);border:1.5px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;font-size:.95rem}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.stk{font-size:1.6rem;text-align:center;background:var(--bg2);border-radius:10px;padding:4px 0}
.stk.locked{filter:grayscale(1);opacity:.18}
.bigstk{font-size:4rem;animation:spin .8s ease-out}
@keyframes spin{from{transform:scale(.2) rotate(-200deg);opacity:0}}
.exam .opt.good,.exam .opt.bad{border-color:var(--line)!important;background:var(--tile)!important}
.exam #sayit,.exam #hb,.exam .checkbar,.exam #crack,.exam .hint{display:none!important}
.exambar{background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;gap:10px;align-items:center;font-weight:800;margin-bottom:8px}
.rev summary{cursor:pointer;font-weight:800;padding:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:#1b1630;font-weight:800;padding:10px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:50;animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
textarea,input{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:.85rem}
.timer{font-variant-numeric:tabular-nums}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem} table.hist td{padding:5px 4px;border-bottom:1px solid var(--line)}
.syngiven{display:flex;justify-content:center;align-items:stretch;gap:6px;margin:14px 0}
.syngiven .tile{border-color:var(--blue);color:var(--blue)}
.syngiven input{width:min(11ch,55vw);font-family:Fredoka;font-size:1.5rem;font-weight:600;letter-spacing:2px;text-transform:lowercase;padding:6px 10px;border:2px solid var(--line);border-bottom:3px solid var(--gold);border-radius:10px;background:var(--tile);color:var(--ink)}
.syngiven input.good{border-color:var(--good);color:var(--good)} .syngiven input.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.selrow{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:10px 0}
.selrow .tile{cursor:pointer}
.selrow .tile.gone{opacity:.18;cursor:default}
.selrow .tile.box{border-style:dashed;border-color:var(--gold);background:transparent}
.selrow .tile.box.f{border-style:solid;background:var(--tile)}
.selrow.good .tile.box{border-color:var(--good);color:var(--good)} .selrow.bad .tile.box{border-color:var(--bad);color:var(--bad)}
.selsrc b{color:var(--gold);text-decoration:underline}
.pt{background:#f7f7f5;color:#222;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:12px 0;font-family:Nunito,system-ui,sans-serif}
.ptbar{background:#1d2027;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:4px solid #2fb24c;font-size:.9rem}
.ptsub{color:#3fd06a;font-size:.72rem;font-weight:700;letter-spacing:.3px}
.pttime{background:#2fb24c;color:#fff;border-radius:6px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.pttime.low{background:#d33;animation:sh .6s}
.ptbody{padding:16px 18px}
.ptbody p{margin:.5em 0}
.ptp{font-size:1.02rem;line-height:1.5}
.ptopts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.ptopt{flex:1 1 110px;min-height:58px;background:#fff;border:2px solid #9aa0a6;border-radius:3px;font-size:1rem;color:#222;padding:8px}
.ptopt:hover:not(:disabled){border-color:#1f4fa8}
.ptopt.sel{border-color:#1f4fa8;box-shadow:inset 0 0 0 1px #1f4fa8;background:#eef3ff}
.ptopt.g{background:#2fb24c;border-color:#2fb24c;color:#fff}
.ptopt.g.me{box-shadow:inset 0 0 0 3px #1f4fa8}
.ptopt.mine{border-color:#1f4fa8;box-shadow:inset 0 0 0 1px #1f4fa8}
.ptopt.x{border-color:#d33}
.ptnext{background:#2fb24c;color:#fff;border:0;border-radius:6px;padding:10px 26px;font-weight:800;font-size:1rem}
.ptsq{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:10px;border-top:4px solid #2fb24c;background:#fff}
.ptsq span{min-width:28px;height:28px;display:grid;place-items:center;border-radius:4px;background:#ddd;color:#555;font-weight:800;font-size:.8rem}
.ptsq span.g{background:#2fb24c;color:#fff;cursor:pointer}.ptsq span.r{background:#d33;color:#fff;cursor:pointer}.ptsq span.grey{background:#555;color:#fff;cursor:pointer}
.ptsq span.on{outline:3px solid #f5b800;outline-offset:1px}
.ptpace,.ptpacebar{background:#fff7dd;border:1.5px solid #f0c64a;border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:10px}
.ptpacebar{display:none;margin:0 0 10px}
.ptmut{color:#666}.ptna{color:#d33;font-weight:700}
.ptperf{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee;margin:10px 0 4px}
.ptexp{border-top:1px solid #ddd;padding-top:8px;color:#333}
.pt .fb.tip{border-color:#f0c64a;background:#fff9e6;color:#222}.pt .fb.good{border-color:#2fb24c;background:#eefaf1;color:#222}
.pt .steps li:before{background:#2fb24c;color:#fff}
.ptq{border:1px solid #ddd;border-radius:10px;padding:12px 14px;background:#fff}
.ptbold{font-weight:800;text-align:center;font-size:1.1rem;margin:14px 0 4px}
.ptl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:#9aa0a6;color:#fff;font-size:.85rem;margin-right:8px;font-weight:700}
.ptopt.sel{background:#1f2f99!important;border-color:#1f2f99!important;color:#fff}.ptopt.sel .ptl{background:#fff;color:#1f2f99}
.ptopts.wide .ptopt{flex:1 1 100%;text-align:left}
.ptnav{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid #e5e5e5}
.ptback{background:#fff;color:#2b63e6;border:2px solid #2b63e6;border-radius:8px;padding:9px 22px;font-weight:800;font-size:1rem}
.pt .ptnext{background:#2b63e6}
.ptsq span{cursor:pointer}.ptsq span.done{background:#9aa0a6;color:#fff}.ptsq span.cur{outline:3px solid #2b63e6;outline-offset:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" onclick="go('home')">🔎 VR <span>Sleuth</span></div>
    <div class="pill" id="ptsPill">⭐ 0</div>
    <button class="iconbtn" id="sndBtn" title="Sound on / off" onclick="toggleSound()">🔊</button>
    <button class="iconbtn" id="themeBtn" title="Light / dark" onclick="toggleTheme()">☀️</button>
  </header>
  <main id="app"></main>
</div>
<script>

nd pair (indigo, navy) but not the first (low, sad). The answer must fit BOTH pairs.","deep":"\"deep\" doesn't really fit either pair. Test each option on pair 1 first, then pair 2.","purple":"\"purple\" fits the second pair (indigo, navy) but not the first (low, sad). The answer must fit BOTH pairs."},"d":2,"id":"rqb0","real":true},{"type":"two","a":"ban","b":"ckey","x":"j","y":"o","w1":"banjo","w2":"jockey","opts":["h","j","o","k","a","s"],"traps":{"h":"second","k":"second"},"d":3,"id":"rqt0","real":true,"why":"ban+jo = banjo and jo+ckey = jockey. You picked h: h+o makes hockey, but 'banh' isn't a word. Both words, every time!"},{"type":"odd2","w":["cautious","precious","brittle","delicate","flimsy"],"ans":["cautious","precious"],"why":"Brittle, delicate and flimsy all mean easily broken. Cautious and precious don't. Trap: brittle and flimsy sound \"odd\", but they are the group! Find the three first.","d":3,"id":"rqo0","real":true},{"type":"odd2","w":["cautious","wary","careful","reckless","rash"],"ans":["reckless","rash"],"why":"Cautious, wary and careful take care; reckless and rash don't.","d":3,"id":"rqo0","real":true},{"type":"extra","jumble":"makes iridescent dragonfly the glitter of wings sunlight hover bright the","ans":"hover","sentence":"The bright sunlight makes the wings of the iridescent dragonfly glitter.","opts":["glitter","bright","sunlight","iridescent","hover"],"d":3,"real":true,"id":"rquest20","note":"You chose glitter, but glitter is the action: the sunlight makes the wings glitter. Hover has no job."},{"type":"ana","w1":"parsley","w2":"paprika","A":["time","rosemary","plant"],"B":["cumin","marinate","flower"],"a":"rosemary","b":"cumin","rule":"meaning","d":3,"real":true,"id":"rquest21","why":"Parsley and rosemary are both herbs; paprika and cumin are both spices. You chose plant and flower: parsley is a plant, but paprika isn't a flower. The link must work on BOTH sides."},{"type":"alpha","q":"Which letter is exactly halfway between the fourth and ninth <b>consonants</b> of the alphabet?","ans":"I","opts":["I","D","F","F","J"],"d":3,"why":"Consonants skip the vowels: B, C, D, F, G, H, J, K, L. The fourth is F, the ninth is L. Halfway between F and L in the alphabet is I. You chose F, the fourth consonant itself, in 5 seconds. Find BOTH ends, then the middle.","id":"rqh0","real":true},{"type":"logic","text":"• Paulina likes sleeping with socks on.\n• When she sleeps with socks on, Paulina only ever has good dreams.\n• Paulina usually has good dreams on Wednesdays.","opts":["Paulina never has bad dreams when she sleeps with socks on.","On Wednesday nights, Paulina always sleeps with socks on.","Paulina doesn't wear socks on any night other than Wednesday.","Paulina is usually wearing socks in her dreams.","Paulina doesn't wear socks during the day."],"ans":"Paulina never has bad dreams when she sleeps with socks on.","why":"\"Only ever has good dreams\" with socks on means she never has bad dreams with socks on.","notes":{"On Wednesday nights, Paulina always sleeps with socks on.":"\"Usually\" good dreams on Wednesdays, not always, so we can't say \"always\" socks. Watch the little words: usually ≠ always!","Paulina doesn't wear socks on any night other than Wednesday.":"We're never told which nights she wears socks.","Paulina is usually wearing socks in her dreams.":"Nothing about what she wears IN her dreams.","Paulina doesn't wear socks during the day.":"Nothing about the daytime."},"d":3,"id":"rql0","real":true},{"type":"opp","A":["remorse","acquit","hard"],"B":["blame","convict","sorry"],"a":"acquit","b":"convict","d":3,"real":true,"id":"rquest22","why":"Acquit (find not guilty) is the opposite of convict (find guilty). You chose blame: blame and acquit are different, but not exact opposites. The opposite of blame is praise."},{"type":"ana","w1":"sew","w2":"putt","A":["clothes","sow","needle"],"B":["club","place","leave"],"a":"needle","b":"club","rule":"meaning","d":3,"real":true,"id":"rquest23","why":"You sew with a needle; you putt with a club (the tool for the action). You chose sow and place: sow SOUNDS like sew, but place doesn't sound like putt. The link must be the same on both sides."},{"type":"extra","jumble":"their intrepid climbed challenging the began expedition mountaineers","ans":"climbed","sentence":"The intrepid mountaineers began their challenging expedition.","opts":["intrepid","began","expedition","challenging","climbed"],"d":3,"real":true,"id":"rquest24","note":"You chose intrepid, but it describes the mountaineers (brave). There's only room for ONE verb: they BEGAN their expedition. You can't 'climb' an expedition, so climbed is extra."},{"type":"syn2","A":["full","quenched","hungry"],"B":["famished","thirsty","empty"],"a":"hungry","b":"famished","d":3,"real":true,"id":"rquest25","why":"Hungry = famished (both mean needing food). You chose quenched and thirsty: both are about drinking, but they're OPPOSITES (quenched = not thirsty any more). Same topic isn't the same meaning!"},{"type":"odd2","w":["hunt","stem","stork","stalk","trunk"],"ans":["hunt","stork"],"d":3,"real":true,"id":"rqo1","why":"Stalk, stem and trunk are the upright parts of plants. Stork (a bird) only SOUNDS like stalk, and hunt matches stalk's OTHER meaning. You chose hunt and stalk, but stalk belongs to the group of three."},{"type":"odd2","w":["awkward","unassuming","polite","unpretentious","humble"],"ans":["awkward","polite"],"d":3,"real":true,"id":"rqo2","why":"Humble, unassuming and unpretentious all mean not showing off. Polite (good manners) and awkward (unsure how to behave) are different. You picked unpretentious in 8 seconds: a long word can still be in the group!"},{"type":"opp","A":["need","owe","borrow"],"B":["return","lend","share"],"a":"borrow","b":"lend","d":2,"real":true,"id":"rquest26","why":"Borrow (take, then give back) is the opposite of lend (give, then get back). You chose return in 7 seconds: you return something AFTER you borrow it. They go together, but they aren't opposites. Swap test: 'Can I borrow… / I'll lend…' ✓"},{"type":"odd2","w":["height","weigh","eight","horse","neigh"],"ans":["height","horse"],"d":3,"real":true,"id":"rqo3","why":"Weigh, eight and neigh are linked by SOUND: they all rhyme with 'day'. Height looks the same (eigh) but rhymes with 'kite'. You chose horse and neigh, a meaning link, but horse and neigh only make 2, not 3. If meaning doesn't make a group of THREE, try sound or spelling."},{"type":"two","a":"bera","b":"nder","x":"t","y":"e","w1":"berate","w2":"tender","opts":["v","g","t","e","u","p"],"traps":{"g":"second"},"d":3,"real":true,"id":"rqt1","why":"bera+te = berate (to tell someone off angrily) and te+nder = tender. You chose e and u in 6 seconds. 'g' would make gender, but 'berage' isn't a word. Both words, every time!"},{"type":"hid3","full":"COLLEGE","cap":"COLE","s":"The COLE advertised its open day for students.","ans":"LEG","opts":["BAG","EAR","APE","ATE","LEG"],"notes":{},"d":2,"id":"rqw0","why":"LEG slots into COLE to make COLLEGE: \"The COLLEGE advertised its open day for students.\" You chose APE: \"COLAPEE\" isn't a word. Try each one in the gap and say the whole word.","real":true},{"type":"cloze","q":"What does the word '<b>sheer</b>' mean in the context of this sentence?","s":"It was through sheer chance that they discovered the delightful restaurant.","ans":"complete","opts":["steep","delicate","complete","abrupt","gauzy"],"d":3,"real":true,"id":"rquest27","notes":{"abrupt":"A \"sheer drop\" is sudden and steep, but that's the OTHER meaning. Swap test: \"through abrupt chance\" makes no sense.","steep":"A sheer cliff is steep: the other meaning.","gauzy":"Sheer fabric is thin and see-through: another meaning.","delicate":"Sheer fabric is delicate: another meaning."},"why":"\"Sheer chance\" = complete, total chance. Swap each option into the sentence: \"through complete chance\" ✓."},{"type":"ana","w1":"sleep","w2":"leer","A":["peels","bed","pillow"],"B":["taunt","bully","reel"],"a":"peels","b":"reel","rule":"letters","d":3,"real":true,"id":"rquest28","why":"Sleep backwards is peels; leer backwards is reel. You spotted reel on the right side, but picked pillow (a meaning link) on the left. The SAME rule must work on both sides!"},{"type":"opp","A":["behind","opposite","relative"],"B":["same","adjacent","neighbour"],"a":"opposite","b":"same","d":3,"real":true,"id":"rquest29","why":"Opposite (completely different) is the opposite of same. You chose adjacent: opposite and adjacent are both about position, but they aren't opposites of each other. Watch out: the word 'opposite' can itself be the answer!"},{"type":"odd2","w":["cube","near","close","block","shut"],"ans":["cube","near"],"d":3,"real":true,"id":"rqo4","why":"Close, block and shut all mean stopping someone getting through (a door, a road). Cube and near don't. You chose block: cube and block are both shapes, but that's only TWO. Find the group of THREE first."},{"type":"cloze","q":"What does the word '<b>dear</b>' mean in the context of this sentence?","s":"Typically, the dress she fell in love with was just too dear.","ans":"expensive","opts":["beloved","cheap","admired","expensive","charming"],"d":3,"real":true,"id":"rquest30","notes":{"charming":"\"Fell in love with\" pulls you towards a nice meaning, but \"TOO dear\" means a problem: it cost too much.","beloved":"Dear can mean beloved, but \"too beloved\" isn't a problem."},"why":"\"Just too dear\" = it cost too much. Dear can also mean expensive! Clue: \"too\" means there's a problem."},{"type":"both","A":["male","mister"],"B":["guard","defend"],"ans":"man","opts":["lad","boy","cover","protect","man"],"one":{"lad":"A","boy":"A","cover":"B","protect":"B"},"d":3,"real":true,"id":"rqb1","notes":{"lad":"\"lad\" fits male and mister, but you can't \"lad\" a fort. It must fit BOTH pairs.","boy":"Fits the first pair only.","cover":"Fits the second pair only.","protect":"Fits the second pair only."},"why":"A man is male (mister); to man a fort = to guard and defend it."}],"own":[{"type":"notp","kind":"pronoun","opts":["ours","theirs","their","yours","mine"],"ans":"their","why":"\"That's their!\" ✗ sounds unfinished. Their needs a noun (their house), so it's a determiner. The others all stand alone.","d":2,"id":"rown0","real":true,"trap":"NOT a pronoun / determiner"}],"wf":[{"type":"mc","q":"Which word is the <b>noun</b>?","s":"She purchased it at a low price.","opts":["She","purchased","it","price"],"ans":"price","h":"Use the test \"the ___\": the She? the it? the price?","why":"\"The price\" ✓. It and she are pronouns: they stand in for nouns, so \"the it\" ✗.","d":2,"trap":"noun vs pronoun (it, everyone…)","notes":null,"keep":false,"id":"rwf0","real":true}],"nwc":[{"type":"mc","q":"Which word is a <b>preposition</b>?","s":"I left my book on the table.","opts":["left","my","on","table"],"ans":"on","h":"A preposition shows where or when something is, and is followed by a thing. Is <i>left</i> a doing word (\"I left\")?","why":"\"On the table\": on is followed by a thing and shows where. Left is a verb (I left).","d":2,"trap":"preposition vs verb","notes":{"left":"\"I left\": left is something you do, so it's a verb. Which word shows <b>where</b> the book is?","my":"My is an owner word (determiner). Which word shows <b>where</b>?","table":"Table is the thing (a noun). Which word comes before it and shows <b>where</b>?"},"keep":false,"id":"rnwc0","real":true},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"**Since** it rained, the match was cancelled.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>since</b>: <i>\"it rained\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After since comes someone doing something (\"it rained\"), so since is a conjunction.","trap":"after / before / since / until","d":2,"id":"rnwc1","real":true}],"so":[{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"Grandpa read a story to the twins.","verbs":["read"],"ask":"Read what?","ans":"story","opts":["story","twins","Grandpa","none"],"why":"Read what? A story. The twins come after \"to\", so they aren't the object.","trap":"person after to / for","d":2,"notes":{"twins":"Ask \"read <b>what</b>?\" Grandpa didn't read the twins! The twins come after <b>to</b>."},"id":"rso0","real":true}],"cl":[{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**before the race started**","opts":["clause","phrase"],"keep":true,"ans":"clause","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's a doer and a verb, so it's a clause.","trap":"clause vs phrase","d":2,"id":"rcl0","real":true}],"wb":[]},"cem":[{"type":"dbl","p1":["group","combine"],"p2":["puddle","pond"],"ans":"pool","opts":["pool","join","lake","gather","splash"],"why":"To pool things = to group or combine them; a pool of water = a puddle or pond. Join fits only pair 1; lake fits only pair 2. From your test!","d":2,"id":"cem0"},{"type":"dbl","p1":["hit","strike"],"p2":["drink","fruit juice"],"ans":"punch","opts":["punch","slap","squash","cordial","kick"],"why":"A punch is a hit, and punch is a fruity party drink. Squash is a drink, but it doesn't mean hit.","d":1,"id":"cem1"},{"type":"dbl","p1":["skin","leather"],"p2":["conceal","cover"],"ans":"hide","opts":["hide","fur","bury","pelt","mask"],"why":"An animal's hide is its skin; to hide = to conceal. Pelt fits only pair 1; mask fits only pair 2.","d":2,"id":"cem2"},{"type":"dbl","p1":["light","pale"],"p2":["just","honest"],"ans":"fair","opts":["fair","blond","right","even","dim"],"why":"Fair hair is light or pale; fair also means just. Blond fits only pair 1; right and even fit only pair 2.","d":1,"id":"cem3"},{"type":"dbl","p1":["clock","timepiece"],"p2":["view","observe"],"ans":"watch","opts":["w "},{"type":"syn2","A":["grave","happy","tomb"],"B":["serious","funny","church"],"a":"grave","b":"serious","why":"Grave = serious. Tomb is the other meaning of grave: a trap!","d":3,"id":"qs24"},{"type":"logic","text":"Read the statements about a cafe.\n• Mary is the manager, and works every day apart from Saturday.\n• Sandra works several days a week, but never works weekends.\n• Elliot only works on the days Mary is not in.","opts":["Sandra and Elliot never work together.","Elliot works more days than Sandra.","Mary and Sandra always work the same shifts.","Mary enjoys working at the cafe more than Sandra.","Sandra has another job at the weekends."],"ans":"Sandra and Elliot never work together.","why":"Mary is off only on Saturday, so Elliot works only on Saturday. Sandra never works weekends, so they never meet.","notes":{"Elliot works more days than Sandra.":"Elliot works 1 day; Sandra works several. False.","Mary and Sandra always work the same shifts.":"Sandra works several days, not necessarily all of Mary's. Might be true, but not MUST.","Mary enjoys working at the cafe more than Sandra.":"Feelings are never in the facts. Opinion trap!","Sandra has another job at the weekends.":"Nothing says this. It might be true, but it doesn't have to be."},"d":2,"id":"ql0"},{"type":"logic","text":"• Tom is taller than Sam.\n• Sam is taller than Lily.\n• Lily is taller than Ben.","opts":["Tom is the tallest.","Ben is taller than Sam.","Sam is the shortest.","Lily is taller than Tom.","Tom plays basketball."],"ans":"Tom is the tallest.","why":"Order: Tom > Sam > Lily > Ben, so Tom is the tallest.","notes":{"Tom plays basketball.":"Not in the facts. Outside-knowledge trap!"},"d":1,"id":"ql1"},{"type":"logic","text":"• All the children in the choir play an instrument.\n• Some of the children who play an instrument play the piano.\n• Mia is in the choir.","opts":["Mia plays an instrument.","Mia plays the piano.","Everyone who plays the piano is in the choir.","Mia enjoys singing.","Mia does not play the piano."],"ans":"Mia plays an instrument.","why":"Everyone in the choir plays an instrument, and Mia is in the choir.","notes":{"Mia plays the piano.":"Only SOME play the piano. She might, but she doesn't have to.","Mia does not play the piano.":"We don't know that either. Might, not must.","Mia enjoys singing.":"Feelings aren't in the facts."},"d":2,"id":"ql2"},{"type":"logic","text":"• The library is open Monday to Friday.\n• The swimming pool is open every day except Monday.\n• Jo can only go out on Mondays and Saturdays.","opts":["Jo can visit the library on a Monday.","Jo can visit the pool on a Monday.","Jo can visit the library on a Saturday.","Jo prefers the pool.","The pool is closed at weekends."],"ans":"Jo can visit the library on a Monday.","why":"The library is open on Mondays, and Jo can go out on Mondays.","notes":{"Jo can visit the pool on a Monday.":"The pool is closed on Mondays.","Jo can visit the library on a Saturday.":"The library is shut at weekends."},"d":2,"id":"ql3"},{"type":"logic","text":"• Ali, Bea and Cal each have one pet: a cat, a dog or a fish.\n• Ali is allergic to fur.\n• Bea's pet barks.","opts":["Cal has the cat.","Ali has the dog.","Bea has the fish.","Cal is allergic to fur.","Ali wants a cat."],"ans":"Cal has the cat.","why":"Bea has the dog (it barks). Ali can't have fur, so Ali has the fish. That leaves the cat for Cal.","notes":{},"d":2,"id":"ql4"},{"type":"logic","text":"• Every bus to the station stops at the park.\n• The number 7 bus does not stop at the park.","opts":["The number 7 does not go to the station.","The number 7 goes to the station.","No buses stop at the park.","The number 7 is always late.","The park is next to the station."],"ans":"The number 7 does not go to the station.","why":"If it went to the station, it would have to stop at the park. It doesn't, so it can't go to the station.","notes":{},"d":3,"id":"ql5"},{"type":"logic","text":"• Zara finished before Kim.\n• Kim finished before Leo.\n• Max finished after Leo.","opts":["Max finished last.","Kim won the race.","Leo beat Kim.","Zara finished third.","Max trained the hardest."],"ans":"Max finished last.","why":"Order: Zara, Kim, Leo, Max. Max was last.","notes":{},"d":1,"id":"ql6"},{"type":"logic","text":"• On Tuesday it rained all day.\n• Whenever it rains, the football match is cancelled.\n• Matches are only played on Tuesdays and Thursdays.","opts":["The Tuesday match was cancelled.","The Thursday match was cancelled.","It rained on Thursday.","There is a match on Wednesdays.","The players were disappointed."],"ans":"The Tuesday match was cancelled.","why":"It rained on Tuesday, so that match was cancelled.","notes":{"The Thursday match was cancelled.":"We don't know Thursday's weather."},"d":2,"id":"ql7"},{"type":"logic","text":"• Everyone going on the school trip must bring a packed lunch.\n• Ella did not bring a packed lunch.","opts":["Ella did not go on the trip.","Ella forgot her lunch.","Ella bought lunch at the museum.","Nobody brought a lunch.","The trip was cancelled."],"ans":"Ella did not go on the trip.","why":"Everyone on the trip brought a lunch. Ella didn't, so she wasn't on the trip.","notes":{"Ella forgot her lunch.":"Maybe, maybe not. We aren't told why."},"d":3,"id":"ql8"},{"type":"logic","text":"• Sam is older than Ruby but younger than Dan.\n• Ruby is older than Kit.","opts":["Kit is the youngest.","Sam is the oldest.","Ruby is older than Sam.","Dan is younger than Kit.","Kit is Ruby's sister."],"ans":"Kit is the youngest.","why":"Order: Dan > Sam > Ruby > Kit, so Kit is the youngest.","notes":{},"d":2,"id":"ql9"},{"type":"seq","terms":["LL","OK","RJ","UI"],"ans":"XH","opts":["HX","XG","WI","YH","XH"],"d":1,"why":"First letters: L → O → R → U → X (+3 each time). Second letters: L → K → J → I → H (-1 each time). So the answer is XH.","id":"qq0"},{"type":"seq","terms":["HS","KT","NU","QV"],"ans":"TW","opts":["SX","WW","TV","UW","TW"],"d":1,"why":"First letters: H → K → N → Q → T (+3 each time). Second letters: S → T → U → V → W (+1 each time). So the answer is TW.","id":"qq1"},{"type":"seq","terms":["CH","DI","EJ","FK"],"ans":"GL","opts":["LG","GK","FM","HL","GL"],"d":1,"why":"First letters: C → D → E → F → G (+1 each time). Second letters: H → I → J → K → L (+1 each time). So the answer is GL.","id":"qq2"},{"type":"seq","terms":["DM","FK","HI","JG"],"ans":"LE","opts":["LD","NE","ME","EL","LE"],"d":1,"why":"First letters: D → F → H → J → L (+2 each time). Second letters: M → K → I → G → E (-2 each time). So the answer is LE.","id":"qq3"},{"type":"seq","terms":["JJ","MK","PL","SM"],"ans":"VN","opts":["YN","UO","VM","WN","VN"],"d":1,"why":"First letters: J → M → P → S → V (+3 each time). Second letters: J → K → L → M → N (+1 each time). So the answer is VN.","id":"qq4"},{"type":"seq","terms":["GK","HM","IO","JQ"],"ans":"KS","opts":["KR","SK","JT","LS","KS"],"d":1,"why":"First letters: G → H → I → J → K (+1 each time). Second letters: K → M → O → Q → S (+2 each time). So the answer is KS.","id":"qq5"},{"type":"seq","terms":["CS","DQ","EO","FM"],"ans":"GK","opts":["FL","HK","KG","GJ","GK"],"d":1,"why":"First letters: C → D → E → F → G (+1 each time). Second letters: S → Q → O → M → K (-2 each time). So the answer is GK.","id":"qq6"},{"type":"seq","terms":["JP","KR","LT","MV"],"ans":"NX","opts":["NW","XN","MY","OX","NX"],"d":1,"why":"First letters: J → K → L → M → N (+1 each time). Second letters: P → R → T → V → X (+2 each time). So the answer is NX.","id":"qq7"},{"type":"seq","terms":["CG","EI","GK","IM"],"ans":"KO","opts":["JP","LO","KN","MO","KO"],"d":1,"why":"First letters: C → E → G → I → K (+2 each time). Second letters: G → I → K → M → O (+2 each time). So the answer is KO.","id":"qq8"},{"type":"seq","terms":["DI","EK","FM","GO"],"ans":"HQ","opts":["GR","IQ","HP","QH","HQ"],"d":1,"why":"First letters: D → E → F → G → H (+1 each time). Second letters: I → K → M → O → Q (+2 each time). So the answer is HQ.","id":"qq9"},{"typ
