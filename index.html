P → S → V → Y → B (+3 each time). Second letters: W → U → S → Q → O (-2 each time). So the answer is BO.","id":"qq18"},{"type":"seq","terms":["IA","LD","OG","RJ"],"ans":"UM","opts":["UL","MU","XM","VM","UM"],"d":2,"why":"First letters: I → L → O → R → U (+3 each time). Second letters: A → D → G → J → M (+3 each time). So the answer is UM.","id":"qq19"},{"type":"seq","terms":["AR","EP","IN","ML"],"ans":"QJ","opts":["RJ","QI","UJ","PK","QJ"],"d":2,"why":"First letters: A → E → I → M → Q (+4 each time). Second letters: R → P → N → L → J (-2 each time). So the answer is QJ.","id":"qq20"},{"type":"seq","terms":["MS","JX","GC","DH"],"ans":"AM","opts":["BM","AL","MA","ZN","AM"],"d":2,"why":"First letters: M → J → G → D → A (-3 each time). Second letters: S → X → C → H → M (+5 each time). So the answer is AM.","id":"qq21"},{"type":"seq","terms":["BW","DU","FS","HQ"],"ans":"JO","opts":["OJ","JN","LO","IP","JO"],"d":2,"why":"First letters: B → D → F → H → J (+2 each time). Second letters: W → U → S → Q → O (-2 each time). So the answer is JO.","id":"qq22"},{"type":"seq","terms":["GD","JZ","MV","PR"],"ans":"SN","opts":["VN","RO","TN","SM","SN"],"d":2,"why":"First letters: G → J → M → P → S (+3 each time). Second letters: D → Z → V → R → N (-4 each time). So the answer is SN.","id":"qq23"},{"type":"seq","terms":["LQ","OO","RM","UK"],"ans":"XI","opts":["XH","IX","AI","WJ","XI"],"d":2,"why":"First letters: L → O → R → U → X (+3 each time). Second letters: Q → O → M → K → I (-2 each time). So the answer is XI.","id":"qq24"},{"type":"seq","terms":["IY","MU","QQ","UM"],"ans":"YI","opts":["IY","ZI","CI","XJ","YI"],"d":2,"why":"First letters: I → M → Q → U → Y (+4 each time). Second letters: Y → U → Q → M → I (-4 each time). So the answer is YI.","id":"qq25"},{"type":"seq","terms":["SX","PA","MD","JG"],"ans":"GJ","opts":["DJ","HJ","FK","JG","GJ"],"d":2,"why":"First letters: S → P → M → J → G (-3 each time). Second letters: X → A → D → G → J (+3 each time). So the answer is GJ.","id":"qq26"},{"type":"seq","terms":["BN","FS","JX","NC"],"ans":"RH","opts":["HR","QI","VH","RG","RH"],"d":2,"why":"First letters: B → F → J → N → R (+4 each time). Second letters: N → S → X → C → H (+5 each time). So the answer is RH.","id":"qq27"},{"type":"seq","terms":["KQ","MU","OY","QC"],"ans":"SG","opts":["UG","SF","RH","GS","SG"],"d":2,"why":"First letters: K → M → O → Q → S (+2 each time). Second letters: Q → U → Y → C → G (+4 each time). So the answer is SG.","id":"qq28"},{"type":"seq","terms":["EK","AP","WU","SZ"],"ans":"OE","opts":["EO","NF","PE","KE","OE"],"d":2,"why":"First letters: E → A → W → S → O (-4 each time). Second letters: K → P → U → Z → E (+5 each time). So the answer is OE.","id":"qq29"},{"type":"seq","terms":["CJ","GF","KB","OX"],"ans":"ST","opts":["TT","TS","SS","RU","ST"],"d":2,"why":"First letters: C → G → K → O → S (+4 each time). Second letters: J → F → B → X → T (-4 each time). So the answer is ST.","id":"qq30"},{"type":"seq","terms":["FZ","JE","NJ","RO"],"ans":"VT","opts":["VS","UU","TV","WT","VT"],"d":2,"why":"First letters: F → J → N → R → V (+4 each time). Second letters: Z → E → J → O → T (+5 each time). So the answer is VT.","id":"qq31"},{"type":"seq","terms":["XW","BA","FE","JI"],"ans":"NM","opts":["NL","OM","MN","RM","NM"],"d":3,"why":"First letters: X → B → F → J → N (+4 each time). Second letters: W → A → E → I → M (+4 each time). So the answer is NM.","id":"qq32"},{"type":"seq","terms":["FX","BC","YI","WP"],"ans":"VX","opts":["UY","XV","VW","WX","VX"],"d":3,"why":"First letters: F → B → Y → W → V (steps grow by 1 each time). Second letters: X → C → I → P → X (steps grow by 1). So the answer is VX.","id":"qq33"},{"type":"seq","terms":["HX","CU","XR","SO"],"ans":"NL","opts":["IL","OL","NK","LN","NL"],"d":3,"why":"First letters: H → C → X → S → N (-5 each time). Second letters: X → U → R → O → L (-3 each time). So the answer is NL.","id":"qq34"},{"type":"seq","terms":["IO","OJ","UE","AZ"],"ans":"GU","opts":["UG","HU","FV","MU","GU"],"d":3,"why":"First letters: I → O → U → A → G (+6 each time). Second letters: O → J → E → Z → U (-5 each time). So the answer is GU.","id":"qq35"},{"type":"seq","terms":["BU","WY","SD","PJ"],"ans":"NQ","opts":["IQ","NP","OQ","MR","NQ"],"d":3,"why":"First letters: B → W → S → P → N (steps grow by 1 each time). Second letters: U → Y → D → J → Q (steps grow by 1). So the answer is NQ.","id":"qq36"},{"type":"seq","terms":["KG","OL","SQ","WV"],"ans":"AA","opts":["AZ","EA","BA","ZB","AA"],"d":3,"why":"First letters: K → O → S → W → A (+4 each time). Second letters: G → L → Q → V → A (+5 each time). So the answer is AA.","id":"qq37"},{"type":"seq","terms":["UZ","ZD","EH","JL"],"ans":"OP","opts":["PO","TP","OO","NQ","OP"],"d":3,"why":"First letters: U → Z → E → J → O (+5 each time). Second letters: Z → D → H → L → P (+4 each time). So the answer is OP.","id":"qq38"},{"type":"seq","terms":["BN","XR","UW","SC"],"ans":"RJ","opts":["JR","SJ","NJ","QK","RJ"],"d":3,"why":"First letters: B → X → U → S → R (steps grow by 1 each time). Second letters: N → R → W → C → J (steps grow by 1). So the answer is RJ.","id":"qq39"},{"type":"seq","terms":["OT","KX","GB","CF"],"ans":"YJ","opts":["UJ","XK","ZJ","YI","YJ"],"d":3,"why":"First letters: O → K → G → C → Y (-4 each time). Second letters: T → X → B → F → J (+4 each time). So the answer is YJ.","id":"qq40"},{"type":"seq","terms":["PW","UB","ZG","EL"],"ans":"JQ","opts":["QJ","IR","JP","KQ","JQ"],"d":3,"why":"First letters: P → U → Z → E → J (+5 each time). Second letters: W → B → G → L → Q (+5 each time). So the answer is JQ.","id":"qq41"},{"type":"seq","terms":["ED","ZI","VO","SV"],"ans":"QD","opts":["QC","RD","DQ","PE","QD"],"d":3,"why":"First letters: E → Z → V → S → Q (steps grow by 1 each time). Second letters: D → I → O → V → D (steps grow by 1). So the answer is QD.","id":"qq42"},{"type":"seq","terms":["UP","PT","KX","FB"],"ans":"AF","opts":["FA","VF","BF","AE","AF"],"d":3,"why":"First letters: U → P → K → F → A (-5 each time). Second letters: P → T → X → B → F (+4 each time). So the answer is AF.","id":"qq43"},{"type":"seq","terms":["CP","YT","UX","QB"],"ans":"MF","opts":["IF","NF","LG","FM","MF"],"d":3,"why":"First letters: C → Y → U → Q → M (-4 each time). Second letters: P → T → X → B → F (+4 each time). So the answer is MF.","id":"qq44"},{"type":"seq","terms":["ZA","VE","RI","NM"],"ans":"JQ","opts":["JQ","IQ","JR","QJ","KQ"],"d":2,"why":"First letters go back 4: Z → V → R → N → J. Second letters go forward 4: A → E → I → M → Q. Track each letter on its own!","id":"qq45"},{"type":"alpha","q":"Which letter is exactly halfway between the third and ninth <b>consonants</b> of the alphabet?","ans":"H","opts":["H","C","D","F","I"],"d":3,"why":"Consonants skip the vowels: B, C, D, F, G, H, J, K, L. The third is D, the ninth is L. Halfway between D and L in the alphabet is H.","id":"qh1"},{"type":"alpha","q":"Which letter is exactly halfway between the sixth and twelfth <b>consonants</b> of the alphabet?","ans":"L","opts":["L","F","H","I","M"],"d":3,"why":"Consonants skip the vowels: B, C, D, F, G, H, J, K, L, M, N, P. The sixth is H, the twelfth is P. Halfway between H and P in the alphabet is L.","id":"qh2"},{"type":"alpha","q":"Which letter is exactly halfway between the second and eighth <b>consonants</b> of the alphabet?","ans":"G","opts":["G","B","C","E","H"],"d":3,"why":"Consonants skip the vowels: B, C, D, F, G, H, J, K. The second is C, the eighth is K. Halfway between C and K in the alphabet is G.","id":"qh3"},{"type":"alpha","q":"Which letter is exactly halfway between C and K in the alphabet?","ans":"G","opts":["G","H","F","I","E"],"d":1,"why":"Count in from both ends: C … G … K. There are the same number of letters on each side of G.","id":"qh4"},{"type":"alpha","q":"Which letter is exactly halfway between B and N in the alphabet?","ans":"H","opts":["H","I","G","J","F"],"d":1,"why":"Count in from both ends: B … H … N. There are the same number of letters on each side of H.","id":"qh5"},{"type":"alpha","q":"Which letter is exactly halfway between F and R in the alphabet?","ans":"L","opts":["L","M","K","N","J"],"d":1,"why":"Count in from both ends: F … L … R. There are the same number of letters on each side of L.","id":"qh6"},{"type":"alpha","q":"Which letter is exactly halfway between D and P in the alphabet?","ans":"J","opts":["J","K","I","L","H"],"d":1,"why":"Count in from both ends: D … J … P. There are the same number of letters on each side of J.","id":"qh7"},{"type":"alpha","q":"Which letter is exactly halfway between H and T in the alphabet?","ans":"N","opts":["N","O","M","P","L"],"d":1,"why":"Count in from both ends: H … N … T. There are the same number of letters on each side of N.","id":"qh8"},{"type":"alpha","q":"Which letter is exactly halfway between E and W in the alphabet?","ans":"N","opts":["N","O","M","P","L"],"d":1,"why":"Count in from both ends: E … N … W. There are the same number of letters on each side of N.","id":"qh9"},{"type":"alpha","q":"Which letter is exactly halfway between J and X in the alphabet?","ans":"Q","opts":["Q","R","P","S","O"],"d":1,"why":"Count in from both ends: J … Q … X. There are the same number of letters on each side of Q.","id":"qh10"},{"type":"alpha","q":"Which letter is exactly halfway between A and M in the alphabet?","ans":"G","opts":["G","H","F","I","E"],"d":1,"why":"Count in from both ends: A … G … M. There are the same number of letters on each side of G.","id":"qh11"},{"type":"alpha","q":"Which letter comes 3 places after the second <b>vowel</b> in the alphabet?","ans":"H","opts":["H","E","I","G","J"],"d":2,"why":"Vowels: A, E, I, O, U. The second vowel is E. Count 3 on: F, G, H. Answer: H.","id":"qh12"},{"type":"alpha","q":"Which letter comes 2 places after the third <b>vowel</b> in the alphabet?","ans":"K","opts":["K","E","L","J","M"],"d":2,"why":"Vowels: A, E, I, O, U. The third vowel is I. Count 2 on: J, K. Answer: K.","id":"qh13"},{"type":"alpha","q":"Which letter comes 4 places after the fourth <b>vowel</b> in the alphabet?","ans":"S","opts":["S","H","T","R","U"],"d":2,"why":"Vowels: A, E, I, O, U. The fourth vowel is O. Count 4 on: P, Q, R, S. Answer: S.","id":"qh14"},{"type":"alpha","q":"Which letter comes 5 places after the first <b>vowel</b> in the alphabet?","ans":"F","opts":["F","G","E","H","D"],"d":2,"why":"Vowels: A, E, I, O, U. The first vowel is A. Count 5 on: B, C, D, E, F. Answer: F.","id":"qh15"},{"type":"alpha","q":"Which letter comes 4 places after the third <b>vowel</b> in the alphabet?","ans":"M","opts":["M","G","N","L","O"],"d":2,"why":"Vowels: A, E, I, O, U. The third vowel is I. Count 4 on: J, K, L, M. Answer: M.","id":"qh16"},{"type":"alpha","q":"If the alphabet were written backwards, which letter would be fifth?","ans":"V","opts":["V","E","U","W","X"],"d":2,"why":"Backwards: Z, Y, X, W, V. The fifth is V.","id":"qh17"},{"type":"alpha","q":"If the alphabet were written backwards, which letter would be seventh?","ans":"T","opts":["T","G","S","U","V"],"d":2,"why":"Backwards: Z, Y, X, W, V, U, T. The seventh is T.","id":"qh18"},{"type":"alpha","q":"If the alphabet were written backwards, which letter would be third?","ans":"X","opts":["X","C","W","Y","Z"],"d":2,"why":"Backwards: Z, Y, X. The third is X.","id":"qh19"},{"type":"alpha","q":"If the alphabet were written backwards, which letter would be ninth?","ans":"R","opts":["R","I","Q","S","T"],"d":2,"why":"Backwards: Z, Y, X, W, V, U, T, S, R. The ninth is R.","id":"qh20"},{"type":"alpha","q":"If the alphabet were written backwards, which letter would be tenth?","ans":"Q","opts":["Q","J","P","R","S"],"d":2,"why":"Backwards: Z, Y, X, W, V, U, T, S, R, Q. The tenth is Q.","id":"qh21"},{"type":"alpha","q":"Which letter is the fourth <b>consonant</b> after M?","ans":"R","opts":["R","Q","S","T","P"],"d":2,"why":"Skip the vowels: consonants after M are N, P, Q, R. The fourth is R. (Just counting 4 letters gives Q: a trap!)","id":"qh22"},{"type":"alpha","q":"Which letter is the third <b>consonant</b> after D?","ans":"H","opts":["H","G","I","J","F"],"d":2,"why":"Skip the vowels: consonants after D are F, G, H. The third is H. (Just counting 3 letters gives G: a trap!)","id":"qh23"},{"type":"alpha","q":"Which letter is the fifth <b>consonant</b> after P?","ans":"V","opts":["V","U","W","X","T"],"d":2,"why":"Skip the vowels: consonants after P are Q, R, S, T, V. The fifth is V. (Just counting 5 letters gives U: a trap!)","id":"qh24"},{"type":"alpha","q":"Which letter is the second <b>consonant</b> after G?","ans":"J","opts":["J","I","K","L","H"],"d":2,"why":"Skip the vowels: consonants after G are H, J. The second is J. (Just counting 2 letters gives I: a trap!)","id":"qh25"},{"type":"alpha","q":"Which letter is the fourth <b>consonant</b> after R?","ans":"W","opts":["W","V","X","Y","U"],"d":2,"why":"Skip the vowels: consonants after R are S, T, V, W. The fourth is W. (Just counting 4 letters gives V: a trap!)","id":"qh26"},{"type":"logic","text":"• Every time Leo eats cheese late at night, he has strange dreams.\n• Leo ate cheese late on Friday night.","opts":["Leo had strange dreams on Friday night.","Leo only has strange dreams after cheese.","Leo eats cheese every Friday.","Leo loves cheese.","Leo never has strange dreams on Saturdays."],"ans":"Leo had strange dreams on Friday night.","why":"\"Every time\" cheese late = strange dreams, and he had cheese late on Friday.","notes":{"Leo only has strange dreams after cheese.":"Cheese always gives strange dreams, but other things might too. \"Every time\" is not \"only\"."},"d":2,"id":"ql21"},{"type":"logic","text":"• Some of the girls in Class 6 play netball.\n• All the netball players train on Tuesdays.\n• Amy is in Class 6.","opts":["Every netball player trains on Tuesdays.","Amy plays netball.","Amy trains on Tuesdays.","No boys play netball.","All of Class 6 trains on Tuesdays."],"ans":"Every netball player trains on Tuesdays.","why":"This just repeats a fact: ALL netball players train on Tuesdays.","notes":{"Amy plays netball.":"Only SOME of Class 6 play. Might, not must.","Amy trains on Tuesdays.":"Only if she plays netball, and we don't know that."},"d":3,"id":"ql22"},{"type":"logic","text":"• Mr Patel usually walks to work.\n• When it rains, he always takes the bus.\n• It rained on Monday.","opts":["Mr Patel took the bus on Monday.","Mr Patel walked to work on Monday.","Mr Patel takes the bus every day.","Mr Patel dislikes the rain.","It rains most Mondays."],"ans":"Mr Patel took the bus on Monday.","why":"\"Always\" takes the bus when it rains, and it rained on Monday.","notes":{"Mr Patel walked to work on Monday.":"He usually walks, but \"always\" bus in the rain beats \"usually\"."},"d":2,"id":"ql23"},{"type":"logic","text":"• Nobody in the chess club is under 9.\n• Kai is 8.","opts":["Kai is not in the chess club.","Kai is too young to play chess.","Kai wants to join the chess club.","Everyone over 9 is in the chess club.","Kai is in the chess club."],"ans":"Kai is not in the chess club.","why":"Nobody under 9 is in the club, and Kai is 8.","notes":{"Kai is too young to play chess.":"He can play chess anywhere. He just can't be in THIS club."},"d":2,"id":"ql24"},{"type":"logic","text":"• The shop only sells red and blue umbrellas.\n• Hannah bought an umbrella from the shop.\n• Hannah's umbrella is not red.","opts":["Hannah's umbrella is blue.","Hannah's umbrella is green.","Hannah likes blue.","The shop sells more blue umbrellas.","Hannah's umbrella was cheap."],"ans":"Hannah's umbrella is blue.","why":"Only red or blue, and it's not red, so it must be blue.","notes":{},"d":1,"id":"ql25"},{"type":"odd2","w":["bough","cow","now","rough","tough"],"ans":["rough","tough"],"why":"Bough, cow and now all rhyme (ow!). Rough and tough look like bough, but sound like 'stuff'. A SOUND group.","d":3,"id":"qosnd0"},{"type":"odd2","w":["pear","bear","wear","hear","ear"],"ans":["hear","ear"],"why":"Pear, bear and wear rhyme with 'air'. Hear and ear look similar, but rhyme with 'here'.","d":2,"id":"qosnd1"},{"type":"odd2","w":["though","dough","so","through","cough"],"ans":["through","cough"],"why":"Though, dough and so all rhyme (oh). Through (oo) and cough (off) look similar but sound different.","d":3,"id":"qosnd2"},{"type":"hid3","full":"CARPET","cap":"CAR","s":"The muddy dog walked across the CAR.","ans":"PET","opts":["PET","TON","ROT","DEN","PIN"],"notes":{"TON":"CARTON is a word, but a dog can't walk across a carton! Read the whole sentence.","ROT":"CARROT is a word, but it doesn't make sense here."},"d":1,"id":"qw1","why":"PET slots into CAR to make CARPET: \"The muddy dog walked across the CARPET.\""},{"type":"hid3","full":"STRIPED","cap":"STED","s":"He wore a STED shirt.","ans":"RIP","opts":["RIP","ART","ONE","AGE","OUT"],"notes":{"ART":"STARTED is a word, but a \"started shirt\" makes no sense."},"d":2,"id":"qw2","why":"RIP slots into STED to make STRIPED: \"He wore a STRIPED shirt.\""},{"type":"hid3","full":"FOLLOW","cap":"FOL","s":"Please FOL the signs to the exit.","ans":"LOW","opts":["LOW","LOG","LID","LIE","LAP"],"notes":{},"d":1,"id":"qw3","why":"LOW slots into FOL to make FOLLOW: \"Please FOLLOW the signs to the exit.\""},{"type":"hid3","full":"PAPERS","cap":"PRS","s":"The newsagent sold PRS and magazines.","ans":"APE","opts":["APE","EAR","OUR","ICE","OWE"],"notes":{},"d":2,"id":"qw4","why":"APE slots into PRS to make PAPERS: \"The newsagent sold PAPERS and magazines.\""},{"type":"hid3","full":"PENCIL","cap":"CIL","s":"The CIL was blunt, so she sharpened it.","ans":"PEN","opts":["PEN","DEN","TEN","HEN","MEN"],"notes":{},"d":1,"id":"qw5","why":"PEN slots into CIL to make PENCIL: \"The PENCIL was blunt, so she sharpened it.\""},{"type":"hid3","full":"SOLDIERS","cap":"SOLRS","s":"The SOLRS marched past the palace.","ans":"DIE","opts":["DIE","ACE","TIE","LIE","OWE"],"notes":{},"d":2,"id":"qw6","why":"DIE slots into SOLRS to make SOLDIERS: \"The SOLDIERS marched past the palace.\""},{"type":"hid3","full":"ORANGE","cap":"OGE","s":"The OGE was juicy and sweet.","ans":"RAN","opts":["RAN","PEN","BAN","CAN","NAG"],"notes":{},"d":1,"id":"qw7","why":"RAN slots into OGE to make ORANGE: \"The ORANGE was juicy and sweet.\""},{"type":"hid3","full":"BRIDGE","cap":"BGE","s":"We walked across the BGE over the river.","ans":"RID","opts":["RID","AIR","OUR","ILL","AND"],"notes":{},"d":2,"id":"qw8","why":"RID slots into BGE to make BRIDGE: \"We walked across the BRIDGE over the river.\""},{"type":"hid3","full":"BANANA","cap":"BAA","s":"The monkey peeled a BAA.","ans":"NAN","opts":["NAN","BAN","NUT","TEA","PEA"],"notes":{},"d":1,"id":"qw9","why":"NAN slots into BAA to make BANANA: \"The monkey peeled a BANANA.\""},{"type":"hid3","full":"HEATED","cap":"HED","s":"The swimming pool is HED in winter.","ans":"EAT","opts":["EAT","ARM","AND","OLD","USE"],"notes":{"ARM":"HARMED is a word, but \"the pool is harmed in winter\" doesn't make sense.","AND":"HANDED is a word, but not here."},"d":3,"id":"qw10","why":"EAT slots into HED to make HEATED: \"The swimming pool is HEATED in winter.\""},{"type":"hid3","full":"CAPTAIN","cap":"TAIN","s":"The TAIN steered the ship through the storm.","ans":"CAP","opts":["CAP","CUP","PAN","MAP","TOP"],"notes":{},"d":2,"id":"qw11","why":"CAP slots into TAIN to make CAPTAIN: \"The CAPTAIN steered the ship through the storm.\""},{"type":"hid3","full":"BROTHER","cap":"BROR","s":"My BROR plays football every Saturday.","ans":"THE","opts":["THE","ILL","OUR","OAR","ANT"],"notes":{},"d":2,"id":"qw12","why":"THE slots into BROR to make BROTHER: \"My BROTHER plays football every Saturday.\""},{"type":"hid3","full":"CANDLE","cap":"CLE","s":"She lit a CLE on the birthday cake.","ans":"AND","opts":["AND","OIL","ALL","ATE","ARE"],"notes":{},"d":2,"id":"qw13","why":"AND slots into CLE to make CANDLE: \"She lit a CANDLE on the birthday cake.\""},{"type":"hid3","full":"PILOT","cap":"PI","s":"The PI landed the plane safely.","ans":"LOT","opts":["LOT","PER","ANT","NUT","SAY"],"notes":{"PER":"PIPER is a word (someone who plays the pipes), but pipers don't land planes."},"d":3,"id":"qw14","why":"LOT slots into PI to make PILOT: \"The PILOT landed the plane safely.\""},{"type":"hid3","full":"SCARF","cap":"SF","s":"She wrapped a woolly SF around her neck.","ans":"CAR","opts":["CAR","PAN","HAT","COW","CAT"],"notes":{},"d":1,"id":"qw15","why":"CAR slots into SF to make SCARF: \"She wrapped a woolly SCARF around her neck.\""},{"type":"hid3","full":"WHEAT","cap":"WH","s":"The farmer harvested the WH in August.","ans":"EAT","opts":["EAT","HAT","AIR","ITE","ALE"],"notes":{"ALE":"WHALE is a word, but farmers don't harvest whales!"},"d":3,"id":"qw16","why":"EAT slots into WH to make WHEAT: \"The farmer harvested the WHEAT in August.\""},{"type":"hid3","full":"THEATRE","cap":"THRE","s":"We watched a play at the THRE.","ans":"EAT","opts":["EAT","RAT","OAT","ART","ICE"],"notes":{},"d":3,"id":"qw17","why":"EAT slots into THRE to make THEATRE: \"We watched a play at the THEATRE.\""}],"own":[{"type":"sent","s":"That bag is **mine**.","w":"mine","ans":"pronoun","h":"Say it: \"That's mine!\" Does that sound finished?","why":"\"That's mine!\" ✓ sounds finished, so mine stands alone. It's a pronoun.","d":1,"id":"own0","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"**My** bag is heavy.","w":"My","ans":"determiner","h":"Say it: \"That's my!\" Does that sound finished?","why":"\"That's my!\" ✗ sounds unfinished. My needs a noun after it (my bag), so it's a determiner.","d":1,"id":"own1","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"The house is **theirs**.","w":"theirs","ans":"pronoun","h":"Say it: \"That's theirs!\" Does that sound finished?","why":"\"That's theirs!\" ✓ sounds finished, so theirs stands alone. It's a pronoun.","d":1,"id":"own2","trap":"their / theirs"},{"type":"sent","s":"**Their** house is huge.","w":"Their","ans":"determiner","h":"Say it: \"That's their!\" Does that sound finished?","why":"\"That's their!\" ✗ sounds unfinished. Their needs a noun after it (their house), so it's a determiner.","d":1,"id":"own3","trap":"their / theirs"},{"type":"sent","s":"Is this pencil **yours**?","w":"yours","ans":"pronoun","h":"Say it: \"That's yours!\" Does that sound finished?","why":"\"That's yours!\" ✓ sounds finished, so yours stands alone. It's a pronoun.","d":1,"id":"own4","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"**Your** coat is on the floor.","w":"Your","ans":"determiner","h":"Say it: \"That's your!\" Does that sound finished?","why":"\"That's your!\" ✗ sounds unfinished. Your needs a noun after it (your coat), so it's a determiner.","d":1,"id":"own5","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"**My** favourite subject is music.","w":"My","ans":"determiner","h":"Say it: \"That's my!\" Does that sound finished?","why":"\"That's my!\" ✗ sounds unfinished. My needs a noun after it (my favourite subject), so it's a determiner.","d":1,"id":"own6","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"That garden is **ours**.","w":"ours","ans":"pronoun","h":"Say it: \"That's ours!\" Does that sound finished?","why":"\"That's ours!\" ✓ sounds finished, so ours stands alone. It's a pronoun.","d":2,"id":"own7","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"**Our** teacher is kind.","w":"Our","ans":"determiner","h":"Say it: \"That's our!\" Does that sound finished?","why":"\"That's our!\" ✗ sounds unfinished. Our needs a noun after it (our teacher), so it's a determiner.","d":2,"id":"own8","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"The best idea was **yours**.","w":"yours","ans":"pronoun","h":"Say it: \"That's yours!\" Does that sound finished?","why":"\"That's yours!\" ✓ sounds finished, so yours stands alone. It's a pronoun.","d":2,"id":"own9","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"The scarf on the chair is **hers**.","w":"hers","ans":"pronoun","h":"Say it: \"That's hers!\" Does that sound finished?","why":"\"That's hers!\" ✓ sounds finished, so hers stands alone. It's a pronoun.","d":2,"id":"own10","trap":"my/mine · your/yours · our/ours"},{"type":"sent","s":"**Its** tail was wagging.","w":"Its","ans":"determiner","h":"Say it: \"That's its!\" Does that sound finished?","why":"\"That's its!\" ✗ sounds unfinished. Its needs a noun after it (its tail), so it's a determiner.","d":2,"id":"own11","trap":"its / it's"},{"type":"sent","s":"The dog chased **its** own tail.","w":"its","ans":"determiner","h":"Say it: \"That's its!\" Does that sound finished?","why":"\"That's its!\" ✗ sounds unfinished. Its needs a noun after it (its own tail), so it's a determiner.","d":2,"id":"own12","trap":"its / it's"},{"type":"sent","s":"The red bike is **his**.","w":"his","ans":"pronoun","h":"His can do both jobs, so look at the sentence. Is there a noun straight after his, or does it stand alone at the end?","why":"His stands alone at the end with nothing after it, just like \"That's his!\". It's a pronoun.","d":2,"id":"own13","trap":"his"},{"type":"sent","s":"**His** bike is red.","w":"His","ans":"determiner","h":"His can do both jobs, so look at the sentence. What comes straight after his? Is it a noun he owns?","why":"His comes straight before the noun bike and tells us whose bike it is, so it's a determiner (like my bike).","d":2,"id":"own14","trap":"his"},{"type":"sent","s":"Those muddy boots must be **his**.","w":"his","ans":"pronoun","h":"His can do both jobs. Is there a noun straight after his, or is it standing alone?","why":"Nothing comes after his: it stands alone, like \"That's his!\". It's a pronoun.","d":3,"id":"own15","trap":"his"},{"type":"sent","s":"I helped **her**.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"I helped him\" or \"I helped his\"?","why":"\"I helped him\" ✓ (not his), so her is a pronoun here.","d":3,"id":"own16","trap":"her (pronoun or determiner)"},{"type":"sent","s":"**Her** kite flew high.","w":"Her","ans":"determiner","h":"Swap her for him or his. Which sounds right: \"Him kite flew high\" or \"His kite flew high\"?","why":"\"His kite\" ✓ (not him), so her is a determiner here: it goes before the noun kite.","d":3,"id":"own17","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Give **her** a book.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"Give him a book\" or \"Give his a book\"?","why":"\"Give him a book\" ✓, so her is a pronoun here. (The book isn't hers yet!)","d":3,"id":"own18","trap":"her (pronoun or determiner)"},{"type":"sent","s":"We waited for **her**.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"We waited for him\" or \"We waited for his\"?","why":"\"We waited for him\" ✓, so her is a pronoun here.","d":3,"id":"own19","trap":"her (pronoun or determiner)"},{"type":"sent","s":"**Her** brother plays chess.","w":"Her","ans":"determiner","h":"Swap her for him or his: \"Him brother plays chess\" or \"His brother plays chess\"?","why":"\"His brother\" ✓, so her is a determiner here.","d":3,"id":"own20","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Mum called **her** in for dinner.","w":"her","ans":"pronoun","h":"Swap her for him or his: \"Mum called him in\" or \"Mum called his in\"?","why":"\"Mum called him in\" ✓, so her is a pronoun here.","d":3,"id":"own21","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Have you met **her** grandmother?","w":"her","ans":"determiner","h":"Swap her for him or his: \"Have you met him grandmother?\" or \"Have you met his grandmother?\"","why":"\"His grandmother\" ✓, so her is a determiner here.","d":3,"id":"own22","trap":"her (pronoun or determiner)"},{"type":"sent","s":"The decision was **theirs** to make.","w":"theirs","ans":"pronoun","h":"Say it: \"That's theirs!\" Does that sound finished?","why":"\"That's theirs!\" ✓ sounds finished, so theirs stands alone. It's a pronoun.","d":3,"id":"own23","trap":"their / theirs"},{"type":"notp","kind":"pronoun","opts":["ours","mine","her","their","yours"],"ans":"their","why":"\"That's their!\" ✗ is unfinished, so their is a determiner. Careful: her CAN be a pronoun (\"That's her!\" ✓), so it isn't the odd one out.","d":3,"id":"own24","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["each","my","mine","some","our"],"ans":"mine","why":"\"Mine book\" ✗: mine can't go before a noun. It stands alone (\"That's mine!\"), so it's a pronoun, not a determiner.","d":2,"id":"own25","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["their","your","theirs","his","our"],"ans":"theirs","why":"\"Theirs book\" ✗: theirs stands alone (\"That's theirs!\"), so it's a pronoun, not a determiner.","d":3,"id":"own26","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["hers","ours","his","its","mine"],"ans":"its","why":"\"That's its!\" ✗ sounds unfinished. Its needs a noun (its tail), so it's a determiner. His can stand alone (\"That's his!\").","d":3,"id":"own27","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["mine","yours","my","hers","theirs"],"ans":"my","why":"\"That's my!\" ✗ is unfinished. My needs a noun (my bag), so it's a determiner.","d":1,"id":"own28","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["ours","hers","our","yours","theirs"],"ans":"our","why":"\"That's our!\" ✗ is unfinished. Our needs a noun (our dog), so it's a determiner.","d":1,"id":"own29","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["your","our","ours","my","their"],"ans":"ours","why":"\"Ours book\" ✗: ours stands alone (\"That's ours!\"), so it's a pronoun.","d":2,"id":"own30","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["theirs","ours","hers","yours","your"],"ans":"your","why":"\"That's your!\" ✗ is unfinished. Your needs a noun (your coat), so it's a determiner.","d":2,"id":"own31","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["the","a","its","hers","every"],"ans":"hers","why":"\"Hers book\" ✗: hers stands alone (\"That's hers!\"), so it's a pronoun. Its, the, a and every all go before nouns.","d":3,"id":"own32","trap":"NOT a pronoun / determiner"},{"type":"choose","s":"Those seats are ___.","opts":["our","ours","us","our's"],"ans":"ours","why":"Nothing comes after the gap, so we need the stand-alone pronoun: \"Those seats are ours.\" Owner words never take an apostrophe, so our's is wrong.","d":1,"id":"own33","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"This lunchbox is ___, not yours.","opts":["my","mine","me","mine's"],"ans":"mine","why":"Nothing comes after the gap (before the comma), so it's the stand-alone pronoun mine: \"That's mine!\" ✓","d":1,"id":"own34","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"___ teacher gave us extra homework.","opts":["Our","Ours","Us","Our's"],"ans":"Our","why":"The noun teacher comes straight after the gap, so we need the determiner our: \"our teacher\".","d":1,"id":"own35","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"___ house has a red door.","opts":["There","Their","Theirs","They're"],"ans":"Their","why":"The noun house comes straight after the gap, so we need the determiner their. (There = a place; they're = they are.)","d":2,"id":"own36","trap":"their / there / they're"},{"type":"choose","s":"Is this coat ___ or mine?","opts":["your","yours","your's","you're"],"ans":"yours","why":"Nothing comes after the gap, so we need the stand-alone pronoun yours, matching mine. No apostrophe: your's is never right, and you're = you are.","d":2,"id":"own37","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The prize was ___ because she ran fastest.","opts":["her","hers","her's","she"],"ans":"hers","why":"The prize belonged to her, and nothing comes after the gap, so we need the stand-alone pronoun hers: \"That's hers!\" ✓","d":2,"id":"own38","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"We visited ___ new flat on Saturday.","opts":["their","theirs","there","they're"],"ans":"their","why":"\"New flat\" comes straight after the gap, so we need the determiner their.","d":2,"id":"own39","trap":"their / there / they're"},{"type":"choose","s":"Excuse me, is that umbrella ___?","opts":["your","yours","you're","your's"],"ans":"yours","why":"Nothing comes after the gap, so we need the stand-alone pronoun yours.","d":2,"id":"own40","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The blue bike is ___; mine is red.","opts":["his","him","he","his'"],"ans":"his","why":"The bike belongs to him and nothing comes after the gap: \"That's his!\" ✓ (Him and he don't show who owns it.)","d":2,"id":"own41","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The cat licked ___ paws.","opts":["it's","its","its'"],"ans":"its","why":"The noun paws comes straight after the gap, so we need the determiner its. It's = it is (\"the cat licked it is paws\" ✗).","d":3,"id":"own42","trap":"its / it's"},{"type":"choose","s":"The puppy wagged ___ tail.","opts":["it's","its","it","its'"],"ans":"its","why":"The noun tail comes next, so we need the determiner its. No apostrophe: it's means it is.","d":3,"id":"own43","trap":"its / it's"},{"type":"choose","s":"___ going to be late if they don't hurry.","opts":["Their","There","They're","Theirs"],"ans":"They're","why":"Read it as \"They are going to be late\" ✓, so it's they're (they are). This one isn't an owner word at all!","d":3,"id":"own44","trap":"their / there / they're"}],"wf":[{"type":"mc","q":"What type of word is <b>fragile</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>fragile</b>: \"the fragile\" · \"I fragile\" / \"I have fragile\" / \"I am fragile\" · \"a very fragile one\" · \"She did it fragile\". Which one works?","why":"\"a very fragile one\" ✓ but \"the fragile\" ✗, so fragile is an adjective (it describes).","trap":"fragile / fragility","d":1,"id":"wf0"},{"type":"mc","q":"What type of word is <b>fragility</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>fragility</b>: \"the fragility\" · \"I fragility\" / \"I have fragility\" / \"I am fragility\" · \"a very fragility one\" · \"She did it fragility\". Which one works?","why":"\"the fragility\" ✓, so fragility is a noun. Endings like -ity, -ness and -ion often make nouns.","trap":"fragile / fragility","d":2,"id":"wf1"},{"type":"mc","q":"What type of word is <b>honest</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>honest</b>: \"the honest\" · \"I honest\" / \"I have honest\" / \"I am honest\" · \"a very honest one\" · \"She did it honest\". Which one works?","why":"\"a very honest one\" ✓, so honest is an adjective.","trap":"honest / honesty","d":1,"id":"wf2"},{"type":"mc","q":"What type of word is <b>honesty</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>honesty</b>: \"the honesty\" · \"I honesty\" / \"I have honesty\" / \"I am honesty\" · \"a very honesty one\" · \"She did it honesty\". Which one works?","why":"\"the honesty\" ✓, so honesty is a noun (an abstract noun).","trap":"honest / honesty","d":2,"id":"wf3"},{"type":"mc","q":"What type of word is <b>lovely</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>lovely</b>: \"the lovely\" · \"I lovely\" / \"I have lovely\" / \"I am lovely\" · \"a very lovely one\" · \"She did it lovely\". Which one works?","why":"\"She did it lovely\" ✗ but \"a very lovely one\" ✓. Lovely ends in -ly but it's an adjective!","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf4"},{"type":"mc","q":"What type of word is <b>friendly</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>friendly</b>: \"the friendly\" · \"I friendly\" / \"I have friendly\" / \"I am friendly\" · \"a very friendly one\" · \"She did it friendly\". Which one works?","why":"\"She did it friendly\" ✗ but \"a very friendly one\" ✓. An -ly adjective, not an adverb.","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf5"},{"type":"mc","q":"What type of word is <b>perspective</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>perspective</b>: \"the perspective\" · \"I perspective\" / \"I have perspective\" / \"I am perspective\" · \"a very perspective one\" · \"She did it perspective\". Which one works?","why":"\"the perspective\" ✓, so perspective is a noun.","trap":"perspective / forgiveness (nouns)","d":3,"id":"wf6"},{"type":"mc","q":"What type of word is <b>forgiveness</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>forgiveness</b>: \"the forgiveness\" · \"I forgiveness\" / \"I have forgiveness\" / \"I am forgiveness\" · \"a very forgiveness one\" · \"She did it forgiveness\". Which one works?","why":"\"the forgiveness\" ✓, so forgiveness is a noun. -ness makes nouns.","trap":"perspective / forgiveness (nouns)","d":2,"id":"wf7"},{"type":"mc","q":"What type of word is <b>genuinely</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>genuinely</b>: \"the genuinely\" · \"I genuinely\" / \"I have genuinely\" / \"I am genuinely\" · \"a very genuinely one\" · \"She did it genuinely\". Which one works?","why":"\"She did it genuinely\" ✓, so genuinely is an adverb (it tells you how).","trap":"genuinely (adverb)","d":2,"id":"wf8"},{"type":"mc","q":"What type of word is <b>quickly</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>quickly</b>: \"the quickly\" · \"I quickly\" / \"I have quickly\" / \"I am quickly\" · \"a very quickly one\" · \"She did it quickly\". Which one works?","why":"\"She did it quickly\" ✓, so quickly is an adverb.","trap":"adverbs","d":1,"id":"wf9"},{"type":"mc","q":"What type of word is <b>happiness</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>happiness</b>: \"the happiness\" · \"I happiness\" / \"I have happiness\" / \"I am happiness\" · \"a very happiness one\" · \"She did it happiness\". Which one works?","why":"\"the happiness\" ✓, so happiness is a noun.","trap":"abstract nouns","d":1,"id":"wf10"},{"type":"mc","q":"What type of word is <b>wept</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"verb","h":"Try the ear tests with <b>wept</b>: \"the wept\" · \"I wept\" / \"I have wept\" / \"I am wept\" · \"a very wept one\" · \"She did it wept\". Which one works?","why":"\"I wept\" ✓, so wept is a verb (the past of weep).","trap":"past-tense verbs","d":1,"id":"wf11"},{"type":"mc","q":"What type of word is <b>foresaw</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"verb","h":"Try the ear tests with <b>foresaw</b>: \"the foresaw\" · \"I foresaw\" / \"I have foresaw\" / \"I am foresaw\" · \"a very foresaw one\" · \"She did it foresaw\". Which one works?","why":"\"I foresaw\" ✓, so foresaw is a verb (the past of foresee).","trap":"past-tense verbs","d":2,"id":"wf12"},{"type":"mc","q":"What type of word is <b>decision</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>decision</b>: \"the decision\" · \"I decision\" / \"I have decision\" / \"I am decision\" · \"a very decision one\" · \"She did it decision\". Which one works?","why":"\"the decision\" ✓, so decision is a noun. Its verb is decide.","trap":"verb / noun pairs","d":2,"id":"wf13"},{"type":"mc","q":"What type of word is <b>courageous</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>courageous</b>: \"the courageous\" · \"I courageous\" / \"I have courageous\" / \"I am courageous\" · \"a very courageous one\" · \"She did it courageous\". Which one works?","why":"\"a very courageous one\" ✓, so courageous is an adjective. Its noun is courage.","trap":"adjective / noun pairs","d":2,"id":"wf14"},{"type":"mc","q":"What type of word is <b>often</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>often</b>: \"the often\" · \"I often\" / \"I have often\" / \"I am often\" · \"a very often one\" · \"She did it often\". Which one works?","why":"\"She did it often\" ✓, so often is an adverb (it tells you how often).","trap":"adverbs","d":2,"id":"wf15"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["dog","noun"],["happy","adjective"],["chair","noun"],["quickly","adverb"],["garden","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: dog, chair, garden. The test \"the ___\" only works for those.","trap":"counting word types","d":1,"id":"wf16"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["fragility","noun"],["fragile","adjective"],["honesty","noun"],["honest","adjective"],["forgiveness","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: fragility, honesty, forgiveness. The test \"the ___\" only works for those.","trap":"fragile / fragility","d":2,"id":"wf17"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["perspective","noun"],["beautiful","adjective"],["wisdom","noun"],["careful","adjective"],["freedom","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: perspective, wisdom, freedom. The test \"the ___\" only works for those.","trap":"perspective / forgiveness (nouns)","d":3,"id":"wf18"},{"type":"count","q":"How many <b>verbs</b> are in this list?","words":[["jump","verb"],["blue","adjective"],["sang","verb"],["sofa","noun"],["wept","verb"]],"cls":"verb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 verbs: jump, sang, wept. The test \"I ___\" only works for those.","trap":"past-tense verbs","d":1,"id":"wf19"},{"type":"count","q":"How many <b>verbs</b> are in this list?","words":[["decide","verb"],["decision","noun"],["explore","verb"],["explorer","noun"],["arrive","verb"]],"cls":"verb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 verbs: decide, explore, arrive. The test \"I ___\" only works for those.","trap":"verb / noun pairs","d":2,"id":"wf20"},{"type":"count","q":"How many <b>adjectives</b> are in this list?","words":[["happy","adjective"],["happily","adverb"],["calm","adjective"],["calmly","adverb"],["brave","adjective"]],"cls":"adjective","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adjectives: happy, calm, brave. The test \"a very ___ one\" only works for those.","trap":"counting word types","d":1,"id":"wf21"},{"type":"count","q":"How many <b>adjectives</b> are in this list?","words":[["fragile","adjective"],["fragility","noun"],["lovely","adjective"],["loveliness","noun"],["honest","adjective"]],"cls":"adjective","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adjectives: fragile, lovely, honest. The test \"a very ___ one\" only works for those.","trap":"-ly adjectives (lovely, friendly)","d":2,"id":"wf22"},{"type":"count","q":"How many <b>adverbs</b> are in this list?","words":[["quickly","adverb"],["lovely","adjective"],["genuinely","adverb"],["friendly","adjective"],["often","adverb"]],"cls":"adverb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adverbs: quickly, genuinely, often.
