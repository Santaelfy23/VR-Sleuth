"opts":["treacherous","tranquil","trivial","tidy","timid"],"why":"Cling to the rocks \u2192 dangerous \u2192 treacherous.","d":2,"id":"quest240"},{"type":"cloze","q":"Select the word that completes the sentence in the most sensible way.","s":"The ___ weather forced the school trip to be cancelled.","ans":"inclement","opts":["inclement","pleasant","balmy","incidental","incredible"],"why":"Trip cancelled \u2192 bad weather \u2192 inclement (cold, wet, stormy).","d":3,"id":"quest241"},{"type":"cloze","q":"Select the word that completes the sentence in the most sensible way.","s":"After the argument, the two friends were ___ and laughing again.","ans":"reconciled","opts":["reconciled","recycled","reckless","resentful","reluctant"],"why":"Laughing again after an argument \u2192 friends again \u2192 reconciled.","d":3,"id":"quest242"},{"type":"cloze","q":"What does the word '<b>bank</b>' mean in this sentence?","s":"We had a picnic on the bank of the river.","ans":"edge of a river","opts":["edge of a river","a place for money","to rely on","a row of switches","to tilt"],"why":"A picnic by a river \u2192 the bank is the land at its edge.","d":1,"id":"quest243"},{"type":"cloze","q":"What does the word '<b>present</b>' mean in this sentence?","s":"All the pupils were present for the photo.","ans":"there","opts":["there","a gift","now","to show","to give"],"why":"Present for the photo \u2192 they were there.","d":2,"id":"quest244"},{"type":"cloze","q":"What does the word '<b>cross</b>' mean in this sentence?","s":"Mum was cross when the vase broke.","ans":"annoyed","opts":["annoyed","an X shape","to go across","a mix of two breeds","a road junction"],"why":"How Mum felt \u2192 cross means annoyed.","d":2,"id":"quest245"},{"type":"cloze","q":"What does the word '<b>firm</b>' mean in this sentence?","s":"The mattress was firm and supportive.","ans":"solid","opts":["solid","a company","strict","to tighten","a decision"],"why":"A mattress that supports you \u2192 firm means solid.","d":2,"id":"quest246"},{"type":"opp","A":["maximum","limit","speed"],"B":["highest","minimum","sign"],"a":"maximum","b":"minimum","why":"Maximum \u2194 minimum. Highest is a synonym trap.","d":1,"id":"quest247"},{"type":"opp","A":["humble","king","throne"],"B":["meek","arrogant","crown"],"a":"humble","b":"arrogant","why":"Humble \u2194 arrogant. Meek is a synonym trap.","d":2,"id":"quest248"},{"type":"opp","A":["sturdy","table","oak"],"B":["strong","flimsy","wood"],"a":"sturdy","b":"flimsy","why":"Sturdy \u2194 flimsy. Strong is a synonym trap.","d":2,"id":"quest249"},{"type":"opp","A":["conceal","secret","diary"],"B":["cover","reveal","spy"],"a":"conceal","b":"reveal","why":"Conceal (hide) \u2194 reveal (show). Cover is a synonym trap.","d":2,"id":"quest250"},{"type":"opp","A":["artificial","plastic","factory"],"B":["synthetic","natural","machine"],"a":"artificial","b":"natural","why":"Artificial \u2194 natural. Synthetic is a synonym trap.","d":2,"id":"quest251"},{"type":"opp","A":["ally","team","help"],"B":["partner","enemy","war"],"a":"ally","b":"enemy","why":"Ally \u2194 enemy. Partner is a synonym trap.","d":2,"id":"quest252"},{"type":"opp","A":["frequent","visit","bus"],"B":["regular","rare","trip"],"a":"frequent","b":"rare","why":"Frequent (often) \u2194 rare. Regular is a synonym trap.","d":2,"id":"quest253"},{"type":"opp","A":["optimist","hope","bright"],"B":["cheerful","pessimist","future"],"a":"optimist","b":"pessimist","why":"Optimist (expects good things) \u2194 pessimist (expects bad things).","d":3,"id":"quest254"},{"type":"ana","w1":"kitten","w2":"foal","A":["cat","milk","purr"],"B":["horse","hay","gallop"],"a":"cat","b":"horse","rule":"meaning","why":"A kitten grows into a cat; a foal grows into a horse.","d":1,"id":"quest255"},{"type":"ana","w1":"day","w2":"summer","A":["night","sun","week"],"B":["winter","hot","holiday"],"a":"night","b":"winter","rule":"meaning","why":"Opposites: day \u2194 night, summer \u2194 winter.","d":1,"id":"quest256"},{"type":"ana","w1":"fish","w2":"bird","A":["swim","gill","water"],"B":["fly","nest","wing"],"a":"swim","b":"fly","rule":"meaning","why":"How it moves: a fish swims, a bird flies.","d":1,"id":"quest257"},{"type":"ana","w1":"library","w2":"gallery","A":["books","quiet","borrow"],"B":["paintings","artist","frame"],"a":"books","b":"paintings","rule":"meaning","why":"What's kept there: a library has books, a gallery has paintings.","d":2,"id":"quest258"},{"type":"ana","w1":"lion","w2":"wolf","A":["pride","roar","mane"],"B":["pack","howl","den"],"a":"pride","b":"pack","rule":"meaning","why":"A group of them: a pride of lions, a pack of wolves.","d":2,"id":"quest259"},{"type":"ana","w1":"star","w2":"live","A":["rats","sky","moon"],"B":["evil","life","alive"],"a":"rats","b":"evil","rule":"letters","why":"Write it backwards: star \u2192 rats, live \u2192 evil.","d":2,"id":"quest260"},{"type":"ana","w1":"tap","w2":"net","A":["pat","water","sink"],"B":["ten","fish","goal"],"a":"pat","b":"ten","rule":"letters","why":"Write it backwards: tap \u2192 pat, net \u2192 ten.","d":2,"id":"quest261"},{"type":"ana","w1":"hear","w2":"sea","A":["here","ear","listen"],"B":["see","ocean","wave"],"a":"here","b":"see","rule":"letters","why":"Sound-alikes: hear \u2192 here, sea \u2192 see.","d":2,"id":"quest262"},{"type":"ana","w1":"slow","w2":"brain","A":["low","fast","snail"],"B":["rain","mind","think"],"a":"low","b":"rain","rule":"letters","why":"Take off the first letter: s|low \u2192 low, b|rain \u2192 rain.","d":3,"id":"quest263"},{"type":"ana","w1":"care","w2":"wing","A":["scare","kind","help"],"B":["swing","bird","fly"],"a":"scare","b":"swing","rule":"letters","why":"Add an s to the front: care \u2192 scare, wing \u2192 swing.","d":3,"id":"quest264"}],"own":[{"type":"sent","s":"That bag is **mine**.","w":"mine","ans":"pronoun","h":"Say it: \"That's mine!\" Does that sound finished?","why":"\"That's mine!\" \u2713 sounds finished, so mine stands alone. It's a pronoun.","d":1,"id":"own0","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"**My** bag is heavy.","w":"My","ans":"determiner","h":"Say it: \"That's my!\" Does that sound finished?","why":"\"That's my!\" \u2717 sounds unfinished. My needs a noun after it (my bag), so it's a determiner.","d":1,"id":"own1","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"The house is **theirs**.","w":"theirs","ans":"pronoun","h":"Say it: \"That's theirs!\" Does that sound finished?","why":"\"That's theirs!\" \u2713 sounds finished, so theirs stands alone. It's a pronoun.","d":1,"id":"own2","trap":"their / theirs"},{"type":"sent","s":"**Their** house is huge.","w":"Their","ans":"determiner","h":"Say it: \"That's their!\" Does that sound finished?","why":"\"That's their!\" \u2717 sounds unfinished. Their needs a noun after it (their house), so it's a determiner.","d":1,"id":"own3","trap":"their / theirs"},{"type":"sent","s":"Is this pencil **yours**?","w":"yours","ans":"pronoun","h":"Say it: \"That's yours!\" Does that sound finished?","why":"\"That's yours!\" \u2713 sounds finished, so yours stands alone. It's a pronoun.","d":1,"id":"own4","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"**Your** coat is on the floor.","w":"Your","ans":"determiner","h":"Say it: \"That's your!\" Does that sound finished?","why":"\"That's your!\" \u2717 sounds unfinished. Your needs a noun after it (your coat), so it's a determiner.","d":1,"id":"own5","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"**My** favourite subject is music.","w":"My","ans":"determiner","h":"Say it: \"That's my!\" Does that sound finished?","why":"\"That's my!\" \u2717 sounds unfinished. My needs a noun after it (my favourite subject), so it's a determiner.","d":1,"id":"own6","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"That garden is **ours**.","w":"ours","ans":"pronoun","h":"Say it: \"That's ours!\" Does that sound finished?","why":"\"That's ours!\" \u2713 sounds finished, so ours stands alone. It's a pronoun.","d":2,"id":"own7","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"**Our** teacher is kind.","w":"Our","ans":"determiner","h":"Say it: \"That's our!\" Does that sound finished?","why":"\"That's our!\" \u2717 sounds unfinished. Our needs a noun after it (our teacher), so it's a determiner.","d":2,"id":"own8","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"The best idea was **yours**.","w":"yours","ans":"pronoun","h":"Say it: \"That's yours!\" Does that sound finished?","why":"\"That's yours!\" \u2713 sounds finished, so yours stands alone. It's a pronoun.","d":2,"id":"own9","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"The scarf on the chair is **hers**.","w":"hers","ans":"pronoun","h":"Say it: \"That's hers!\" Does that sound finished?","why":"\"That's hers!\" \u2713 sounds finished, so hers stands alone. It's a pronoun.","d":2,"id":"own10","trap":"my/mine \u00b7 your/yours \u00b7 our/ours"},{"type":"sent","s":"**Its** tail was wagging.","w":"Its","ans":"determiner","h":"Say it: \"That's its!\" Does that sound finished?","why":"\"That's its!\" \u2717 sounds unfinished. Its needs a noun after it (its tail), so it's a determiner.","d":2,"id":"own11","trap":"its / it's"},{"type":"sent","s":"The dog chased **its** own tail.","w":"its","ans":"determiner","h":"Say it: \"That's its!\" Does that sound finished?","why":"\"That's its!\" \u2717 sounds unfinished. Its needs a noun after it (its own tail), so it's a determiner.","d":2,"id":"own12","trap":"its / it's"},{"type":"sent","s":"The red bike is **his**.","w":"his","ans":"pronoun","h":"His can do both jobs, so look at the sentence. Is there a noun straight after his, or does it stand alone at the end?","why":"His stands alone at the end with nothing after it, just like \"That's his!\". It's a pronoun.","d":2,"id":"own13","trap":"his"},{"type":"sent","s":"**His** bike is red.","w":"His","ans":"determiner","h":"His can do both jobs, so look at the sentence. What comes straight after his? Is it a noun he owns?","why":"His comes straight before the noun bike and tells us whose bike it is, so it's a determiner (like my bike).","d":2,"id":"own14","trap":"his"},{"type":"sent","s":"Those muddy boots must be **his**.","w":"his","ans":"pronoun","h":"His can do both jobs. Is there a noun straight after his, or is it standing alone?","why":"Nothing comes after his: it stands alone, like \"That's his!\". It's a pronoun.","d":3,"id":"own15","trap":"his"},{"type":"sent","s":"I helped **her**.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"I helped him\" or \"I helped his\"?","why":"\"I helped him\" \u2713 (not his), so her is a pronoun here.","d":3,"id":"own16","trap":"her (pronoun or determiner)"},{"type":"sent","s":"**Her** kite flew high.","w":"Her","ans":"determiner","h":"Swap her for him or his. Which sounds right: \"Him kite flew high\" or \"His kite flew high\"?","why":"\"His kite\" \u2713 (not him), so her is a determiner here: it goes before the noun kite.","d":3,"id":"own17","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Give **her** a book.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"Give him a book\" or \"Give his a book\"?","why":"\"Give him a book\" \u2713, so her is a pronoun here. (The book isn't hers yet!)","d":3,"id":"own18","trap":"her (pronoun or determiner)"},{"type":"sent","s":"We waited for **her**.","w":"her","ans":"pronoun","h":"Swap her for him or his. Which sounds right: \"We waited for him\" or \"We waited for his\"?","why":"\"We waited for him\" \u2713, so her is a pronoun here.","d":3,"id":"own19","trap":"her (pronoun or determiner)"},{"type":"sent","s":"**Her** brother plays chess.","w":"Her","ans":"determiner","h":"Swap her for him or his: \"Him brother plays chess\" or \"His brother plays chess\"?","why":"\"His brother\" \u2713, so her is a determiner here.","d":3,"id":"own20","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Mum called **her** in for dinner.","w":"her","ans":"pronoun","h":"Swap her for him or his: \"Mum called him in\" or \"Mum called his in\"?","why":"\"Mum called him in\" \u2713, so her is a pronoun here.","d":3,"id":"own21","trap":"her (pronoun or determiner)"},{"type":"sent","s":"Have you met **her** grandmother?","w":"her","ans":"determiner","h":"Swap her for him or his: \"Have you met him grandmother?\" or \"Have you met his grandmother?\"","why":"\"His grandmother\" \u2713, so her is a determiner here.","d":3,"id":"own22","trap":"her (pronoun or determiner)"},{"type":"sent","s":"The decision was **theirs** to make.","w":"theirs","ans":"pronoun","h":"Say it: \"That's theirs!\" Does that sound finished?","why":"\"That's theirs!\" \u2713 sounds finished, so theirs stands alone. It's a pronoun.","d":3,"id":"own23","trap":"their / theirs"},{"type":"notp","kind":"pronoun","opts":["ours","mine","her","their","yours"],"ans":"their","why":"\"That's their!\" \u2717 is unfinished, so their is a determiner. Careful: her CAN be a pronoun (\"That's her!\" \u2713), so it isn't the odd one out.","d":3,"id":"own24","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["each","my","mine","some","our"],"ans":"mine","why":"\"Mine book\" \u2717: mine can't go before a noun. It stands alone (\"That's mine!\"), so it's a pronoun, not a determiner.","d":2,"id":"own25","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["their","your","theirs","his","our"],"ans":"theirs","why":"\"Theirs book\" \u2717: theirs stands alone (\"That's theirs!\"), so it's a pronoun, not a determiner.","d":3,"id":"own26","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["hers","ours","his","its","mine"],"ans":"its","why":"\"That's its!\" \u2717 sounds unfinished. Its needs a noun (its tail), so it's a determiner. His can stand alone (\"That's his!\").","d":3,"id":"own27","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["mine","yours","my","hers","theirs"],"ans":"my","why":"\"That's my!\" \u2717 is unfinished. My needs a noun (my bag), so it's a determiner.","d":1,"id":"own28","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["ours","hers","our","yours","theirs"],"ans":"our","why":"\"That's our!\" \u2717 is unfinished. Our needs a noun (our dog), so it's a determiner.","d":1,"id":"own29","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["your","our","ours","my","their"],"ans":"ours","why":"\"Ours book\" \u2717: ours stands alone (\"That's ours!\"), so it's a pronoun.","d":2,"id":"own30","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"pronoun","opts":["theirs","ours","hers","yours","your"],"ans":"your","why":"\"That's your!\" \u2717 is unfinished. Your needs a noun (your coat), so it's a determiner.","d":2,"id":"own31","trap":"NOT a pronoun / determiner"},{"type":"notp","kind":"determiner","opts":["the","a","its","hers","every"],"ans":"hers","why":"\"Hers book\" \u2717: hers stands alone (\"That's hers!\"), so it's a pronoun. Its, the, a and every all go before nouns.","d":3,"id":"own32","trap":"NOT a pronoun / determiner"},{"type":"choose","s":"Those seats are ___.","opts":["our","ours","us","our's"],"ans":"ours","why":"Nothing comes after the gap, so we need the stand-alone pronoun: \"Those seats are ours.\" Owner words never take an apostrophe, so our's is wrong.","d":1,"id":"own33","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"This lunchbox is ___, not yours.","opts":["my","mine","me","mine's"],"ans":"mine","why":"Nothing comes after the gap (before the comma), so it's the stand-alone pronoun mine: \"That's mine!\" \u2713","d":1,"id":"own34","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"___ teacher gave us extra homework.","opts":["Our","Ours","Us","Our's"],"ans":"Our","why":"The noun teacher comes straight after the gap, so we need the determiner our: \"our teacher\".","d":1,"id":"own35","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"___ house has a red door.","opts":["There","Their","Theirs","They're"],"ans":"Their","why":"The noun house comes straight after the gap, so we need the determiner their. (There = a place; they're = they are.)","d":2,"id":"own36","trap":"their / there / they're"},{"type":"choose","s":"Is this coat ___ or mine?","opts":["your","yours","your's","you're"],"ans":"yours","why":"Nothing comes after the gap, so we need the stand-alone pronoun yours, matching mine. No apostrophe: your's is never right, and you're = you are.","d":2,"id":"own37","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The prize was ___ because she ran fastest.","opts":["her","hers","her's","she"],"ans":"hers","why":"The prize belonged to her, and nothing comes after the gap, so we need the stand-alone pronoun hers: \"That's hers!\" \u2713","d":2,"id":"own38","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"We visited ___ new flat on Saturday.","opts":["their","theirs","there","they're"],"ans":"their","why":"\"New flat\" comes straight after the gap, so we need the determiner their.","d":2,"id":"own39","trap":"their / there / they're"},{"type":"choose","s":"Excuse me, is that umbrella ___?","opts":["your","yours","you're","your's"],"ans":"yours","why":"Nothing comes after the gap, so we need the stand-alone pronoun yours.","d":2,"id":"own40","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The blue bike is ___; mine is red.","opts":["his","him","he","his'"],"ans":"his","why":"The bike belongs to him and nothing comes after the gap: \"That's his!\" \u2713 (Him and he don't show who owns it.)","d":2,"id":"own41","trap":"stand-alone pronouns (ours, yours, hers)"},{"type":"choose","s":"The cat licked ___ paws.","opts":["it's","its","its'"],"ans":"its","why":"The noun paws comes straight after the gap, so we need the determiner its. It's = it is (\"the cat licked it is paws\" \u2717).","d":3,"id":"own42","trap":"its / it's"},{"type":"choose","s":"The puppy wagged ___ tail.","opts":["it's","its","it","its'"],"ans":"its","why":"The noun tail comes next, so we need the determiner its. No apostrophe: it's means it is.","d":3,"id":"own43","trap":"its / it's"},{"type":"choose","s":"___ going to be late if they don't hurry.","opts":["Their","There","They're","Theirs"],"ans":"They're","why":"Read it as \"They are going to be late\" \u2713, so it's they're (they are). This one isn't an owner word at all!","d":3,"id":"own44","trap":"their / there / they're"}],"wf":[{"type":"mc","q":"What type of word is <b>fragile</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>fragile</b>: \"the fragile\" \u00b7 \"I fragile\" / \"I have fragile\" / \"I am fragile\" \u00b7 \"a very fragile one\" \u00b7 \"She did it fragile\". Which one works?","why":"\"a very fragile one\" \u2713 but \"the fragile\" \u2717, so fragile is an adjective (it describes).","trap":"fragile / fragility","d":1,"id":"wf0"},{"type":"mc","q":"What type of word is <b>fragility</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>fragility</b>: \"the fragility\" \u00b7 \"I fragility\" / \"I have fragility\" / \"I am fragility\" \u00b7 \"a very fragility one\" \u00b7 \"She did it fragility\". Which one works?","why":"\"the fragility\" \u2713, so fragility is a noun. Endings like -ity, -ness and -ion often make nouns.","trap":"fragile / fragility","d":2,"id":"wf1"},{"type":"mc","q":"What type of word is <b>honest</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>honest</b>: \"the honest\" \u00b7 \"I honest\" / \"I have honest\" / \"I am honest\" \u00b7 \"a very honest one\" \u00b7 \"She did it honest\". Which one works?","why":"\"a very honest one\" \u2713, so honest is an adjective.","trap":"honest / honesty","d":1,"id":"wf2"},{"type":"mc","q":"What type of word is <b>honesty</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>honesty</b>: \"the honesty\" \u00b7 \"I honesty\" / \"I have honesty\" / \"I am honesty\" \u00b7 \"a very honesty one\" \u00b7 \"She did it honesty\". Which one works?","why":"\"the honesty\" \u2713, so honesty is a noun (an abstract noun).","trap":"honest / honesty","d":2,"id":"wf3"},{"type":"mc","q":"What type of word is <b>lovely</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>lovely</b>: \"the lovely\" \u00b7 \"I lovely\" / \"I have lovely\" / \"I am lovely\" \u00b7 \"a very lovely one\" \u00b7 \"She did it lovely\". Which one works?","why":"\"She did it lovely\" \u2717 but \"a very lovely one\" \u2713. Lovely ends in -ly but it's an adjective!","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf4"},{"type":"mc","q":"What type of word is <b>friendly</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>friendly</b>: \"the friendly\" \u00b7 \"I friendly\" / \"I have friendly\" / \"I am friendly\" \u00b7 \"a very friendly one\" \u00b7 \"She did it friendly\". Which one works?","why":"\"She did it friendly\" \u2717 but \"a very friendly one\" \u2713. An -ly adjective, not an adverb.","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf5"},{"type":"mc","q":"What type of word is <b>perspective</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>perspective</b>: \"the perspective\" \u00b7 \"I perspective\" / \"I have perspective\" / \"I am perspective\" \u00b7 \"a very perspective one\" \u00b7 \"She did it perspective\". Which one works?","why":"\"the perspective\" \u2713, so perspective is a noun.","trap":"perspective / forgiveness (nouns)","d":3,"id":"wf6"},{"type":"mc","q":"What type of word is <b>forgiveness</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>forgiveness</b>: \"the forgiveness\" \u00b7 \"I forgiveness\" / \"I have forgiveness\" / \"I am forgiveness\" \u00b7 \"a very forgiveness one\" \u00b7 \"She did it forgiveness\". Which one works?","why":"\"the forgiveness\" \u2713, so forgiveness is a noun. -ness makes nouns.","trap":"perspective / forgiveness (nouns)","d":2,"id":"wf7"},{"type":"mc","q":"What type of word is <b>genuinely</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>genuinely</b>: \"the genuinely\" \u00b7 \"I genuinely\" / \"I have genuinely\" / \"I am genuinely\" \u00b7 \"a very genuinely one\" \u00b7 \"She did it genuinely\". Which one works?","why":"\"She did it genuinely\" \u2713, so genuinely is an adverb (it tells you how).","trap":"genuinely (adverb)","d":2,"id":"wf8"},{"type":"mc","q":"What type of word is <b>quickly</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>quickly</b>: \"the quickly\" \u00b7 \"I quickly\" / \"I have quickly\" / \"I am quickly\" \u00b7 \"a very quickly one\" \u00b7 \"She did it quickly\". Which one works?","why":"\"She did it quickly\" \u2713, so quickly is an adverb.","trap":"adverbs","d":1,"id":"wf9"},{"type":"mc","q":"What type of word is <b>happiness</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>happiness</b>: \"the happiness\" \u00b7 \"I happiness\" / \"I have happiness\" / \"I am happiness\" \u00b7 \"a very happiness one\" \u00b7 \"She did it happiness\". Which one works?","why":"\"the happiness\" \u2713, so happiness is a noun.","trap":"abstract nouns","d":1,"id":"wf10"},{"type":"mc","q":"What type of word is <b>wept</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"verb","h":"Try the ear tests with <b>wept</b>: \"the wept\" \u00b7 \"I wept\" / \"I have wept\" / \"I am wept\" \u00b7 \"a very wept one\" \u00b7 \"She did it wept\". Which one works?","why":"\"I wept\" \u2713, so wept is a verb (the past of weep).","trap":"past-tense verbs","d":1,"id":"wf11"},{"type":"mc","q":"What type of word is <b>foresaw</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"verb","h":"Try the ear tests with <b>foresaw</b>: \"the foresaw\" \u00b7 \"I foresaw\" / \"I have foresaw\" / \"I am foresaw\" \u00b7 \"a very foresaw one\" \u00b7 \"She did it foresaw\". Which one works?","why":"\"I foresaw\" \u2713, so foresaw is a verb (the past of foresee).","trap":"past-tense verbs","d":2,"id":"wf12"},{"type":"mc","q":"What type of word is <b>decision</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"noun","h":"Try the ear tests with <b>decision</b>: \"the decision\" \u00b7 \"I decision\" / \"I have decision\" / \"I am decision\" \u00b7 \"a very decision one\" \u00b7 \"She did it decision\". Which one works?","why":"\"the decision\" \u2713, so decision is a noun. Its verb is decide.","trap":"verb / noun pairs","d":2,"id":"wf13"},{"type":"mc","q":"What type of word is <b>courageous</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adjective","h":"Try the ear tests with <b>courageous</b>: \"the courageous\" \u00b7 \"I courageous\" / \"I have courageous\" / \"I am courageous\" \u00b7 \"a very courageous one\" \u00b7 \"She did it courageous\". Which one works?","why":"\"a very courageous one\" \u2713, so courageous is an adjective. Its noun is courage.","trap":"adjective / noun pairs","d":2,"id":"wf14"},{"type":"mc","q":"What type of word is <b>often</b>?","s":null,"opts":["noun","verb","adjective","adverb"],"keep":true,"ans":"adverb","h":"Try the ear tests with <b>often</b>: \"the often\" \u00b7 \"I often\" / \"I have often\" / \"I am often\" \u00b7 \"a very often one\" \u00b7 \"She did it often\". Which one works?","why":"\"She did it often\" \u2713, so often is an adverb (it tells you how often).","trap":"adverbs","d":2,"id":"wf15"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["dog","noun"],["happy","adjective"],["chair","noun"],["quickly","adverb"],["garden","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: dog, chair, garden. The test \"the ___\" only works for those.","trap":"counting word types","d":1,"id":"wf16"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["fragility","noun"],["fragile","adjective"],["honesty","noun"],["honest","adjective"],["forgiveness","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: fragility, honesty, forgiveness. The test \"the ___\" only works for those.","trap":"fragile / fragility","d":2,"id":"wf17"},{"type":"count","q":"How many <b>nouns</b> are in this list?","words":[["perspective","noun"],["beautiful","adjective"],["wisdom","noun"],["careful","adjective"],["freedom","noun"]],"cls":"noun","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 nouns: perspective, wisdom, freedom. The test \"the ___\" only works for those.","trap":"perspective / forgiveness (nouns)","d":3,"id":"wf18"},{"type":"count","q":"How many <b>verbs</b> are in this list?","words":[["jump","verb"],["blue","adjective"],["sang","verb"],["sofa","noun"],["wept","verb"]],"cls":"verb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 verbs: jump, sang, wept. The test \"I ___\" only works for those.","trap":"past-tense verbs","d":1,"id":"wf19"},{"type":"count","q":"How many <b>verbs</b> are in this list?","words":[["decide","verb"],["decision","noun"],["explore","verb"],["explorer","noun"],["arrive","verb"]],"cls":"verb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 verbs: decide, explore, arrive. The test \"I ___\" only works for those.","trap":"verb / noun pairs","d":2,"id":"wf20"},{"type":"count","q":"How many <b>adjectives</b> are in this list?","words":[["happy","adjective"],["happily","adverb"],["calm","adjective"],["calmly","adverb"],["brave","adjective"]],"cls":"adjective","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adjectives: happy, calm, brave. The test \"a very ___ one\" only works for those.","trap":"counting word types","d":1,"id":"wf21"},{"type":"count","q":"How many <b>adjectives</b> are in this list?","words":[["fragile","adjective"],["fragility","noun"],["lovely","adjective"],["loveliness","noun"],["honest","adjective"]],"cls":"adjective","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adjectives: fragile, lovely, honest. The test \"a very ___ one\" only works for those.","trap":"-ly adjectives (lovely, friendly)","d":2,"id":"wf22"},{"type":"count","q":"How many <b>adverbs</b> are in this list?","words":[["quickly","adverb"],["lovely","adjective"],["genuinely","adverb"],["friendly","adjective"],["often","adverb"]],"cls":"adverb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adverbs: quickly, genuinely, often. The test \"She did it ___\" only works for those.","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf23"},{"type":"count","q":"How many <b>adverbs</b> are in this list?","words":[["slowly","adverb"],["sleepy","adjective"],["soon","adverb"],["silly","adjective"],["here","adverb"]],"cls":"adverb","list":true,"opts":["1","2","3","4","5"],"keep":true,"ans":"3","why":"3 adverbs: slowly, soon, here. The test \"She did it ___\" only works for those.","trap":"adverbs","d":3,"id":"wf24"},{"type":"wtype","q":"What type of words are these?","words":[["foresaw","verb"],["sang","verb"],["wept","verb"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"verbs","why":"Every word passes the verb test, so they are all verbs.","trap":"past-tense verbs","d":1,"id":"wf25"},{"type":"wtype","q":"What type of words are these?","words":[["foresaw","verb"],["waned","verb"],["written","verb"],["wept","verb"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"verbs","why":"Every word passes the verb test, so they are all verbs.","trap":"past-tense verbs","d":2,"id":"wf26"},{"type":"wtype","q":"What type of words are these?","words":[["beautiful","adjective"],["enormous","adjective"],["fragile","adjective"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"adjectives","why":"Every word passes the adjective test, so they are all adjectives.","trap":"counting word types","d":1,"id":"wf27"},{"type":"wtype","q":"What type of words are these?","words":[["honesty","noun"],["fragility","noun"],["perspective","noun"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"nouns","why":"Every word passes the noun test, so they are all nouns.","trap":"fragile / fragility","d":2,"id":"wf28"},{"type":"wtype","q":"What type of words are these?","words":[["genuinely","adverb"],["rarely","adverb"],["quietly","adverb"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"adverbs","why":"Every word passes the adverb test, so they are all adverbs.","trap":"genuinely (adverb)","d":2,"id":"wf29"},{"type":"wtype","q":"What type of words are these?","words":[["lovely","adjective"],["friendly","adjective"],["lonely","adjective"]],"list":true,"opts":["nouns","verbs","adjectives","adverbs"],"keep":true,"ans":"adjectives","why":"Every word passes the adjective test, so they are all adjectives.","trap":"-ly adjectives (lovely, friendly)","d":3,"id":"wf30"},{"type":"mc","q":"Which is an <b>abstract</b> noun?","s":null,"opts":["table","honesty","river","London"],"ans":"honesty","h":"Ask: can you touch or see it (concrete)? Is it a feeling or idea (abstract)? Does it name one particular person or place with a capital letter (proper)? Is it a group of things (collective: \"a ___ of \u2026\")?","why":"You can't touch or see honesty. It's an idea or quality, so it's an abstract noun.","d":1,"trap":"noun families","notes":null,"keep":false,"id":"wf31"},{"type":"mc","q":"Which is a <b>collective</b> noun?","s":null,"opts":["flock","sheep","field","farmer"],"ans":"flock","h":"Say it: \"a ___ of sheep\". Which word names a <b>group</b>?","why":"\"A flock of sheep\": flock names a group, so it's a collective noun.","d":1,"trap":"noun families","notes":null,"keep":false,"id":"wf32"},{"type":"mc","q":"Which is a <b>proper</b> noun?","s":null,"opts":["city","Paris","river","country"],"ans":"Paris","h":"Which one names one <b>particular</b> place and needs a capital letter?","why":"Paris names one particular city and has a capital letter, so it's a proper noun.","d":1,"trap":"noun families","notes":null,"keep":false,"id":"wf33"},{"type":"mc","q":"Which is a <b>concrete</b> noun?","s":null,"opts":["bravery","freedom","pencil","fear"],"ans":"pencil","h":"Which one can you touch or see?","why":"You can touch a pencil, so it's a concrete noun. The others are ideas or feelings (abstract).","d":1,"trap":"noun families","notes":null,"keep":false,"id":"wf34"},{"type":"mc","q":"What type of noun is the underlined word?","s":"A **swarm** of bees flew past.","opts":["collective","abstract","proper","concrete"],"ans":"collective","h":"Ask: can you touch or see it (concrete)? Is it a feeling or idea (abstract)? Does it name one particular person or place with a capital letter (proper)? Is it a group of things (collective: \"a ___ of \u2026\")?","why":"\"A swarm of bees\": swarm names a group, so it's a collective noun.","d":2,"trap":"noun families","notes":null,"keep":false,"id":"wf35"},{"type":"mc","q":"What type of noun is the underlined word?","s":"Her **kindness** surprised everyone.","opts":["abstract","concrete","collective","proper"],"ans":"abstract","h":"Ask: can you touch or see it (concrete)? Is it a feeling or idea (abstract)? Does it name one particular person or place with a capital letter (proper)? Is it a group of things (collective: \"a ___ of \u2026\")?","why":"Kindness is a quality you can't touch, so it's an abstract noun.","d":2,"trap":"noun families","notes":null,"keep":false,"id":"wf36"},{"type":"mc","q":"Which is a <b>modal</b> verb?","s":null,"opts":["could","run","think","is"],"ans":"could","h":"Modal verbs tell you how likely or possible something is. Try: \"It ___ happen.\"","why":"\"It could happen\" \u2713. Could is a modal verb (like might, must, should, can, may, will, would).","d":2,"trap":"modal & auxiliary verbs","notes":null,"keep":false,"id":"wf37"},{"type":"mc","q":"What type of verb is the underlined word?","s":"It **might** rain later.","opts":["modal","auxiliary","action"],"ans":"modal","h":"Does it tell you how <b>likely</b> something is (\"It ___ happen\")?","why":"\"Might\" shows possibility, so it's a modal verb.","d":3,"trap":"modal & auxiliary verbs","notes":null,"keep":true,"id":"wf38"},{"type":"mc","q":"What type of verb is the underlined word?","s":"She **has** finished her homework.","opts":["auxiliary","modal","action"],"ans":"auxiliary","h":"Is there another verb straight after it doing the main action? Then it's helping (auxiliary).","why":"\"Has\" is helping the main verb finished, so it's an auxiliary (helping) verb.","d":3,"trap":"modal & auxiliary verbs","notes":null,"keep":true,"id":"wf39"},{"type":"mc","q":"Which word is the <b>auxiliary (helping)</b> verb?","s":"They were running for the bus.","opts":["were","running","bus","for"],"ans":"were","h":"Which word helps the main verb (running)?","why":"\"Were\" helps the main verb running, so it's the auxiliary verb.","d":3,"trap":"modal & auxiliary verbs","notes":null,"keep":false,"id":"wf40"},{"type":"mc","q":"Which is the <b>superlative</b>?","s":null,"opts":["tall","taller","tallest","tallness"],"ans":"tallest","h":"Try: \"the ___ of all\".","why":"\"The tallest of all\" \u2713. Superlatives compare three or more (-est or most).","d":1,"trap":"comparatives & superlatives","notes":null,"keep":false,"id":"wf41"},{"type":"mc","q":"Which is the <b>comparative</b>?","s":null,"opts":["good","better","best","well"],"ans":"better","h":"Try: \"___ than\".","why":"\"Better than\" \u2713. Comparatives compare two things (-er or more).","d":2,"trap":"comparatives & superlatives","notes":null,"keep":false,"id":"wf42"},{"type":"mc","q":"What is the comparative of <b>bad</b>?","s":null,"opts":["badder","worse","worst","more bad"],"ans":"worse","h":"Try each in \"This is ___ than that.\"","why":"\"Worse than\" \u2713. Worst is the superlative (the worst of all).","d":3,"trap":"comparatives & superlatives","notes":null,"keep":false,"id":"wf43"},{"type":"mc","q":"What type of adverb is the underlined word?","s":"We went to the museum **yesterday**.","opts":["time","place","manner","frequency","degree"],"ans":"time","h":"Ask: when? where? how? how often? how much?","why":"Yesterday tells us <b>when</b>, so it's an adverb of time.","d":2,"trap":"adverb families","notes":null,"keep":true,"id":"wf44"},{"type":"mc","q":"What type of adverb is the underlined word?","s":"He **always** walks to school.","opts":["frequency","time","manner","place","degree"],"ans":"frequency","h":"Ask: when? where? how? how often? how much?","why":"Always tells us <b>how often</b>, so it's an adverb of frequency.","d":2,"trap":"adverb families","notes":null,"keep":true,"id":"wf45"},{"type":"mc","q":"What type of adverb is the underlined word?","s":"She carried the tray **carefully**.","opts":["manner","time","place","frequency","degree"],"ans":"manner","h":"Ask: when? where? how? how often? how much?","why":"Carefully tells us <b>how</b>, so it's an adverb of manner.","d":1,"trap":"adverb families","notes":null,"keep":true,"id":"wf46"},{"type":"mc","q":"What type of adverb is the underlined word?","s":"The children played **outside**.","opts":["place","time","manner","frequency","degree"],"ans":"place","h":"Ask: when? where? how? how often? how much?","why":"Outside tells us <b>where</b>, so it's an adverb of place.","d":2,"trap":"adverb families","notes":null,"keep":true,"id":"wf47"},{"type":"mc","q":"What type of adverb is the underlined word?","s":"It was **extremely** cold.","opts":["degree","manner","time","place","frequency"],"ans":"degree","h":"Ask: when? where? how? how often? how much?","why":"Extremely tells us <b>how much</b> (how cold), so it's an adverb of degree.","d":3,"trap":"adverb families","notes":null,"keep":true,"id":"wf48"},{"type":"mc","q":"Which is a <b>reflexive</b> pronoun?","s":null,"opts":["himself","him","his","he"],"ans":"himself","h":"Reflexive pronouns end in -self or -selves and point back to the doer.","why":"Himself points back to the doer (\"He hurt himself\"), so it's reflexive.","d":2,"trap":"reflexive & relative pronouns","notes":null,"keep":false,"id":"wf49"},{"type":"mc","q":"Which word is the <b>relative</b> pronoun?","s":"The girl who won the race is my cousin.","opts":["who","girl","won","cousin"],"ans":"who","h":"Which word joins on extra information about a noun (who, which, that, whose, whom)?","why":"\"Who\" joins \"won the race\" on to \"the girl\", so it's a relative pronoun.","d":3,"trap":"reflexive & relative pronouns","notes":null,"keep":false,"id":"wf50"},{"type":"mc","q":"Which is a <b>relative</b> pronoun?","s":null,"opts":["which","them","ours","yourself"],"ans":"which","h":"Relative pronouns join extra information about a noun: who, whom, whose, which, that.","why":"Which is a relative pronoun (\"the cake, which was delicious, \u2026\").","d":3,"trap":"reflexive & relative pronouns","notes":null,"keep":false,"id":"wf51"},{"type":"mc","q":"Which word is the <b>noun</b>?","s":"She purchased it at a low price.","opts":["She","purchased","it","price"],"ans":"price","h":"Use the test \"the ___\": the She? the it? the price?","why":"\"The price\" \u2713. It and she are pronouns: they stand in for nouns, so \"the it\" \u2717.","d":2,"trap":"noun vs pronoun (it, everyone\u2026)","notes":null,"keep":false,"id":"wf52"},{"type":"mc","q":"Which word is a <b>pronoun</b>?","s":null,"opts":["everyone","team","idea","garden"],"ans":"everyone","h":"Try \"the ___\": the everyone? the team? A pronoun can't take \"the\".","why":"\"The everyone\" \u2717. Everyone stands in for people, so it's a pronoun (like something, nobody).","d":2,"trap":"noun vs pronoun (it, everyone\u2026)","notes":null,"keep":false,"id":"wf53"},{"type":"mc","q":"Which word is <b>NOT</b> a pronoun?","s":null,"opts":["nobody","something","they","kindness"],"ans":"kindness","h":"Try \"the ___\" with each. Which one CAN take \"the\"?","why":"\"The kindness\" \u2713, so kindness is a noun. Nobody, something and they are pronouns.","d":2,"trap":"noun vs pronoun (it, everyone\u2026)","notes":null,"keep":false,"id":"wf54"},{"type":"mc","q":"Which word is the <b>noun</b>?","s":"Nobody saw something strange in the attic.","opts":["Nobody","something","strange","attic"],"ans":"attic","h":"Use the test \"the ___\" on each word.","why":"\"The attic\" \u2713. Nobody and something are pronouns; strange is an adjective.","d":3,"trap":"noun vs pronoun (it, everyone\u2026)","notes":null,"keep":false,"id":"wf55"}],"nwc":[{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"We played **after** school.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>after</b>: <i>\"school\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After after comes a thing (\"school\"), so after is a preposition.","trap":"after / before / since / until","d":1,"id":"nwc0"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"We played **after** we had finished our homework.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>after</b>: <i>\"we had finished our homework\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After after comes someone doing something (\"we had finished our homework\"), so after is a conjunction.","trap":"after / before / since / until","d":1,"id":"nwc1"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"Jack fell down and Jill came tumbling **after**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>after</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows after for it to join, so after is an adverb.","trap":"after / before / since / until","d":2,"id":"nwc2"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"I have lived here **since** 2019.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>since</b>: <i>\"2019\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After since comes a thing (\"2019\"), so since is a preposition.","trap":"after / before / since / until","d":1,"id":"nwc3"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"**Since** it rained, the match was cancelled.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>since</b>: <i>\"it rained\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After since comes someone doing something (\"it rained\"), so since is a conjunction.","trap":"after / before / since / until","d":2,"id":"nwc4"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"I haven't seen him **since**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>since</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows since for it to join, so since is an adverb.","trap":"after / before / since / until","d":3,"id":"nwc5"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"Brush your teeth **before** bed.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>before</b>: <i>\"bed\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After before comes a thing (\"bed\"), so before is a preposition.","trap":"after / before / since / until","d":1,"id":"nwc6"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"Wash your hands **before** you eat.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>before</b>: <i>\"you eat\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After before comes someone doing something (\"you eat\"), so before is a conjunction.","trap":"after / before / since / until","d":1,"id":"nwc7"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"I've seen that film **before**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>before</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows before for it to join, so before is an adverb.","trap":"after / before / since / until","d":2,"id":"nwc8"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"Wait here **until** the bell rings.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>until</b>: <i>\"the bell rings\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After until comes someone doing something (\"the bell rings\"), so until is a conjunction.","trap":"after / before / since / until","d":2,"id":"nwc9"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"The shop is open **until** six o'clock.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>until</b>: <i>\"six o'clock\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After until comes a thing (\"six o'clock\"), so until is a preposition.","trap":"after / before / since / until","d":2,"id":"nwc10"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"The cat hid **behind** the sofa.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>behind</b>: <i>\"the sofa\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After behind comes a thing (\"the sofa\"), so behind is a preposition.","trap":"behind / past / round","d":1,"id":"nwc11"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"The others were left **behind**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>behind</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows behind for it to join, so behind is an adverb.","trap":"behind / past / round","d":2,"id":"nwc12"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"We drove **past** the castle.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>past</b>: <i>\"the castle\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After past comes a thing (\"the castle\"), so past is a preposition.","trap":"behind / past / round","d":2,"id":"nwc13"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"A fox ran **past**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>past</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows past for it to join, so past is an adverb.","trap":"behind / past / round","d":3,"id":"nwc14"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"The children danced **round** the maypole.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>round</b>: <i>\"the maypole\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After round comes a thing (\"the maypole\"), so round is a preposition.","trap":"behind / past / round","d":2,"id":"nwc15"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"Everyone gathered **round**.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"adverb","h":"Look at what comes straight after <b>round</b>: <i>\"(nothing)\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"Nothing follows round for it to join, so round is an adverb.","trap":"behind / past / round","d":3,"id":"nwc16"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"It rained **throughout** the night.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>throughout</b>: <i>\"the night\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After throughout comes a thing (\"the night\"), so throughout is a preposition.","trap":"despite / during / throughout","d":2,"id":"nwc17"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"**Despite** the rain, we went for a walk.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>despite</b>: <i>\"the rain\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After despite comes a thing (\"the rain\"), so despite is a preposition.","trap":"despite / during / throughout","d":2,"id":"nwc18"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"**During** the film, my phone buzzed.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"preposition","h":"Look at what comes straight after <b>during</b>: <i>\"the film\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After during comes a thing (\"the film\"), so during is a preposition.","trap":"despite / during / throughout","d":2,"id":"nwc19"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"I knew **that** she would win.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>that</b>: <i>\"she would win\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After that comes someone doing something (\"she would win\"), so that is a conjunction.","trap":"that","d":3,"id":"nwc20"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"We stayed indoors **because** it was raining.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>because</b>: <i>\"it was raining\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After because comes someone doing something (\"it was raining\"), so because is a conjunction.","trap":"conjunctions","d":1,"id":"nwc21"},{"type":"mc","q":"Is the underlined word a preposition, conjunction or adverb?","s":"She left **although** it was early.","opts":["preposition","conjunction","adverb"],"keep":true,"ans":"conjunction","h":"Look at what comes straight after <b>although</b>: <i>\"it was early\"</i>. Is it a <b>thing</b> (preposition), <b>someone doing something</b> (conjunction), or <b>nothing</b> (adverb)?","why":"After although comes someone doing something (\"it was early\"), so although is a conjunction.","trap":"conjunctions","d":2,"id":"nwc22"},{"type":"mc","q":"Which sentence uses <b>since</b> as a <b>preposition</b>?","s":null,"opts":["Since it rained, we stayed in.","I have been ill since Tuesday.","I haven't seen her since.","Since you asked, I'll tell you."],"ans":"I have been ill since Tuesday.","h":"Look at what comes straight after since in each sentence. Which one is followed by just a <b>thing</b>?","why":"\"Since Tuesday\": a thing follows, so since is a preposition. \"Since it rained\" has someone doing something (conjunction).","d":3,"trap":"after / before / since / until","notes":null,"keep":false,"id":"nwc23"},{"type":"mc","q":"Which sentence uses <b>before</b> as a <b>conjunction</b>?","s":null,"opts":["Brush your teeth before bed.","I have been here before.","Finish your work before you go out.","Before lunch, we read."],"ans":"Finish your work before you go out.","h":"Which one has <b>someone doing something</b> straight after before?","why":"\"Before you go out\": someone doing something follows, so before is a conjunction. \"Before bed\" is just a thing (preposition).","d":3,"trap":"after / before / since / until","notes":null,"keep":false,"id":"nwc24"},{"type":"mc","q":"Which sentence uses <b>after</b> as an <b>adverb</b>?","s":null,"opts":["We left after the show.","We left after the show ended.","Soon after, it began to snow.","After dinner, we played chess."],"ans":"Soon after, it began to snow.","h":"In which sentence is <b>nothing</b> joined on by after?","why":"\"Soon after,\" has nothing after it to join, so after is an adverb there.","d":3,"trap":"after / before / since / until","notes":null,"keep":false,"id":"nwc25"},{"type":"mc","q":"Which word is a <b>preposition</b>?","s":"I left my book on the table.","opts":["left","my","on","table"],"ans":"on","h":"A preposition shows where or when something is, and is followed by a thing. Is <i>left</i> a doing word (\"I left\")?","why":"\"On the table\": on is followed by a thing and shows where. Left is a verb (I left).","d":2,"trap":"preposition vs verb","notes":{"left":"\"I left\": left is something you do, so it's a verb. Which word shows <b>where</b> the book is?","my":"My is an owner word (determiner). Which word shows <b>where</b>?","table":"Table is the thing (a noun). Which word comes before it and shows <b>where</b>?"},"keep":false,"id":"nwc26"},{"type":"mc","q":"Which word is a <b>preposition</b>?","s":"The dog slept under the stairs.","opts":["dog","slept","under","stairs"],"ans":"under","h":"Which word shows where, and is followed by a thing?","why":"\"Under the stairs\": under shows where, so it's a preposition.","d":1,"trap":"preposition vs verb","notes":null,"keep":false,"id":"nwc27"},{"type":"mc","q":"Which word is a <b>conjunction</b>?","s":"We went home because it was late.","opts":["went","home","because","late"],"ans":"because","h":"Which word joins on someone doing something (a clause)?","why":"\"Because it was late\": because joins on a clause, so it's a conjunction.","d":1,"trap":"conjunctions","notes":null,"keep":false,"id":"nwc28"},{"type":"mc","q":"Which word is a <b>conjunction</b>?","s":"She smiled when she saw the cake.","opts":["smiled","when","saw","cake"],"ans":"when","h":"Which word joins on someone doing something?","why":"\"When she saw the cake\": when joins on a clause, so it's a conjunction.","d":2,"trap":"conjunctions","notes":null,"keep":false,"id":"nwc29"}],"so":[{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"The dog chased the ball.","verbs":["chased"],"ask":"Who or what chased?","ans":"dog","opts":["dog","chased","ball","none"],"why":"Who chased? The dog. So dog is the subject.","trap":"basic subject / object","d":1,"notes":null,"id":"so0"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"The dog chased the ball.","verbs":["chased"],"ask":"Chased what?","ans":"ball","opts":["dog","chased","ball","none"],"why":"Chased what? The ball. So ball is the object.","trap":"basic subject / object","d":1,"notes":null,"id":"so1"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"Mia ate an apple.","verbs":["ate"],"ask":"Who or what ate?","ans":"Mia","opts":["Mia","ate","apple","none"],"why":"Who ate? Mia. So Mia is the subject.","trap":"basic subject / object","d":1,"notes":null,"id":"so2"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"Mia ate an apple.","verbs":["ate"],"ask":"Ate what?","ans":"apple","opts":["Mia","ate","apple","none"],"why":"Ate what? An apple. So apple is the object.","trap":"basic subject / object","d":1,"notes":null,"id":"so3"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"The children laughed.","verbs":["laughed"],"ask":"Laughed what?","ans":"none","opts":["children","laughed","none"],"why":"Laughed what? Nothing! Laughed has no object here, so the answer is none.","trap":"no object","d":2,"notes":null,"id":"so4"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"Grandpa read a story to the twins.","verbs":["read"],"ask":"Read what?","ans":"story","opts":["story","twins","Grandpa","none"],"why":"Read what? A story. The twins come after \"to\", so they aren't the object.","trap":"person after to / for","d":2,"notes":{"twins":"Ask \"read <b>what</b>?\" Grandpa didn't read the twins! The twins come after <b>to</b>."},"id":"so5"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"Dad baked a cake for Sam.","verbs":["baked"],"ask":"Baked what?","ans":"cake","opts":["cake","Sam","Dad","none"],"why":"Baked what? A cake. Sam comes after \"for\", so Sam isn't the object.","trap":"person after to / for","d":2,"notes":{"Sam":"Ask \"baked <b>what</b>?\" Dad didn't bake Sam! Sam comes after <b>for</b>."},"id":"so6"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"My brother kicked the football over the fence.","verbs":["kicked"],"ask":"Kicked what?","ans":"football","opts":["brother","football","fence","none"],"why":"Kicked what? The football. The fence comes after \"over\", so it isn't the object.","trap":"basic subject / object","d":2,"notes":null,"id":"so7"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"After lunch, the class visited the museum.","verbs":["visited"],"ask":"Who or what visited?","ans":"class","opts":["lunch","class","museum","none"],"why":"Who visited? The class. \"After lunch\" is just an opening phrase.","trap":"opening phrases","d":2,"notes":{"lunch":"Ask \"who <b>visited</b>?\" Did lunch visit the museum? \"After lunch\" is just the opening phrase."},"id":"so8"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"The window was broken by the ball.","verbs":["was","broken"],"ask":"Who or what was?","ans":"window","opts":["window","ball","broken","none"],"why":"In a \"was \u2026 by\" sentence, the subject is the word before was: the window.","trap":"was / were \u2026 by","d":3,"notes":{"ball":"In a \"was \u2026 by\" sentence, the subject is the word <b>before was</b>. What comes before was?"},"id":"so9"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"The window was broken by the ball.","verbs":["was","broken"],"ask":"Was what?","ans":"none","opts":["window","ball","broken","none"],"why":"In a \"was \u2026 by\" sentence there is no object, so the answer is none. The ball comes after \"by\".","trap":"was / were \u2026 by","d":3,"notes":{"ball":"The ball comes after <b>by</b>. In a \"was \u2026 by\" sentence, the object is <b>none</b>.","window":"The window is the word before <b>was</b>, so it's the subject. What's the object in a \"was \u2026 by\" sentence?"},"id":"so10"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"The winners were chosen by the judges.","verbs":["were","chosen"],"ask":"Who or what were?","ans":"winners","opts":["winners","judges","chosen","none"],"why":"In a \"were \u2026 by\" sentence, the subject is the word before were: the winners.","trap":"was / were \u2026 by","d":3,"notes":{"judges":"The judges come after <b>by</b>. The subject is the word <b>before were</b>."},"id":"so11"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"Shocked by the news, Mum dropped her cup.","verbs":["dropped"],"ask":"Who or what dropped?","ans":"Mum","opts":["news","Mum","cup","none"],"why":"Who dropped? Mum. \"Shocked by the news\" is an opening phrase.","trap":"opening phrases","d":3,"notes":{"news":"Ask \"who <b>dropped</b> her cup?\" The news didn't! \"Shocked by the news\" is the opening phrase."},"id":"so12"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"Shocked by the news, Mum dropped her cup.","verbs":["dropped"],"ask":"Dropped what?","ans":"cup","opts":["news","Mum","cup","none"],"why":"Dropped what? Her cup.","trap":"opening phrases","d":3,"notes":null,"id":"so13"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"We ate a batch of cookies.","verbs":["ate"],"ask":"Ate what?","ans":"a batch of cookies","opts":["cookies","a batch of cookies","batch","none"],"why":"Ate what? A batch of cookies. Keep the \"of\" phrase together.","trap":"\"of\" phrases","d":3,"notes":{"cookies":"Keep the <b>of</b> phrase together: ate a batch <b>of</b> \u2026 what?","batch":"Keep the <b>of</b> phrase together: a batch <b>of</b> what?"},"id":"so14"},{"type":"so","q":"What is the <b>subject</b> of this sentence?","s":"A flock of geese flew overhead.","verbs":["flew"],"ask":"Who or what flew?","ans":"a flock of geese","opts":["geese","a flock of geese","flock","none"],"why":"Who flew? A flock of geese. Keep the \"of\" phrase together.","trap":"\"of\" phrases","d":3,"notes":{"geese":"Keep the <b>of</b> phrase together: a flock <b>of</b> geese.","flock":"Keep the <b>of</b> phrase together: a flock <b>of</b> what?"},"id":"so15"},{"type":"so","q":"What is the <b>object</b> of this sentence?","s":"In the morning, Lily walked her dog to the park.","verbs":["walked"],"ask":"Walked what?","ans":"dog","opts":["morning","Lily","dog","park"],"why":"Walked what? Her dog. Morning is the opening phrase and park comes after \"to\".","trap":"opening phrases","d":3,"notes":null,"id":"so16"}],"cl":[{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**before the race started**","opts":["clause","phrase"],"keep":true,"ans":"clause","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's a doer and a verb, so it's a clause.","trap":"clause vs phrase","d":2,"id":"cl0"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**after lunch**","opts":["clause","phrase"],"keep":true,"ans":"phrase","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's no doer + verb, so it's a phrase.","trap":"clause vs phrase","d":1,"id":"cl1"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**under the old bridge**","opts":["clause","phrase"],"keep":true,"ans":"phrase","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's no doer + verb, so it's a phrase.","trap":"clause vs phrase","d":1,"id":"cl2"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**while the kettle boiled**","opts":["clause","phrase"],"keep":true,"ans":"clause","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's a doer and a verb, so it's a clause.","trap":"clause vs phrase","d":2,"id":"cl3"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**because she was tired**","opts":["clause","phrase"],"keep":true,"ans":"clause","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's a doer and a verb, so it's a clause.","trap":"clause vs phrase","d":1,"id":"cl4"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**in the middle of the night**","opts":["clause","phrase"],"keep":true,"ans":"phrase","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's no doer + verb, so it's a phrase.","trap":"clause vs phrase","d":2,"id":"cl5"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**when the bell rang**","opts":["clause","phrase"],"keep":true,"ans":"clause","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's a doer and a verb, so it's a clause.","trap":"clause vs phrase","d":1,"id":"cl6"},{"type":"mc","q":"Is this a <b>clause</b> or a <b>phrase</b>?","s":"**the tall girl with red hair**","opts":["clause","phrase"],"keep":true,"ans":"phrase","h":"Is there <b>someone doing something</b>? Look for a doer and a verb together (the race started).","why":"There's no doer + verb, so it's a phrase.","trap":"clause vs phrase","d":3,"id":"cl7"},{"type":"mc","q":"Which is the <b>main clause</b>?","s":"We stayed in because it was snowing.","opts":["We stayed in","because it was snowing"],"ans":"We stayed in","h":"Say each part on its own. Which one makes sense <b>by itself</b> as a sentence?","why":"\"We stayed in\" makes sense on its own, so it's the main clause.","trap":"main vs subordinate clause","d":1,"id":"cl8"},{"type":"mc","q":"Which is the <b>main clause</b>?","s":"I'll help you if you ask nicely.","opts":["I'll help you","if you ask nicely"],"ans":"I'll help you","h":"Say each part on its own. Which one makes sense <b>by itself</b> as a sentence?","why":"\"I'll help you\" makes sense on its own, so it's the main clause.","trap":"main vs subordinate clause","d":1,"id":"cl9"},{"type":"mc","q":"Which is the <b>main clause</b>?","s":"Although she was tired, Ella finished the race.","opts":["Although she was tired","Ella finished the race"],"ans":"Ella finished the race","h":"Say each part on its own. Which one makes sense <b>by itself</b> as a sentence?","why":"\"Ella finished the race\" makes sense on its own, so it's the main clause.","trap":"main vs subordinate clause","d":2,"id":"cl10"},{"type":"mc","q":"Which is the <b>main clause</b>?","s":"When the bell rang, everyone rushed outside.","opts":["When the bell rang","everyone rushed outside"],"ans":"everyone rushed outside","h":"Say each part on its own. Which one makes sense <b>by itself</b> as a sentence?","why":"\"everyone rushed outside\" makes sense on its own, so it's the main clause.","trap":"main vs subordinate clause","d":2,"id":"cl11"},{"type":"mc","q":"Which is the <b>main clause</b>?","s":"The cake, which Mum had baked, disappeared quickly.","opts":["The cake disappeared quickly","which Mum had baked"],"ans":"The cake disappeared quickly","h":"Say each part on its own. Which one makes sense <b>by itself</b> as a sentence?","why":"\"The cake disappeared quickly\" makes sense on its own, so it's the main clause.","trap":"main vs subordinate clause","d":3,"id":"cl12"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"The dog barked.","opts":["simple","compound","complex"],"keep":true,"ans":"simple","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"One clause (the dog barked), so it's simple.","trap":"simple / compound / complex","d":1,"id":"cl13"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"The dog barked and the cat ran away.","opts":["simple","compound","complex"],"keep":true,"ans":"compound","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"Two clauses joined by \"and\" (a FANBOYS word), so it's compound.","trap":"simple / compound / complex","d":2,"id":"cl14"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"The dog barked because it heard a noise.","opts":["simple","compound","complex"],"keep":true,"ans":"complex","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"Two clauses joined by \"because\", so it's complex.","trap":"simple / compound / complex","d":2,"id":"cl15"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"I like apples, but my brother prefers pears.","opts":["simple","compound","complex"],"keep":true,"ans":"compound","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"Two clauses joined by \"but\", so it's compound.","trap":"simple / compound / complex","d":2,"id":"cl16"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"Although it was cold, we went swimming.","opts":["simple","compound","complex"],"keep":true,"ans":"complex","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"Two clauses joined by \"although\", so it's complex.","trap":"simple / compound / complex","d":3,"id":"cl17"},{"type":"mc","q":"Is this sentence simple, compound or complex?","s":"The tall, friendly girl with a red coat smiled at everyone.","opts":["simple","compound","complex"],"keep":true,"ans":"simple","h":"Count the clauses (doer + verb). One \u2192 <b>simple</b>. Two joined by FANBOYS (for, and, nor, but, or, yet, so) \u2192 <b>compound</b>. Joined by because, when, although, if\u2026 \u2192 <b>complex</b>.","why":"Long, but only one doer + verb (the girl smiled), so it's simple.","trap":"simple / compound / complex","d":3,"id":"cl18"},{"type":"mc","q":"Which is a <b>coordinating</b> conjunction?","s":null,"opts":["because","although","but","when"],"ans":"but","h":"Coordinating conjunctions are the FANBOYS: for, and, nor, but, or, yet, so.","why":"But is a FANBOYS word, so it's coordinating.","d":2,"trap":"FANBOYS vs subordinating","notes":null,"keep":false,"id":"cl19"},{"type":"mc","q":"Which is a <b>subordinating</b> conjunction?","s":null,"opts":["and","so","or","unless"],"ans":"unless","h":"FANBOYS (for, and, nor, but, or, yet, so) are coordinating. Which word is NOT a FANBOYS word?","why":"Unless isn't a FANBOYS word; it starts a subordinate clause.","d":3,"trap":"FANBOYS vs subordinating","notes":null,"keep":false,"id":"cl20"},{"type":"mc","q":"What type of conjunction is the underlined word?","s":"It was sunny, **yet** cold.","opts":["coordinating","subordinating"],"ans":"coordinating","h":"Is it one of the FANBOYS (for, and, nor, but, or, yet, so)?","why":"Yet is a FANBOYS word, so it's coordinating.","d":3,"trap":"FANBOYS vs subordinating","notes":null,"keep":true,"id":"cl21"},{"type":"mc","q":"Choose the correct word.","s":"The girl ___ won the prize is my friend.","opts":["who","whom","whose"],"keep":true,"ans":"who","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"The girl did the winning, so it's who (she won).","trap":"who / whom / whose","d":1,"id":"cl22"},{"type":"mc","q":"Choose the correct word.","s":"The boy ___ bike was stolen called the police.","opts":["who","whom","whose"],"keep":true,"ans":"whose","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"The bike belongs to the boy, so it's whose.","trap":"who / whom / whose","d":2,"id":"cl23"},{"type":"mc","q":"Choose the correct word.","s":"The man ___ dog barks all night lives next door.","opts":["who","whom","whose"],"keep":true,"ans":"whose","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"The dog belongs to the man, so it's whose.","trap":"who / whom / whose","d":2,"id":"cl24"},{"type":"mc","q":"Choose the correct word.","s":"The woman with ___ I spoke was very kind.","opts":["who","whom","whose"],"keep":true,"ans":"whom","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"Straight after \"with\", so it's whom (I spoke with her/him).","trap":"who / whom / whose","d":3,"id":"cl25"},{"type":"mc","q":"Choose the correct word.","s":"To ___ should I give this letter?","opts":["who","whom","whose"],"keep":true,"ans":"whom","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"Straight after \"to\", so it's whom (give it to him).","trap":"who / whom / whose","d":3,"id":"cl26"},{"type":"mc","q":"Choose the correct word.","s":"The friend for ___ I bought the gift loved it.","opts":["who","whom","whose"],"keep":true,"ans":"whom","h":"Owner straight after (bike, dog)? \u2192 <b>whose</b>. Straight after with / to / for? \u2192 <b>whom</b>. Doing the action? \u2192 <b>who</b>.","why":"Straight after \"for\", so it's whom.","trap":"who / whom / whose","d":3,"id":"cl27"}],"wb":[{"type":"mc","q":"Which is a <b>compound</b> word?","s":null,"opts":["football","carpet","island","careful"],"ans":"football","h":"Simple = one root word (jump). Compound = two real words joined, and the meaning comes from both (football, pencil case, state-of-the-art). Complex = a root plus a prefix or suffix (un-happi-ness, care-ful). Check: do the two parts really make the meaning? (A carpet isn't a pet in a car!)","why":"Foot + ball = a ball you kick with your foot. Carpet, island and careful are fake compounds.","d":2,"trap":"fake compounds","notes":null,"keep":false,"id":"wb0"},{"type":"mc","q":"Which is <b>NOT</b> a true compound word?","s":null,"opts":["sunflower","toothbrush","carpet","rainbow"],"ans":"carpet","h":"Do both parts really build the meaning? Is a carpet a pet that rides in a car?","why":"Car + pet doesn't make \"carpet\", so it's not a true compound.","d":2,"trap":"fake compounds","notes":null,"keep":false,"id":"wb1"},{"type":"mc","q":"Which is a <b>simple</b> word?","s":null,"opts":["island","homework","careless","rewrite"],"ans":"island","h":"Island looks like is + land, but does the meaning come from \"is\" and \"land\"?","why":"Island is one root word (fake compound), so it's simple. Homework is compound; careless and rewrite are complex.","d":3,"trap":"fake compounds","notes":null,"keep":false,"id":"wb2"},{"type":"mc","q":"What type of word is <b>careful</b>?","s":null,"opts":["simple","compound","complex"],"ans":"complex","h":"Simple = one root word (jump). Compound = two real words joined, and the meaning comes from both (football, pencil case, state-of-the-art). Complex = a root plus a prefix or suffix (un-happi-ness, care-ful). Is \"ful\" a real word on its own?","why":"Care + the suffix -ful (\"ful\" isn't a word on its own), so careful is complex, not compound.","d":3,"trap":"fake compounds","notes":null,"keep":true,"id":"wb3"},{"type":"mc","q":"What type of word is <b>unhappiness</b>?","s":null,"opts":["simple","compound","complex"],"ans":"complex","h":"Simple = one root word (jump). Compound = two real words joined, and the meaning comes from both (football, pencil case, state-of-the-art). Complex = a root plus a prefix or suffix (un-happi-ness, care-ful).","why":"Un- (prefix) + happy + -ness (suffix), so it's complex.","d":2,"trap":"simple / compound / complex words","notes":null,"keep":true,"id":"wb4"},{"type":"mc","q":"What type of word is <b>jump</b>?","s":null,"opts":["simple","compound","complex"],"ans":"simple","h":"Simple = one root word (jump). Compound = two real words joined, and the meaning comes from both (football, pencil case, state-of-the-art). Complex = a root plus a prefix or suffix (un-happi-ness, care-ful).","why":"Jump is one root word, so it's simple.","d":1,"trap":"simple / compound / complex words","notes":null,"keep":true,"id":"wb5"},{"type":"mc","q":"What type of word is <b>bedroom</b>?","s":null,"opts":["simple","compound","complex"],"ans":"compound","h":"Simple = one root word (jump). Compound = two real words joined, and the meaning comes from both (football, pencil case, state-of-the-art). Complex = a root plus a prefix or suffix (un-happi-ness, care-ful).","why":"Bed + room: two real words that build the meaning, so it's compound.","d":1,"trap":"simple / compound / complex words","notes":null,"keep":true,"id":"wb6"},{"type":"mc","q":"Is <b>pencil case</b> a compound word?","s":null,"opts":["yes, an open compound","no, just two separate words"],"ans":"yes, an open compound","h":"A compound can be written as one word (closed), with a space (open) or with hyphens. Does \"pencil case\" name one thing?","why":"Pencil case names one thing, written with a space, so it's an open compound.","d":3,"trap":"open / hyphenated compounds","notes":null,"keep":true,"id":"wb7"},{"type":"mc","q":"What type of compound is <b>state-of-the-art</b>?","s":null,"opts":["hyphenated","open","closed","not a compound"],"ans":"hyphenated","h":"Look at how it's written: one word (closed), a space (open) or hyphens?","why":"It's joined with hyphens, so it's a hyphenated compound.","d":3,"trap":"open / hyphenated compounds","notes":null,"keep":true,"id":"wb8"},{"type":"mc","q":"Which is a <b>closed</b> compound?","s":null,"opts":["ice cream","sunflower","mother-in-law","bus stop"],"ans":"sunflower","h":"Closed = written as one word with no space or hyphen.","why":"Sunflower is written as one word, so it's a closed compound.","d":2,"trap":"open / hyphenated compounds","notes":null,"keep":false,"id":"wb9"},{"type":"mc","q":"Choose the correctly spelt word.","s":"It was a ___ morning, so I wore a scarf.","opts":["chilli","chilly","chili"],"ans":"chilly","h":"Read the sentence with each word. Which one means the right thing?","why":"<b>chilly</b>: chilly = cold.","d":1,"trap":"homophones","notes":{"chilli":"chilli = a hot, spicy pepper.","chilly":"chilly = cold.","chili":"chili is the American spelling."},"keep":false,"id":"wb10"},{"type":"mc","q":"Choose the correctly spelt word.","s":"She added a ___
